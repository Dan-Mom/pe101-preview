 "sections": [
  "<section class=\"lesson-section\" id=\"p0-what-is-a-pe-fund-s1\">\n  <h2><span>1</span>What a PE Fund Actually Is</h2>\n  <p class=\"eyebrow\">The Three-Step Ladder</p>\n  <div class=\"flow\">\n    <div><b>One sentence</b><p>A private equity fund is a pooled investment vehicle — usually a limited partnership — where outside investors commit capital that a professional manager invests in private companies, aiming to sell them later at a profit.</p></div>\n    <div><b>A tiny number</b><p>Picture a $100M fund (illustrative). Outside investors promise $98M, the general partner promises the last $2M, and nobody wires the full amount on day one: cash is called as deals come up.</p></div>\n    <div><b>Stanmere</b><p>Stanmere Capital Partners I, L.P., the fund this course follows, has $250M of commitments: $5M (2.0%) from its GP and $245M from six LPs, admitted at three closes from 2 Jan 2019 to 30 Jun 2020. It is a legal entity separate from both the manager and the investors, with its own books, bank account and financial statements, which is exactly why fund accounting exists as its own discipline.</p></div>\n  </div>\n  <p class=\"insight\"><b>Why this module is first:</b> almost every later module is about money or information moving between the same few players. Learn the cast once, and the rest of the course is just following them around the map. A fund raises money, invests it over about five years, sells the companies and winds up; Stanmere runs from 2019 to 2030.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p0-what-is-a-pe-fund-s2\">\n  <h2><span>2</span>The Two Principals: GP and LP</h2>\n  <p class=\"eyebrow\">Who Runs It vs Who Funds It</p>\n  <p>Two roles sit at the center of every fund. Keeping them straight is the first thing a fund accountant has to get right:</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>General Partner (GP)</h3><p>Stanmere Capital GP I, LLC is the GP. It sources deals, calls capital, makes the buy and sell decisions, and runs the fund day to day. It invests a small slice of its own money, a \"GP commitment\" (here 2.0% of the fund), so its incentives line up with investors. Its affiliated manager, Stanmere Capital Management, LLC, earns a 2% annual management fee, and a related vehicle, Stanmere Carry I, LLC, admitted as the fund's special limited partner (a partner with no commitment whose only economic right is the carry, which keeps the carry apart from the GP entity), earns a 20% profit share called carried interest.</p></div>\n    <div class=\"card\"><h3>Limited Partners (LPs)</h3><p>Stanmere's six LPs are a state retirement system, a university endowment, an insurance company, a fund-of-funds, a family holding company and a trust company. They commit capital, wire cash when it is called, and receive distributions, but they stay passive: they do not run the fund or pick the deals. Their liability is limited to what they commit, which is where the name comes from.</p></div>\n  </div>\n  <p class=\"insight\"><b>Why this matters for the books:</b> the GP/LP split is the backbone of nearly every fund entry. Contributions and distributions move through partners' capital accounts, and the LPA — the governing contract — decides who can do what.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p0-what-is-a-pe-fund-s3\">\n  <h2><span>3</span>Administrator and Auditor</h2>\n  <p class=\"eyebrow\">The Independent Check</p>\n  <p>The GP does not keep or bless its own numbers alone. Two independent service providers exist so investors can trust figures they cannot check themselves:</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>Fund Administrator</h3><p>A third-party administrator keeps the fund's books, calculates NAV, processes capital calls and distributions, and produces investor statements. Many GPs outsource this so the numbers are struck by someone independent of the deal team.</p></div>\n    <div class=\"card\"><h3>Independent Auditor</h3><p>Once a year, an external audit firm audits the fund's financial statements — most importantly, testing whether the fair values the GP assigned to private investments are reasonable. The audit is what gives LPs confidence in numbers they cannot check on their own.</p></div>\n  </div>\n  <p class=\"insight\"><b>The wider cast:</b> a custodian bank, tax preparers, and legal counsel orbit the fund too — but the administrator and auditor are the two the fund accountant works with most.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p0-what-is-a-pe-fund-s4\">\n  <h2><span>4</span>The One Map the Course Returns To</h2>\n  <p class=\"eyebrow\">The Map</p>\n  <p>Here is the whole cast in one place. Money flows down from investors, into the fund, and out to portfolio companies; value and proceeds flow back up. The GP directs the fund from the side; the administrator and auditor support and check it.</p>\n  <table><thead><tr><th>Player</th><th>Role</th><th>What flows to / from the fund</th></tr></thead><tbody>\n    <tr><td>LPs (Stanmere's six institutions)</td><td>Provide capital, stay passive</td><td>Commit and wire capital in; receive distributions out</td></tr>\n    <tr><td>GP (Stanmere Capital GP I, LLC)</td><td>Runs the fund, makes decisions</td><td>Small GP commitment in; signs the statements. The management fee goes out to its affiliated manager, and carry to Stanmere Carry I, LLC, the special limited partner</td></tr>\n    <tr><td>The Fund (Stanmere Capital Partners I, L.P.)</td><td>The legal pool that owns the investments</td><td>Holds cash between calls and deals; keeps its own books and NAV</td></tr>\n    <tr><td>Portfolio companies</td><td>Where capital is actually invested</td><td>Receive investment; return exit proceeds later</td></tr>\n    <tr><td>Administrator</td><td>Independent bookkeeper</td><td>Strikes NAV, produces investor statements</td></tr>\n    <tr><td>Auditor</td><td>Annual independent check</td><td>Tests fair values, opines on the statements</td></tr>\n  </tbody></table>\n  <p class=\"insight\"><b>This is the map every later module zooms into:</b> capital calls (Module 2.1) are the LP-to-fund flow; investments (3.1) are the fund-to-portfolio flow; distributions and the waterfall (5.1–5.2) are the fund-to-LP flow; the fund's financial statements (6.1) are what the administrator produces and the auditor checks.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p0-what-is-a-pe-fund-s5\">\n  <h2><span>5</span>How the Pieces Connect</h2>\n  <p class=\"eyebrow\">Closing the Loop</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>The fund is its own entity</h3><p>The single most important structural fact: the fund's books are not the GP's books and not the LPs' books. When an LP wires called capital, the entry on Stanmere's books is Dr. Cash and cash equivalents / Cr. Partners' capital – contributions. The manager records its fee income on its own separate books.</p></div>\n    <div class=\"card\"><h3>What goes wrong here</h3><p>Beginners often blur the three sets of books — treating the GP's fee income, the fund's investments, and an LP's own accounting as if they lived in one ledger. They don't. Every entry in this course belongs to the fund entity unless it says otherwise.</p></div>\n  </div>\n  <p class=\"warn\">This module has no calculator — it is the map, not a model. Keep this cast in mind: every later module is one flow on this map, traced in full detail.</p>\n  <p class=\"eyebrow\">Disclosure</p>\n  <p><small>Stanmere Capital Partners I, L.P., Stanmere Capital GP I, LLC and every entity named in this module are fictional and were created for instructional purposes. Any resemblance to an actual fund, firm or company is coincidental.</small></p>\n</section>"
 ]

  {
   "term": "Investment Company (ASC 946)",

 "sections": [
  "<section class=\"lesson-section\" id=\"p0-why-fund-accounting-differs-s1\">\n  <h2><span>1</span>Why Fund Accounting Is Different</h2>\n  <p class=\"eyebrow\">The Three-Step Ladder</p>\n  <div class=\"flow\">\n    <div><b>One sentence</b><p>A PE fund keeps its books as an investment company: it measures what it owns at fair value and reports investor stakes as capital, unlike a normal company's cost-and-consolidation model.</p></div>\n    <div><b>A tiny number</b><p>A fund buys 80% of an operating company for $10M (illustrative). A normal parent owning 80% would consolidate that company line by line. An investment-company fund does not — it reports one line: Investment in the company, at fair value.</p></div>\n    <div><b>Stanmere</b><p>Stanmere Capital Partners I, L.P. follows U.S. GAAP for investment companies (ASC 946). It buys Thornwick Industrial Holdings, Inc. for $42.0M on 30 Jun 2019, and by 31 Dec 2019 the stake is marked to a fair value of $43.5M. Thornwick's own revenue, expenses and debt never appear on Stanmere's statements. Outside the US, IFRS reaches a similar place through its investment-entity rules, but statement names and details differ.</p></div>\n  </div>\n  <p class=\"insight\"><b>Why this matters:</b> almost every \"that's weird\" moment in fund accounting traces back to this one idea. The fund is an investor in companies, not an operator of them, so it accounts for holdings, not operations.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p0-why-fund-accounting-differs-s2\">\n  <h2><span>2</span>Fair Value, Not Cost-and-Depreciation</h2>\n  <p class=\"eyebrow\">Held at What It's Worth</p>\n  <p>An operating company records its equipment and buildings at cost and depreciates them over time. A fund does almost the opposite for its investments — it carries them at fair value and updates that value every reporting period, running the change through income:</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>At purchase</h3><p>On 30 Jun 2019 Stanmere pays $42.0M for Thornwick:<br>Dr. Investments, at cost $42.0M<br>Cr. Cash and cash equivalents $42.0M<br>The investment goes on at cost — the same as anyone else on day one.</p></div>\n    <div class=\"card\"><h3>At the first mark-up</h3><p>At 31 Dec 2019 Thornwick is marked up $1.5M, to a fair value of $43.5M:<br>Dr. Unrealized appreciation/(depreciation) on investments $1.5M<br>Cr. Net change in unrealized appreciation/(depreciation) $1.5M<br>That gain flows through the statement of operations even though nothing was sold and no cash moved.</p></div>\n  </div>\n  <p class=\"insight\"><b>The key contrast:</b> the fund does not depreciate Thornwick's factory or equipment — those sit on Thornwick's own books. The fund owns an investment. It tracks the investment's cost and any income received from it, but the number it updates each period is what that investment is worth.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p0-why-fund-accounting-differs-s3\">\n  <h2><span>3</span>No Portfolio Consolidation</h2>\n  <p class=\"eyebrow\">Control Without Consolidation</p>\n  <p>This is the rule that surprises people most. Normally, controlling more than half of a company means you consolidate it. Investment companies are a specific exception: ASC 946 tells a fund to hold even a controlling investment at fair value instead of consolidating it.</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>What a normal parent does</h3><p>An operating parent with a controlling stake would add the company's assets, liabilities, revenue, and expenses to its own statements. It would then show a non-controlling interest — the share owned by the other investors.</p></div>\n    <div class=\"card\"><h3>What the fund does</h3><p>Stanmere lists each company as one line on its schedule of investments: \"Thornwick Industrial Holdings, Inc., at fair value.\" Thornwick's own revenue and debt do not appear on the fund's books, however large the stake.</p></div>\n  </div>\n  <figure class=\"pe-fig\">\n    <svg viewBox=\"0 0 700 250\" role=\"img\" aria-label=\"Two columns contrast a controlling stake. Left, dashed, a normal parent (not what Stanmere does) consolidates the company's assets, liabilities, revenue and debt and shows a non-controlling interest. Right, solid green, Stanmere shows one line: the investment at fair value, with the company's own revenue and debt staying off the fund's books.\">\n      <defs>\n        <marker id=\"ah-w3a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8Z\" fill=\"#9A9585\"/></marker>\n        <marker id=\"ah-w3b\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8Z\" fill=\"#0F6E56\"/></marker>\n      </defs>\n      <rect class=\"b-along\" x=\"30\" y=\"20\" width=\"280\" height=\"64\" rx=\"10\"/>\n      <text class=\"t-hd\" x=\"44\" y=\"42\">A normal parent</text>\n      <text class=\"t-mut\" x=\"44\" y=\"58\">(not what Stanmere does)</text>\n      <text x=\"44\" y=\"76\" font-size=\"11\">controls the company</text>\n      <path class=\"ar-al\" d=\"M170 90 L170 128\" marker-end=\"url(#ah-w3a)\"/>\n      <rect class=\"b-along\" x=\"30\" y=\"130\" width=\"280\" height=\"86\" rx=\"10\"/>\n      <text x=\"44\" y=\"154\" font-size=\"11\">Consolidates its assets,</text>\n      <text x=\"44\" y=\"170\" font-size=\"11\">liabilities, revenue and debt</text>\n      <text class=\"t-mut\" x=\"44\" y=\"190\">+ a non-controlling interest</text>\n      <rect class=\"b-fund\" x=\"390\" y=\"20\" width=\"280\" height=\"64\" rx=\"10\"/>\n      <text class=\"t-hd t-w\" x=\"404\" y=\"42\">Stanmere (investment co.)</text>\n      <text class=\"t-w\" x=\"404\" y=\"60\" font-size=\"11\">controls the company</text>\n      <path class=\"ar-i\" d=\"M530 90 L530 128\" marker-end=\"url(#ah-w3b)\"/>\n      <rect class=\"b-fund\" x=\"390\" y=\"130\" width=\"280\" height=\"86\" rx=\"10\"/>\n      <text class=\"t-hd t-w\" x=\"404\" y=\"154\">One line only:</text>\n      <text class=\"t-w\" x=\"404\" y=\"172\" font-size=\"11\">Investment, at fair value</text>\n      <text class=\"t-w\" x=\"404\" y=\"190\" font-size=\"11\">revenue and debt stay off</text>\n    </svg>\n    <figcaption>Left (dashed): a normal parent consolidates a controlled company. Right (green): Stanmere reports one line at fair value.</figcaption>\n  </figure>\n</section>",
  "<section class=\"lesson-section\" id=\"p0-why-fund-accounting-differs-s4\">\n  <h2><span>4</span>Capital Accounts, Not Share Equity</h2>\n  <p class=\"eyebrow\">Partners' Capital, Not Retained Earnings</p>\n  <p>A corporation's equity section shows share capital and retained earnings, and it reports earnings per share. A PE fund structured as a limited partnership has none of that. Its \"equity\" is partners' capital — one capital account per investor — with no retained earnings line and no EPS:</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>How the investor's stake is tracked</h3><p>Stanmere keeps eight capital accounts: one for the GP, one for each of its six LPs, and one for Stanmere Carry I, LLC, the special limited partner that receives carry. Each account goes up with contributions and allocated gains and down with distributions and allocated losses. The sum of all capital accounts is the fund's net assets — its NAV.</p></div>\n    <div class=\"card\"><h3>How income is reported</h3><p>The fund does not retain earnings the way a corporation does. Each period's income is allocated out to the partners' capital accounts per the LPA. The headline statement is the Statement of Changes in Partners' Capital (ASC 946 calls it the statement of changes in net assets), not a retained-earnings roll-forward.</p></div>\n  </div>\n</section>",
  "<section class=\"lesson-section\" id=\"p0-why-fund-accounting-differs-s5\">\n  <h2><span>5</span>The Contrast + What Goes Wrong</h2>\n  <p class=\"eyebrow\">Operating Company vs Fund</p>\n  <table><thead><tr><th>Question</th><th>Operating company</th><th>PE fund (investment company)</th></tr></thead><tbody>\n    <tr><td>How are the assets carried?</td><td>Equipment and buildings at cost, then depreciated</td><td>Investments at fair value, remarked every period</td></tr>\n    <tr><td>A controlled subsidiary?</td><td>Consolidated line by line</td><td>Held at fair value, not consolidated</td></tr>\n    <tr><td>What is the equity section?</td><td>Share capital + retained earnings</td><td>Partners' capital accounts (NAV)</td></tr>\n    <tr><td>Where does periodic income go?</td><td>Retained earnings</td><td>Allocated to partners' capital</td></tr>\n    <tr><td>Headline statements</td><td>Balance sheet, P&amp;L, cash flows</td><td>Assets &amp; liabilities, schedule of investments, operations, changes in partners' capital, cash flows, financial highlights</td></tr>\n  </tbody></table>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>The entries, in one line each</h3><p>Buy: Dr. Investments, at cost / Cr. Cash and cash equivalents, $42.0M.<br>Mark: Dr. Unrealized appreciation/(depreciation) on investments (1110) / Cr. Net change in unrealized appreciation/(depreciation) (6100), $1.5M.<br>No consolidation entry and no depreciation entry for the portfolio company.</p></div>\n    <div class=\"card\"><h3>What goes wrong here</h3><p>The most serious beginner error is consolidating a portfolio company — pulling its revenue and debt onto Stanmere's statements because the fund \"controls\" it. For an investment company that is wrong: the holding stays at fair value. The mirror-image mistake is depreciating a portfolio company's assets on the fund's books; the fund owns an investment, not the equipment.</p></div>\n  </div>\n  <p class=\"warn\">This module has no calculator. The standards behind it are fair value measurement (ASC 820) and investment-company accounting (ASC 946). Module 3.2 shows how the quarterly marks are made, and Module 6.1 walks through each statement.</p>\n  <p class=\"eyebrow\">Disclosure</p>\n  <p><small>Stanmere Capital Partners I, L.P. and every entity named in this module are fictional and were created for instructional purposes. Any resemblance to an actual fund, firm or company is coincidental.</small></p>\n</section>"
 ]

 "glossary": [
  {
   "term": "Capital Commitment",
   "def": "The total amount an LP promises to invest in a fund over its life — not cash paid yet, just a legal promise to pay when called."
  },
  {
   "term": "Capital Call (Drawdown)",
   "def": "The fund's formal request for an LP to wire a specific slice of its unfunded commitment, usually to fund a new investment or pay expenses."

  {
   "term": "Cost Basis vs Fair Value",

  {
   "term": "Waterfall",
   "def": "The contractual order that decides who gets exit cash first: LP capital back, then a preferred return, then a catch-up to the carry side, then a residual split."

 "sections": [
  "<section class=\"lesson-section\" id=\"p0-follow-one-dollar-s1\">\n  <h2><span>1</span>Three-Step Ladder: One Dollar, Six Stops</h2>\n  <p class=\"eyebrow\">The Three-Step Ladder</p>\n  <div class=\"flow\">\n    <div><b>One sentence</b><p>Every dollar an LP puts into a PE fund makes the same trip: committed, called, invested and marked, sold, distributed through a waterfall, and finally reported on a K-1.</p></div>\n    <div><b>A tiny number</b><p>An investor commits $100 (illustrative). Only $25 is called, for one deal. Years later that slice sells for $40: the $25 comes back plus a $15 gain, and the waterfall decides who gets the gain.</p></div>\n    <div><b>Stanmere</b><p>Now follow one dollar of Stanmere Capital Partners I, L.P.'s $250M of commitments through the same six stops. Each stop gets its own full module later; this is the fast version, the trailer.</p></div>\n  </div>\n  <p class=\"insight\"><b>Why this module exists first:</b> fund accounting is confusing when you only see one stop at a time. Seeing the whole trip once makes every later module click into a spot you already recognize.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p0-follow-one-dollar-s2\">\n  <h2><span>2</span>Stops 1-2: Commitment to Capital Call</h2>\n  <p class=\"eyebrow\">From Promise to Cash</p>\n  <p>A commitment and a capital call are not the same event, and mixing them up is a classic beginner mistake:</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>Stop 1 · Commitment</h3><p>Each Stanmere LP signs a subscription agreement promising a fixed amount over the fund's life. No cash moves yet, and no journal entry is booked: a commitment stays off the balance sheet until it is called.</p></div>\n    <div class=\"card\"><h3>Stop 2 · Capital Call</h3><p>Stanmere sends a call notice to fund a deal. The LPs wire their share, and this is the first moment a journal entry exists:<br>Dr. Cash and cash equivalents<br>Cr. Partners' capital – contributions</p></div>\n  </div>\n  <p class=\"insight\"><b>What stays off the books:</b> whatever an LP has not yet been asked for is its unfunded commitment. It is tracked in the investor records, not in the ledger, until a future call.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p0-follow-one-dollar-s3\">\n  <h2><span>3</span>Stop 3: The Dollar Goes to Work</h2>\n  <p class=\"eyebrow\">Investment and Fair Value</p>\n  <p>Once called, the dollar does not sit as cash for long — it becomes an investment, and from that point on its reported value can move every quarter even though nothing has been sold:</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>At purchase</h3><p>Dr. Investments, at cost<br>Cr. Cash and cash equivalents<br>The investment goes on the books at cost. No gain or loss yet.</p></div>\n    <div class=\"card\"><h3>Every quarter after</h3><p>Stanmere marks each portfolio company to fair value at every quarter-end. A rise or fall is booked to Unrealized appreciation/(depreciation) on investments, with the other side in Net change in unrealized appreciation/(depreciation). It is a paper move only: no cash changes hands and nothing is distributable yet.</p></div>\n  </div>\n  <p class=\"insight\"><b>Why this matters later:</b> fair value marks give everyone an updated read on what the investment is worth before the sale, but they do not lock in a gain or loss. That happens only at the next stop, when the company is actually sold.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p0-follow-one-dollar-s4\">\n  <h2><span>4</span>Stops 4-5: Exit, Waterfall, and Distribution</h2>\n  <p class=\"eyebrow\">Coming Home Through the Waterfall</p>\n  <p>Years later, Stanmere sells the company. The cash comes into the fund first, and the waterfall decides how it splits between the partners and the carry side before anyone is paid:</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>Stop 4 · Exit</h3><p>Dr. Cash and cash equivalents<br>Cr. Investments, at cost<br>Cr. Net realized gain/(loss) on investments<br>The cost comes off the books and the difference is a realized gain. The earlier paper marks are reversed at the same time (Module 3.3).</p></div>\n    <div class=\"card\"><h3>Stop 5 · Waterfall and Distribution</h3><p>Stanmere's LPA runs a whole-fund (European) waterfall: partners get their capital back first, then an 8% preferred return, then a 100% catch-up to the carry side, then a 20% carried interest split. Cash goes out and the partners' capital accounts go down.</p></div>\n  </div>\n  <p class=\"insight\"><b>This is intentionally the light version.</b> The tier-by-tier math is its own module (5.2), and the distribution entry is in Module 5.1. Here, the point is only that exit cash does not go straight from the fund to the LP; it runs through a contractual order first.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p0-follow-one-dollar-s5\">\n  <h2><span>5</span>Stop 6: The K-1, and the Accounts You Just Met</h2>\n  <p class=\"eyebrow\">The Paper Trail</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>Stop 6 · Schedule K-1</h3><p>Once a year, each LP receives a K-1 reporting its allocated share of the fund's taxable income, gain, and deductions for the year — a tax number, not a cash number. No journal entry (Module 7.1).</p></div>\n    <div class=\"card\"><h3>What goes wrong here</h3><p>The most common mix-up: assuming the K-1 figure equals the cash the LP actually received. It usually does not — the K-1 follows tax allocations and taxable realization rules, while cash follows the waterfall and distribution timing.</p></div>\n  </div>\n  <p>Ten accounts from Stanmere's chart of accounts carry almost the whole trip:</p>\n  <table><thead><tr><th>No.</th><th>Account</th><th>Where the dollar meets it</th></tr></thead><tbody>\n    <tr><td>1000</td><td>Cash and cash equivalents</td><td>Every stop that moves cash</td></tr>\n    <tr><td>1100</td><td>Investments, at cost</td><td>Stop 3 on, Stop 4 off</td></tr>\n    <tr><td>1110</td><td>Unrealized appreciation/(depreciation) on investments</td><td>Quarterly marks</td></tr>\n    <tr><td>2000</td><td>Accounts payable and accrued expenses</td><td>Fund bills not yet paid</td></tr>\n    <tr><td>2100</td><td>Management fee payable</td><td>Fee billed, not yet paid</td></tr>\n    <tr><td>3000</td><td>Partners' capital – contributions</td><td>Stop 2, capital called</td></tr>\n    <tr><td>3100</td><td>Partners' capital – distributions</td><td>Stop 5, cash paid back out</td></tr>\n    <tr><td>5000</td><td>Management fee</td><td>The 2% annual fee, billed quarterly</td></tr>\n    <tr><td>6000</td><td>Net realized gain/(loss) on investments</td><td>Stop 4, the sale</td></tr>\n    <tr><td>6100</td><td>Net change in unrealized appreciation/(depreciation)</td><td>Quarterly marks</td></tr>\n  </tbody></table>\n  <p class=\"eyebrow\">Disclosure</p>\n  <p><small>Stanmere Capital Partners I, L.P. and every entity named in this module are fictional and were created for instructional purposes. Any resemblance to an actual fund, firm or company is coincidental.</small></p>\n</section>"
 ]
};

 "sections": [
  "<section class=\"lesson-section\" id=\"p1-fund-structures-s1\">\n  <h2><span>1</span>Three-Step Ladder: A Fund Is a Stack of Entities</h2>\n  <p class=\"eyebrow\">The Three-Step Ladder</p>\n  <div class=\"flow\">\n    <div><b>One sentence</b><p>\"The fund\" is rarely one company. It is a small stack of legal entities, and a fund accountant has to know which one each number belongs to.</p></div>\n    <div><b>A tiny number</b><p>Picture an illustrative $100 fund. The outside investors, the LPs, commit $98 to a limited partnership. The general partner commits the other $2 and runs the fund. A separate management company bills the fee. A carry vehicle waits for its share of the profit.</p></div>\n    <div><b>The real mechanics</b><p>Stanmere Capital Partners I, L.P. is a $250M fund built on the same four core entities: the fund, its general partner, its management company and its carry vehicle. Only one of them, the fund, is the reporting entity whose financial statements you prepare.</p></div>\n  </div>\n  <p class=\"insight\"><b>Why this module matters:</b> Before you book a single entry, you have to place it. Which entity does this trial balance belong to?</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-fund-structures-s2\">\n  <h2><span>2</span>The Core Four: Fund, GP, Manager, Carry Vehicle</h2>\n  <p class=\"eyebrow\">Four Roles, Four Sets of Books</p>\n  <figure class=\"pe-fig\">\n    <svg viewBox=\"0 0 700 300\" role=\"img\" aria-label=\"The fund sits at the centre. The GP's capital account is recorded on the fund's books. The fund pays a management fee to the manager, and carried interest goes to the carry vehicle.\">\n      <defs>\n        <marker id=\"ah-s2g\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8Z\" fill=\"#C9A24B\"/></marker>\n        <marker id=\"ah-s2i\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8Z\" fill=\"#0F6E56\"/></marker>\n      </defs>\n      <rect class=\"b-fund\" x=\"250\" y=\"118\" width=\"210\" height=\"70\" rx=\"10\"/>\n      <text class=\"t-hd t-w\" x=\"266\" y=\"143\">Stanmere Capital</text>\n      <text class=\"t-hd t-w\" x=\"266\" y=\"160\">Partners I, L.P.</text>\n      <text class=\"t-w\" x=\"266\" y=\"178\">THE FINANCIAL STATEMENTS</text>\n\n      <rect class=\"b-sep\" x=\"40\" y=\"26\" width=\"190\" height=\"52\" rx=\"9\"/>\n      <text class=\"t-hd\" x=\"52\" y=\"48\">Stanmere Capital GP I, LLC</text>\n      <text class=\"t-mut\" x=\"52\" y=\"66\">general partner · own ledger</text>\n\n      <rect class=\"b-sep\" x=\"34\" y=\"222\" width=\"210\" height=\"52\" rx=\"9\"/>\n      <text class=\"t-hd\" x=\"46\" y=\"244\">Stanmere Capital Mgmt, LLC</text>\n      <text class=\"t-mut\" x=\"46\" y=\"262\">manager · own P&amp;L</text>\n\n      <rect class=\"b-sep\" x=\"470\" y=\"222\" width=\"190\" height=\"52\" rx=\"9\"/>\n      <text class=\"t-hd\" x=\"482\" y=\"244\">Stanmere Carry I, LLC</text>\n      <text class=\"t-mut\" x=\"482\" y=\"262\">receives carried interest</text>\n\n      <path class=\"ar-i\" d=\"M150 78 C 190 110, 230 118, 258 130\" marker-end=\"url(#ah-s2i)\"/>\n      <text class=\"cap\" x=\"150\" y=\"104\">capital account sits on the fund's books</text>\n\n      <path class=\"ar\" d=\"M262 178 C 215 190, 175 205, 150 222\" marker-end=\"url(#ah-s2g)\"/>\n      <text class=\"cap\" x=\"60\" y=\"200\">2% management fee, a fund expense</text>\n\n      <path class=\"ar\" d=\"M452 178 C 500 192, 530 205, 556 222\" marker-end=\"url(#ah-s2g)\"/>\n      <text class=\"cap\" x=\"430\" y=\"205\">20% carried interest</text>\n\n      <text class=\"t-mut\" x=\"486\" y=\"40\">4 roles →</text>\n      <text class=\"t-mut\" x=\"486\" y=\"56\">4 separate sets of books</text>\n    </svg>\n    <figcaption>Gold = money moves along this line; green = recorded in the fund's books without a payment. Only the centre box is \"the financial statements\".</figcaption>\n  </figure>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>The fund — Stanmere Capital Partners I, L.P.</h3><p>The pooled limited partnership that holds the investments and keeps a capital account for each partner. This entity is the financial statements. Everything else is measured by how it touches this one.</p></div>\n    <div class=\"card\"><h3>The general partner — Stanmere Capital GP I, LLC</h3><p>Controls the fund, signs for it, and commits $5M of its own money. It is a partner in the fund, so its capital account sits on the fund's books, while the GP entity's own ledger is separate.</p></div>\n    <div class=\"card\"><h3>The management company — Stanmere Capital Management, LLC</h3><p>Employs the deal team, pays salaries and rent, and receives the management fee. Its own profit and loss is not the fund's. The fund records the fee it owes, not the manager's salaries or rent.</p></div>\n    <div class=\"card\"><h3>The carry vehicle — Stanmere Carry I, LLC</h3><p>The vehicle that receives carried interest, admitted as the fund's special limited partner (no commitment, no fee, just the carry): 20% of the fund's profits under the LPA, passed on to the individuals who earned it. Carry is a share of profit, not a fee for services. How the fund records it is covered in 5.3.</p></div>\n  </div>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-fund-structures-s3\">\n  <h2><span>3</span>Who Pays Whom: Fee, Commitment, Carry</h2>\n  <p class=\"eyebrow\">The Money Lines Between the Four</p>\n  <p>Three money lines connect the four entities. Each is set by the LPA, the fund's limited partnership agreement (read in 1.2).</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>Management fee: fund → manager</h3><p>During the investment period, the fund pays the manager 2% a year on fee-paying commitments, billed quarterly in advance. The GP's $5M is fee-free, so Stanmere's fee base is $245M of its $250M, and after final close the fee is $1.225M a quarter. The fund books it as an expense; the same cash is revenue on the manager's own books.</p></div>\n    <div class=\"card\"><h3>GP commitment: GP → fund</h3><p>When the fund calls capital, the GP pays in alongside the LPs, and its capital account on the fund's books grows. Here money moves into the fund, not out of it.</p></div>\n    <div class=\"card\"><h3>Carried interest: fund → carry vehicle</h3><p>The carry vehicle shares in profit only after partners get their capital back and an 8% preferred return. The order is the waterfall, covered in 5.2.</p></div>\n    <div class=\"card\"><h3>Costs: who bears what</h3><p>The LPA and the management agreement split the costs. Deal expenses, audit and administration sit at the fund. The team's salaries and the office sit at the management company.</p></div>\n  </div>\n  <p class=\"insight\"><b>What a reviewer checks:</b> A controller checks that management-company overhead is not billed to the fund beyond what those agreements permit.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-fund-structures-s4\">\n  <h2><span>4</span>Reading the Structure Chart</h2>\n  <p class=\"eyebrow\">Beyond the Core Four</p>\n  <p>The structure chart in the offering memorandum maps the legal relationships among the entities. For every line on a trial balance, it tells you whose books you are in.</p>\n  <p>Larger funds add more vehicles around the core four, and you'll meet them on the job. A feeder fund gathers one group of investors, often offshore, and invests through the main fund. A parallel fund invests alongside it in the same deals. A deal SPV holds a single investment. An alternative investment vehicle (AIV) holds one deal outside the main fund for tax or regulatory reasons. A blocker corporation pays tax on certain income itself, so tax-exempt or non-U.S. investors don't receive that income directly. Stanmere's chart shows two of these (neither is modelled in the case's books): an offshore feeder, Stanmere Capital Partners I (Cayman), L.P., and three deal SPVs.</p>\n  <p>One rule covers them all: every vehicle keeps its own books. Place each line on the right entity before you book it.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-fund-structures-s5\">\n  <h2><span>5</span>Entries and the One Pitfall</h2>\n  <p class=\"eyebrow\">Closing Artifacts</p>\n  <table><thead><tr><th>Entity</th><th>How it touches the fund's statements</th><th>Whose books</th></tr></thead><tbody>\n    <tr><td>Fund — Stanmere Capital Partners I, L.P.</td><td>It is the statements</td><td>Fund accountant / administrator</td></tr>\n    <tr><td>General partner — Stanmere Capital GP I, LLC</td><td>Its capital account appears on the fund's books</td><td>GP's own accountant</td></tr>\n    <tr><td>Management company — Stanmere Capital Management, LLC</td><td>The fee it charges is a fund expense; its own P&amp;L stays separate</td><td>Management company's own accountant</td></tr>\n    <tr><td>Carry vehicle — Stanmere Carry I, LLC</td><td>Receives carried interest; covered in 5.3</td><td>GP-side accountant</td></tr>\n  </tbody></table>\n  <p>One entry shows the placement at work: a quarter's management fee, on the fund's books, before any fee offset. The manager records the matching revenue on its own ledger, not here.</p>\n  <table><thead><tr><th>Account</th><th>Dr</th><th>Cr</th></tr></thead><tbody>\n    <tr><td>5000 Management fee</td><td>$1.225M</td><td></td></tr>\n    <tr><td>2100 Management fee payable</td><td></td><td>$1.225M</td></tr>\n  </tbody></table>\n  <div class=\"card\"><h3>What goes wrong here</h3><p>The classic error is building a trial balance before identifying the entity: for example, charging management-company salaries to the fund. Place the entity first, then book the entry.</p></div>\n  <p class=\"eyebrow\">Disclosure</p>\n  <p><small>Stanmere Capital Partners I, L.P. and every entity named in this module are fictional and were created for instructional purposes. Any resemblance to an actual fund, firm or company is coincidental.</small></p>\n</section>"
 ]
};

 "sections": [
  "<section class=\"lesson-section\" id=\"p1-how-to-read-an-lpa-s1\">\n  <h2><span>1</span>Three-Step Ladder: The LPA Is the Fund's Rulebook</h2>\n  <p class=\"eyebrow\">The Three-Step Ladder</p>\n  <div class=\"flow\">\n    <div><b>One sentence</b><p>The limited partnership agreement, or LPA, is the fund's actual rulebook. Almost every number a fund accountant books traces back to one of its clauses.</p></div>\n    <div><b>A tiny number</b><p>Suppose an illustrative LPA says: \"the fee is 2% of commitments, billed quarterly.\" On a $1,000 commitment, that clause is $20 a year, or $5 a quarter.</p></div>\n    <div><b>The real mechanics</b><p>Stanmere's LPA has the same clause: 2% a year of commitments, billed quarterly in advance. After final close, its fee-paying commitments are $245M: $250M in total, less the general partner's fee-free $5M. The clause then reads as $245M × 2% ÷ 4, or $1.225M a quarter.</p></div>\n  </div>\n  <p class=\"insight\"><b>Why this module matters:</b> Every later module assumes you can find these numbers in the LPA. This module is where that skill gets built.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-how-to-read-an-lpa-s2\">\n  <h2><span>2</span>Economics Clauses: Commitments, Closes, and the Fee</h2>\n  <p class=\"eyebrow\">What Moves Money In</p>\n  <p>Several clauses put cash on the fund's books before a single deal closes.</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>Commitments and closes</h3><p>The LPA fixes total commitments at $250M across three closes: 2 Jan 2019, 1 Oct 2019, and a final close on 30 Jun 2020. What it does to the books: a capital call turns an unfunded commitment into cash and a funded capital account (2.1).</p></div>\n    <div class=\"card\"><h3>Investment period and term</h3><p>The investment period runs five years from final close, to 30 Jun 2025; the term runs ten years, to 30 Jun 2030. What it does to the books: when the investment period ends, the fee base moves from commitments to invested cost.</p></div>\n    <div class=\"card\"><h3>Management fee</h3><p>2% of commitments during the investment period, billed quarterly in advance, with the GP's $5M commitment fee-free. Monitoring and transaction fees the manager earns from portfolio companies offset the fee dollar for dollar. What it does to the books: after final close, $1.225M of fee expense a quarter, before any offset (2.2).</p></div>\n    <div class=\"card\"><h3>Start-up costs and equalization</h3><p>Stanmere's LPA puts organizational and offering costs on the fund; US GAAP, not the LPA, sets how each is booked (1.3). A partner admitted at a later close pays earlier partners equalization interest at 8% simple (1.4).</p></div>\n  </div>\n  <p class=\"insight\"><b>Reading habit:</b> For each economics clause, ask who pays or receives the cash, what starts it, and what it is charged on. Those three answers are most of the journal entry.</p>\n  <p class=\"insight\"><b>What a fee clause can look like</b> (paraphrased for teaching, not from a real LPA): “During the Investment Period the Fund shall pay the Manager, quarterly in advance, an annual fee of 2.0% of the Commitments of the Partners other than the General Partner; afterwards, 2.0% of the cost of the Fund’s investments. The fee is reduced by 100% of any monitoring and transaction fees the Manager receives from portfolio companies.” Every number in the fee entry (2.2) comes from those two sentences.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-how-to-read-an-lpa-s3\">\n  <h2><span>3</span>The Waterfall-Order Clause</h2>\n  <p class=\"eyebrow\">What Moves Money Out, and in What Order</p>\n  <p>The waterfall clause sets the order in which distributions are paid. Stanmere's waterfall first returns contributed capital, then three more tiers split the profit, in the order the LPA states them.</p>\n  <figure class=\"pe-fig\">\n    <svg viewBox=\"0 0 700 290\" role=\"img\" aria-label=\"A four-tier waterfall stack, bottom to top, each tier with a gold arrow to its receiver: return of capital to partners, an 8 percent preferred return to partners, a 100 percent catch-up to the carry vehicle, then an 80 percent partners and 20 percent carry split.\">\n      <defs><marker id=\"lpa-s3\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8Z\" fill=\"#C9A24B\"/></marker></defs>\n\n      <rect class=\"b-sep\" x=\"40\" y=\"220\" width=\"220\" height=\"56\" rx=\"9\"/>\n      <text class=\"t-hd\" x=\"52\" y=\"242\">Tier 1 · Return of capital</text>\n      <text class=\"t-mut\" x=\"52\" y=\"258\">contributions back first</text>\n      <rect class=\"b-sep\" x=\"300\" y=\"220\" width=\"170\" height=\"56\" rx=\"9\"/>\n      <text class=\"t-hd\" x=\"312\" y=\"242\">Partners</text>\n      <text class=\"t-mut\" x=\"312\" y=\"258\">get capital back</text>\n\n      <rect class=\"b-sep\" x=\"40\" y=\"150\" width=\"220\" height=\"56\" rx=\"9\"/>\n      <text class=\"t-hd\" x=\"52\" y=\"172\">Tier 2 · Preferred return</text>\n      <text class=\"t-mut\" x=\"52\" y=\"188\">8%, on unreturned capital</text>\n      <rect class=\"b-sep\" x=\"300\" y=\"150\" width=\"170\" height=\"56\" rx=\"9\"/>\n      <text class=\"t-hd\" x=\"312\" y=\"172\">Partners</text>\n      <text class=\"t-mut\" x=\"312\" y=\"188\">receive the pref</text>\n\n      <rect class=\"b-sep\" x=\"40\" y=\"80\" width=\"220\" height=\"56\" rx=\"9\"/>\n      <text class=\"t-hd\" x=\"52\" y=\"102\">Tier 3 · Catch-up</text>\n      <text class=\"t-mut\" x=\"52\" y=\"118\">100% until carry holds 20%</text>\n      <rect class=\"b-sep\" x=\"300\" y=\"80\" width=\"170\" height=\"56\" rx=\"9\"/>\n      <text class=\"t-hd\" x=\"312\" y=\"102\">Carry vehicle</text>\n      <text class=\"t-mut\" x=\"312\" y=\"118\">Stanmere Carry I</text>\n\n      <rect class=\"b-fund\" x=\"40\" y=\"10\" width=\"220\" height=\"56\" rx=\"9\"/>\n      <text class=\"t-hd t-w\" x=\"52\" y=\"32\">Tier 4 · Carry split</text>\n      <text class=\"t-w\" x=\"52\" y=\"48\" font-size=\"10.5\">whole-fund, cumulative</text>\n      <rect class=\"b-sep\" x=\"300\" y=\"10\" width=\"170\" height=\"56\" rx=\"9\"/>\n      <text class=\"t-hd\" x=\"312\" y=\"32\">Split per LPA</text>\n      <text class=\"t-mut\" x=\"312\" y=\"48\">partners 80% · carry 20%</text>\n\n      <path class=\"ar\" d=\"M260 248 L298 248\" marker-end=\"url(#lpa-s3)\"/>\n      <path class=\"ar\" d=\"M260 178 L298 178\" marker-end=\"url(#lpa-s3)\"/>\n      <path class=\"ar\" d=\"M260 108 L298 108\" marker-end=\"url(#lpa-s3)\"/>\n      <path class=\"ar\" d=\"M260 38 L298 38\" marker-end=\"url(#lpa-s3)\"/>\n    </svg>\n    <figcaption>The waterfall stacks bottom to top: return of capital, preferred return, catch-up, then the 80/20 split.</figcaption>\n  </figure>\n  <p class=\"insight\"><b>What the waterfall clause can look like</b> (paraphrased): “Distributions shall be made (a) first, to the Partners until each has received its capital contributions; (b) second, to the Partners until they have received an 8% annual return on unreturned contributions; (c) third, to the Special Limited Partner until it has received 20% of the amounts distributed under (b) and (c); (d) thereafter, 80% to the Partners and 20% to the Special Limited Partner.” Match each letter to a tier in the stack above.</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>Preferred return</h3><p>8% a year, accruing only on capital not yet returned. What it does to the books: as distributions return capital, the pool the pref accrues on shrinks (5.2). Read what the pref accrues on, not just its rate: 8% on total contributions gives a very different number.</p></div>\n    <div class=\"card\"><h3>Catch-up and carried interest</h3><p>After the pref, a 100% catch-up runs until the carry side holds 20% of cumulative profit; after that, profit splits 80/20. Carry is 20% on a European, whole-fund basis: results across all deals, not deal by deal. Carry goes to Stanmere Carry I, LLC as a share of profit, not a fee (5.3).</p></div>\n  </div>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-how-to-read-an-lpa-s4\">\n  <h2><span>4</span>Governance and Side Letters</h2>\n  <p class=\"eyebrow\">Clauses That Rarely Reach the Books</p>\n  <p>LPAs also set governance: an LP advisory committee consulted on conflicts and valuations, a key-person clause that can suspend the investment period, excuse rights (letting an LP sit out one deal), and removal of the general partner. The case gives Stanmere no specific terms for these, and each reaches the books only when it is triggered, for example when a key-person event stops new capital calls.</p>\n  <p>Some LPs also sign a side letter, a private agreement with the general partner that changes a term, such as the fee, for that LP only; a most-favored-nation (MFN) clause lets other eligible LPs elect into those terms. The case gives Stanmere no side letters, but where they exist, the affected LP's fee or allocation needs its own tracking line.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-how-to-read-an-lpa-s5\">\n  <h2><span>5</span>Entries and the One Pitfall</h2>\n  <p class=\"eyebrow\">Closing Artifacts</p>\n  <table><thead><tr><th>Clause</th><th>What it does to the books</th><th>Where</th></tr></thead><tbody>\n    <tr><td>Commitments &amp; closes ($250M; 3 closes)</td><td>Unfunded commitment becomes cash and a funded capital account</td><td>2.1</td></tr>\n    <tr><td>Management fee (2%, quarterly in advance)</td><td>$1.225M of fee expense a quarter after final close, before any offset</td><td>2.2</td></tr>\n    <tr><td>Org / offering costs</td><td>Borne by the fund; GAAP sets the booking</td><td>1.3</td></tr>\n    <tr><td>Waterfall order (capital, 8% pref, catch-up, 80/20)</td><td>Sets who receives each distribution, and when</td><td>5.2</td></tr>\n  </tbody></table>\n  <p>The fee clause is the clearest case of a clause becoming an entry. \"2% of commitments, billed quarterly in advance\" becomes one quarter's accrual on the fund's books:</p>\n  <table><thead><tr><th>Account</th><th>Dr</th><th>Cr</th></tr></thead><tbody>\n    <tr><td>5000 Management fee</td><td>$1.225M</td><td></td></tr>\n    <tr><td>2100 Management fee payable</td><td></td><td>$1.225M</td></tr>\n  </tbody></table>\n  <div class=\"card\"><h3>What goes wrong here</h3><p>Reading the offering memorandum or a marketing deck as if it were the LPA. Those documents summarize the deal; the LPA is the binding one. A wrong rate or date taken from a summary lands on every entry that clause drives.</p></div>\n  <p class=\"eyebrow\">Disclosure</p>\n  <p><small>Stanmere Capital Partners I, L.P. and every entity named in this module are fictional and were created for instructional purposes. Any resemblance to an actual fund, firm or company is coincidental.</small></p>\n</section>"
 ]
};

 "calculator": null,
 "glossary": [
  {
   "term": "Organizational Costs",
   "def": "Legal and administrative costs to form a fund and its general partner as legal entities. Under US GAAP they are expensed as incurred; a fund cannot capitalize them."
  },
  {
   "term": "Offering Costs",
   "def": "Costs to market a fund and sell interests to investors, such as placement agent fees, offering memorandum costs and roadshow travel. Stanmere charges them directly against partners' capital at the first close."
  },
  {
   "term": "Continuous Offering",
   "def": "A fund that keeps offering its interests on an ongoing basis rather than only at a set of closes inside a window that then shuts. Such a fund defers its offering costs and amortizes them over twelve months. Stanmere is not one."
  },
  {
   "term": "Partners' Capital",
   "def": "The partners' ownership balance in the fund. Stanmere's offering costs are charged directly against it (account 3050), so they never reach the statement of operations."

 "sections": [
  "<section class=\"lesson-section\" id=\"p1-org-vs-offering-costs-s1\">\n  <h2><span>1</span>Three-Step Ladder: Two Bills, Two Different Rules</h2>\n  <p class=\"eyebrow\">The Three-Step Ladder</p>\n  <div class=\"flow\">\n    <div><b>One sentence</b><p>Before a fund calls a single dollar from investors, it already owes money for two different things: forming itself and marketing itself.</p></div>\n    <div><b>A tiny number</b><p>Suppose an illustrative new fund pays $12,000 to draft its legal documents and form its entities, and $9,000 to market itself to investors. Same bank account, two different bills.</p></div>\n    <div><b>The real mechanics</b><p>Stanmere pays $1.2M to form itself and $0.9M to raise its capital. The first is expensed through the statement of operations; the second is charged straight against partners' capital.</p></div>\n  </div>\n  <p class=\"insight\"><b>Why this module matters:</b> New fund accountants often lump every pre-close invoice into one bucket. The two buckets land in different places on the financial statements, so the first judgment call is which bucket each invoice belongs in.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-org-vs-offering-costs-s2\">\n  <h2><span>2</span>Two Buckets: What Counts as Org vs Offering</h2>\n  <p class=\"eyebrow\">The Core Distinction</p>\n  <p>Every fund launch generates a pile of invoices before the first capital call goes out. Sort each one by its purpose: does it create the vehicle, or does it sell interests in it?</p>\n  <figure class=\"pe-fig\">\n    <svg viewBox=\"0 0 700 320\" role=\"img\" aria-label=\"The fund's cash pays two kinds of bill. Formation costs of 1.2 million dollars book to organizational cost expense. Offering costs of 0.9 million dollars are charged against partners' capital, account 3050.\">\n      <defs>\n        <marker id=\"ah-o2g\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8Z\" fill=\"#C9A24B\"/></marker>\n        <marker id=\"ah-o2i\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8Z\" fill=\"#0F6E56\"/></marker>\n      </defs>\n      <rect class=\"b-fund\" x=\"260\" y=\"16\" width=\"180\" height=\"56\" rx=\"10\"/>\n      <text class=\"t-hd t-w\" x=\"272\" y=\"40\">Fund's Cash</text>\n      <text class=\"t-w\" x=\"272\" y=\"58\" font-size=\"10.5\">pays both bills, up front</text>\n\n      <rect class=\"b-sep\" x=\"40\" y=\"140\" width=\"230\" height=\"60\" rx=\"9\"/>\n      <text class=\"t-hd\" x=\"52\" y=\"163\">Formation costs</text>\n      <text class=\"t-mut\" x=\"52\" y=\"180\">legal fees · entity filings</text>\n      <text class=\"t-mut\" x=\"52\" y=\"195\">$1.2M</text>\n\n      <rect class=\"b-sep\" x=\"430\" y=\"140\" width=\"230\" height=\"60\" rx=\"9\"/>\n      <text class=\"t-hd\" x=\"442\" y=\"163\">Offering costs</text>\n      <text class=\"t-mut\" x=\"442\" y=\"180\">placement agent · offering memo · roadshow</text>\n      <text class=\"t-mut\" x=\"442\" y=\"195\">$0.9M</text>\n\n      <path class=\"ar\" d=\"M270 72 C 220 100, 180 120, 155 138\" marker-end=\"url(#ah-o2g)\"/>\n      <path class=\"ar\" d=\"M420 72 C 470 100, 510 120, 545 138\" marker-end=\"url(#ah-o2g)\"/>\n\n      <rect class=\"b-fund\" x=\"40\" y=\"240\" width=\"230\" height=\"60\" rx=\"9\"/>\n      <text class=\"t-hd t-w\" x=\"52\" y=\"263\">Org Costs Expense (5100)</text>\n      <text class=\"t-w\" x=\"52\" y=\"280\" font-size=\"10.5\">statement of operations</text>\n\n      <rect class=\"b-fund\" x=\"430\" y=\"240\" width=\"230\" height=\"60\" rx=\"9\"/>\n      <text class=\"t-hd t-w\" x=\"442\" y=\"263\">Partners' Capital (3050)</text>\n      <text class=\"t-w\" x=\"442\" y=\"280\" font-size=\"10.5\">charged at the first close</text>\n\n      <path class=\"ar-i\" d=\"M155 200 L155 238\" marker-end=\"url(#ah-o2i)\"/>\n      <path class=\"ar-i\" d=\"M545 200 L545 238\" marker-end=\"url(#ah-o2i)\"/>\n    </svg>\n    <figcaption>Gold = cash leaving the fund to pay each bill. Green = where it lands in the books: organizational costs in expense, offering costs directly against partners' capital.</figcaption>\n  </figure>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>Organizational costs</h3><p>Legal and administrative costs to form the fund and its general partner as legal entities: drafting the LPA, state filing fees, and formation counsel. These costs create the vehicle itself.</p></div>\n    <div class=\"card\"><h3>Offering costs</h3><p>Costs to market the fund and sell interests to investors: placement agent fees, printing and legal review of the offering memorandum, and roadshow travel. These costs exist only because the fund is raising capital.</p></div>\n  </div>\n  <p>A cost tied to forming the entity, like a state filing fee, is an organizational cost. The same kind of fee tied to clearing the offering for sale is an offering cost. Classify each invoice by its purpose, not by its vendor.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-org-vs-offering-costs-s3\">\n  <h2><span>3</span>Org Costs: Expensed the Moment They Hit</h2>\n  <p class=\"eyebrow\">No Election Available</p>\n  <p>Organizational costs are expensed as incurred. A fund cannot choose to capitalize them and spread them over later periods, no matter what its governing documents say. This is the general US GAAP rule for start-up costs (ASC 720), not a rule written only for investment companies.</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>Stanmere's bill</h3><p>Forming the fund and its general partner costs $1.2M in legal fees and state filings, paid from the fund's cash on 31 Mar 2019, the day of its first capital call. In practice the manager often fronts these bills and the first capital call repays it.</p></div>\n    <div class=\"card\"><h3>Where it lands</h3><p>The whole $1.2M goes to account 5100, Organizational costs, on the statement of operations. Nothing is deferred, nothing is amortized, and no later entry follows.</p></div>\n  </div>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-org-vs-offering-costs-s4\">\n  <h2><span>4</span>Offering Costs: Charged Against Partners' Capital</h2>\n  <p class=\"eyebrow\">Straight to the Capital Statement</p>\n  <p>Offering costs raise capital rather than form the entity, so they are treated as a cost of the capital itself. Stanmere pays $0.9M in placement agent fees, offering memorandum costs and roadshow travel, and charges the whole amount directly against partners' capital at the first close, in account 3050. It never touches the statement of operations. The investment-company guide (ASC 946) is where this treatment sits.</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>Who bears it</h3><p>The $0.9M was incurred before the first close (the case books it on 31 Mar 2019, paid from the first call), so it falls on the three partners in the fund at that date (the GP and two LPs, $120M of commitments), in proportion to their commitments. Partners admitted at the later closes bear none of it (1.4).</p></div>\n    <div class=\"card\"><h3>Why Stanmere doesn't defer it</h3><p>Stanmere offers its interests only at three scheduled closes over 18 months, and then the offering period ends. A fund in genuine continuous offering would instead defer these costs (account 1300) and amortize them over twelve months (account 5110); both accounts exist in Stanmere's chart, but Stanmere never uses them.</p></div>\n  </div>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-org-vs-offering-costs-s5\">\n  <h2><span>5</span>Entries and the One Pitfall</h2>\n  <p class=\"eyebrow\">Closing Artifacts</p>\n  <p>Organizational costs, as incurred (quarter ended 31 Mar 2019):</p>\n  <table><thead><tr><th>Account</th><th>Dr</th><th>Cr</th></tr></thead><tbody>\n    <tr><td>5100 Organizational costs</td><td>$1.2M</td><td></td></tr>\n    <tr><td>1000 Cash and cash equivalents</td><td></td><td>$1.2M</td></tr>\n  </tbody></table>\n  <p>Offering costs, charged at the first close:</p>\n  <table><thead><tr><th>Account</th><th>Dr</th><th>Cr</th></tr></thead><tbody>\n    <tr><td>3050 Partners' capital - offering costs charged against capital</td><td>$0.9M</td><td></td></tr>\n    <tr><td>1000 Cash and cash equivalents</td><td></td><td>$0.9M</td></tr>\n  </tbody></table>\n  <p>Together the two bills cost the fund $2.1M of cash, but only the $1.2M reduces reported results. The $0.9M shows up on the statement of changes in partners' capital, which is why an analyst reads the capital statement, not just the statement of operations.</p>\n  <div class=\"card\"><h3>What goes wrong here</h3><p>Assuming that holding several closes makes an offering continuous, and deferring the offering costs on that basis. The test is whether the fund keeps offering its interests. Stanmere's offering period ends at the final close, so its offering costs go straight to partners' capital. Staggered closes alone do not decide the accounting: a fund that qualifies as a continuous offering may defer and amortize offering costs; check the offering facts, not just the close schedule. Separately, many LPAs re-spread these costs to later-closing partners regardless of how they are booked; check each fund's policy. Stanmere's policy is to charge them to the partners then in the fund.</p></div>\n  <p class=\"eyebrow\">Disclosure</p>\n  <p><small>Stanmere Capital Partners I, L.P. and every entity named in this module are fictional and were created for instructional purposes. Any resemblance to an actual fund, firm or company is coincidental.</small></p>\n</section>"
 ]

 "glossary": [
  {
   "term": "Equalization",
   "def": "The mechanism that treats a partner admitted at a later close as if it had funded its share of capital already called from earlier partners. At Stanmere it levels up capital contributions only; it does not re-spread costs the fund paid before the partner joined."
  },
  {
   "term": "True-Up Contribution",
   "def": "The cash a newly admitted partner pays in at a later close to cover its share of capital already called. The fund pays the same amount back to the partners who funded those earlier calls, so every partner ends up having funded the same share."
  },
  {
   "term": "Equalization Interest",
   "def": "Interest a later-closing partner pays the earlier partners for the time its true-up dollars sat outside the fund. Stanmere's rate is 8% a year, simple. It is settled between partners and is not part of contributed capital."
  },
  {
   "term": "Final Close",
   "def": "The last date on which new investors may be admitted to the fund. For Stanmere it is 30 Jun 2020; after it, no further equalization of this kind occurs."

 "sections": [
  "<section class=\"lesson-section\" id=\"p1-closes-equalization-s1\">\n  <h2><span>1</span>Three-Step Ladder: Late Does Not Mean Cheaper</h2>\n  <p class=\"eyebrow\">The Three-Step Ladder</p>\n  <div class=\"flow\">\n    <div><b>One sentence</b><p>When a fund holds more than one close, a partner who joins later must still end up having funded the same share of earlier capital calls as everyone else.</p></div>\n    <div><b>A tiny number</b><p>In an illustrative fund, two partners each commit $1,000. Partner A joins first and funds a $200 call alone. Three months later Partner B joins, pays in its $100 share of that call plus $2 of interest (8% a year for a quarter), and the fund hands A its extra $100 plus the $2.</p></div>\n    <div><b>The real mechanics</b><p>Stanmere closes three times. At its second close, the two new partners pay in a $15.5M true-up contribution and $0.6M of equalization interest, $16.1M in all.</p></div>\n  </div>\n  <p class=\"insight\"><b>Why this module matters:</b> Without equalization, whoever closed first would carry every dollar of early risk for free, and a fund could never fairly admit a second wave of investors. Getting the mechanics right, and knowing the limit of what equalization covers, is a day-one skill in a multi-close fund.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-closes-equalization-s2\">\n  <h2><span>2</span>The True-Up Contribution: Leveling Capital Called So Far</h2>\n  <p class=\"eyebrow\">Stanmere's Second Close, 1 Oct 2019</p>\n  <p>Stanmere closes on 2 Jan 2019 (the GP and two LPs, $120M of commitments), on 1 Oct 2019 (two more LPs, $60M), and finally on 30 Jun 2020. By Close 2, the three original partners have funded $46.5M of capital calls on their own. After Close 2, total commitments are $180M, and the new $60M is one-third of that. So the new partners owe one-third of what has been called so far:</p>\n  <p class=\"insight\"><b>True-up contribution</b> = capital called to date &times; (new commitments &divide; total commitments after the close)<br>= $46.5M &times; ($60M &divide; $180M) = <b>$15.5M</b><br>Capital calls are taught in Module 2.1.</p>\n  <figure class=\"pe-fig\">\n    <svg viewBox=\"0 0 700 250\" role=\"img\" aria-label=\"The two Close 2 partners pay 15.5 million dollars into the fund as their true-up contribution, and the fund pays the same 15.5 million dollars straight back out to the three Close 1 partners in proportion to their commitments, leaving every partner having funded the same share of capital called to date.\">\n      <defs>\n        <marker id=\"eq-s2g\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8Z\" fill=\"#C9A24B\"/></marker>\n        <marker id=\"eq-s2i\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8Z\" fill=\"#0F6E56\"/></marker>\n      </defs>\n      <rect class=\"b-sep\" x=\"20\" y=\"16\" width=\"270\" height=\"62\" rx=\"9\"/>\n      <text class=\"t-hd\" x=\"32\" y=\"40\">New partners pay in</text>\n      <text x=\"32\" y=\"60\" font-size=\"11\">two Close 2 LPs · $15.5M</text>\n\n      <path class=\"ar\" d=\"M290 47 L408 47\" marker-end=\"url(#eq-s2g)\"/>\n\n      <rect class=\"b-fund\" x=\"410\" y=\"16\" width=\"270\" height=\"62\" rx=\"10\"/>\n      <text class=\"t-hd t-w\" x=\"422\" y=\"40\">Stanmere's cash</text>\n      <text class=\"t-w\" x=\"422\" y=\"60\" font-size=\"11\">receives, then pays out, $15.5M</text>\n\n      <path class=\"ar-i\" d=\"M545 82 L545 118\" marker-end=\"url(#eq-s2i)\"/>\n\n      <rect class=\"b-sep\" x=\"20\" y=\"120\" width=\"660\" height=\"50\" rx=\"9\"/>\n      <text class=\"t-hd\" x=\"32\" y=\"142\">Paid back to the three Close 1 partners</text>\n      <text x=\"32\" y=\"160\" font-size=\"11\">pro rata to their Close 1 commitments</text>\n\n      <path class=\"ar-i\" d=\"M350 172 L350 196\" marker-end=\"url(#eq-s2i)\"/>\n\n      <rect class=\"b-fund\" x=\"120\" y=\"198\" width=\"460\" height=\"44\" rx=\"9\"/>\n      <text class=\"t-w\" x=\"136\" y=\"224\" font-size=\"11\">Every partner has now funded the same share of the $46.5M</text>\n    </svg>\n    <figcaption>Gold: cash in from the new partners. Green: the fund passing the same amount straight back out to the original three, so every partner ends level.</figcaption>\n  </figure>\n  <p>A true-up contribution raises no new money to invest. It moves money already in the fund from the partners who went first, so every partner's contributed-capital share matches its ownership share. At the fund level the cash comes in and goes back out in the same quarter. Close 3 repeats the same pattern for the last two partners.</p>\n  <p class=\"warn\">Don't confuse a true-up contribution with an ordinary capital call. A call funds new investments (2.1); a true-up only levels up a late arrival.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-closes-equalization-s3\">\n  <h2><span>3</span>Equalization Interest: Paying for Time, Not Capital</h2>\n  <p class=\"eyebrow\">Compensating the Partners Who Went First</p>\n  <p>Returning the true-up contribution makes every partner's <em>capital</em> share equal. It does not pay the original three for the months their money was at work while the new partners' dollars sat outside the fund. Equalization interest closes that gap.</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>Stanmere's rate</h3><p>8% a year, simple, on the true-up dollars for the time they were late. It is not the fund's preferred return, and it is not compounded. At Close 2 it comes to $0.6M. (The case runs the interest to 31 Dec 2019, the quarter-end on which the close is booked; counted only to the 1 Oct 2019 closing it would be about half as much.)</p></div>\n    <div class=\"card\"><h3>Where it sits</h3><p>The interest is settled in cash between partners and is tracked as a memo line outside the capital accounts. Only the $15.5M true-up principal becomes part of the new partners' contributed capital (4.3).</p></div>\n  </div>\n  <p>At Stanmere, equalization levels up capital contributions only. Costs the fund paid before a partner joined, such as the offering costs in 1.3, stay with the partners who were in the fund when they were incurred; many real LPAs make later closers share those costs too. Management fees work the same way at Stanmere: a later partner pays fees only from the quarter it joins. Many real LPAs go further and make later closers pay fees back to the first close, so read the LPA (Module 1.2).</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-closes-equalization-s4\">\n  <h2><span>4</span>Close 2 From Start to Finish</h2>\n  <p class=\"eyebrow\">One Close, One Cash Round Trip</p>\n  <p>Put the two pieces together for Stanmere's second close on 1 Oct 2019:</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>What the new partners pay</h3><p>$15.5M of true-up principal plus $0.6M of equalization interest: $16.1M into the fund's bank account.</p></div>\n    <div class=\"card\"><h3>What the fund does with it</h3><p>It pays the same $16.1M straight back out to the three Close 1 partners in proportion to their commitments. The fund's own cash and total capital end the quarter where they started.</p></div>\n  </div>\n  <p>The movement that matters is one level down, in each partner's capital account: the new partners' contributed capital goes up by the principal, and the original partners' goes down by the same amount. That partner-level view is what 4.3 builds.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p1-closes-equalization-s5\">\n  <h2><span>5</span>Entries and the One Pitfall</h2>\n  <p class=\"eyebrow\">Closing Artifacts</p>\n  <p>Close 2, recorded in the quarter ended 31 Dec 2019: cash comes in from the new partners and goes straight back out to the original three.</p>\n  <table><thead><tr><th>Account</th><th>Dr</th><th>Cr</th></tr></thead><tbody>\n    <tr><td>1000 Cash and cash equivalents</td><td>$16.1M</td><td></td></tr>\n    <tr><td>3000 Partners' capital - contributions</td><td></td><td>$16.1M</td></tr>\n    <tr><td>3000 Partners' capital - contributions</td><td>$16.1M</td><td></td></tr>\n    <tr><td>1000 Cash and cash equivalents</td><td></td><td>$16.1M</td></tr>\n  </tbody></table>\n  <p>The ledger passes the whole $16.1M, interest included, through 3000 and straight back out, so the net effect on the fund is zero. In the partners' own capital accounts only the $15.5M principal counts as contributed capital; the $0.6M of interest sits on a memo line outside them (4.3). Real funds usually settle the interest between partners or through a due-to/from-partners account; the case posts it through 3000 to keep the ledger short. Close 3 follows the same pattern.</p>\n  <div class=\"card\"><h3>What goes wrong here</h3><p>Adding equalization interest to a partner's contributed capital. The interest is compensation between partners, not an investment in the fund. Counting it as capital overstates what a later partner has at risk, and that error carries into the preferred return in the waterfall (5.2).</p></div>\n  <p class=\"eyebrow\">Disclosure</p>\n  <p><small>Stanmere Capital Partners I, L.P. and every entity named in this module are fictional and were created for instructional purposes. Any resemblance to an actual fund, firm or company is coincidental.</small></p>\n</section>"
 ]
};

    { term: "Commitment", def: "The total amount a partner promises to contribute over the fund's life. It is a promise, not cash, so it is not booked as capital when the partner is admitted." },

  sections: [
`<section class="lesson-section" id="p2-capital-calls-s1">
  <h2><span>1</span>Three-Step Ladder: From Promise to Cash</h2>
  <p class="eyebrow">The Three-Step Ladder</p>
  <div class="flow">
    <div><b>One sentence</b><p>A capital call is the fund asking its partners for part of the money they promised, and the moment that cash arrives it becomes their capital.</p></div>
    <div><b>A tiny number</b><p>An LP commits $10M to an illustrative fund. The fund calls 10%, so the LP wires $1M. Its paid-in capital is now $1M and its unfunded commitment falls to $9M.</p></div>
    <div><b>Stanmere</b><p>Stanmere Capital Partners I, L.P. books its first call, $3.1M, on 31 Mar 2019. The case records each quarter's activity on the quarter-end date. It is split among the three partners admitted at the first close, in proportion to what each committed.</p></div>
  </div>
  <p class="insight"><b>Why this module matters:</b> A commitment is a promise that sits outside the ledger. A call is the step that turns part of that promise into cash and partners' capital. It is the fund's first real "money in" entry.</p>
</section>`,
`<section class="lesson-section" id="p2-capital-calls-s2">
  <h2><span>2</span>The Call Notice</h2>
  <p class="eyebrow">How the GP Asks for Money</p>
  <p>A fund does not collect its partners' commitments on day one. It calls money only when it needs it, typically to pay for an investment, the management fee or fund expenses. Each time, the GP sends every partner a call notice.</p>
  <div class="grid two">
    <div class="card"><h3>What the notice says</h3><p>The total amount being called, this partner's share of it, the due date (often about ten business days out) and the bank details. Many notices also show the partner's commitment, paid-in to date and unfunded balance.</p></div>
    <div class="card"><h3>What the partner does</h3><p>It wires its share by the due date. The LPA sets out what happens to a partner that doesn't pay, and those penalties are usually steep, which is why defaults are rare.</p></div>
  </div>
  <p>Stanmere makes 28 calls over its life, from 2019 to 2027. The calls are not evenly spaced: some quarters have none. Calls can continue after the investment period ends, for fees and expenses, if the LPA allows it; Stanmere's last calls run into 2027.</p>
</section>`,
`<section class="lesson-section" id="p2-capital-calls-s3">
  <h2><span>3</span>Pro Rata by Commitment</h2>
  <p class="eyebrow">Who Pays How Much</p>
  <p>A call is shared among the partners in the fund on the call date, in proportion to each one's commitment. At 31 Mar 2019 only the first-close partners are in Stanmere, so they alone share the first call:</p>
  <table><thead><tr><th>Partner</th><th>Commitment</th><th>Share of the $3.1M call</th></tr></thead><tbody>
    <tr><td>The GP</td><td>$5M</td><td>$129,167</td></tr>
    <tr><td>Kelbrook State Retirement System (LP)</td><td>$75M</td><td>$1,937,500</td></tr>
    <tr><td>A university endowment (LP)</td><td>$40M</td><td>$1,033,333</td></tr>
    <tr><td><b>Total</b></td><td></td><td><b>$3,100,000</b></td></tr>
  </tbody></table>
  <p>Shares are shown to the nearest dollar and still add to the total. Partners admitted at later closes pay nothing toward this call. They true up when they join, through equalization (1.4), so that every partner ends up paid in at the same percentage of its commitment.</p>
</section>`,
`<section class="lesson-section" id="p2-capital-calls-s4">
  <h2><span>4</span>The Unfunded Commitment Goes Down</h2>
  <p class="eyebrow">Tracking the Promise</p>
  <p>Every call moves money from one column to another in each partner's records: paid-in goes up and the unfunded commitment goes down by the same amount. After the first call, Kelbrook's unfunded commitment is $1,937,500 lower than its original $75M.</p>
  <div class="grid two">
    <div class="card"><h3>Where it is tracked</h3><p>The unfunded commitment is not a balance in the general ledger. It lives in the partners' capital account records (4.3), and each call notice reports it.</p></div>
    <div class="card"><h3>Stanmere over its life</h3><p>Stanmere's 28 calls bring in $213.3M of paid-in capital. Some commitment is never called, and that is normal: a fund calls only what it needs.</p></div>
  </div>
  <p class="warn"><b>Subscription credit lines.</b> Many funds borrow from a bank first and call capital later to repay it. Illustrative: a fund borrows $4M on 1 Mar to close a deal, then on 31 Mar calls $4M from its partners and repays the bank. Partners' capital rises only on the call date. Stanmere has no subscription line, so it has no such entries. A subscription line delays calls and can lift IRR (Module 6.2) while leaving the multiples about the same, less the interest paid.</p>
</section>`,
`<section class="lesson-section" id="p2-capital-calls-s5">
  <h2><span>5</span>The Entry and the One Pitfall</h2>
  <p class="eyebrow">Journal Entry</p>
  <table><thead><tr><th>Date</th><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>
    <tr><td>31 Mar 2019 · first call</td><td>1000 Cash and cash equivalents</td><td>$3.1M</td><td></td></tr>
    <tr><td></td><td>3000 Partners' capital - contributions</td><td></td><td>$3.1M</td></tr>
  </tbody></table>
  <p>Some funds book a receivable (1050 Subscriptions receivable) when the notice goes out and clear it when the cash arrives; Stanmere never uses 1050 and records each call when the cash is received. Every later call uses the same two lines. The ledger holds the fund total; each partner's share is posted to its capital account (4.3).</p>
  <div class="card"><h3>What goes wrong here</h3><p>Booking each partner's whole commitment as capital on the day it is admitted. A commitment is only a promise, so partners' capital would be overstated by every dollar not yet called, and the balance sheet would show money the fund doesn't have. Capital rises only as each call is paid.</p></div>
  <p class="eyebrow">Disclosure</p>
  <p><small>Stanmere Capital Partners I, L.P. and every entity named in this module are fictional and were created for instructional purposes. Any resemblance to an actual fund, firm or company is coincidental.</small></p>
</section>`
  ]

`<section class="lesson-section" id="p2-management-fees-s1">
  <h2><span>1</span>Three-Step Ladder: Paying the Manager</h2>
  <p class="eyebrow">The Three-Step Ladder</p>
  <div class="flow">
    <div><b>One sentence</b><p>The fund pays its manager a fee every quarter for running it, and if the manager also collects fees from the companies it owns, the LPA can make it give that money back.</p></div>
    <div><b>A tiny number</b><p>An illustrative fund has $100M of fee-paying commitments. At 2% a year that is $2M, or $500,000 a quarter billed in advance.</p></div>
    <div><b>Stanmere</b><p>Stanmere Capital Partners I, L.P. pays $1,225,000 a quarter once all its partners have closed. In 2021 Q4 its manager also earns $350,000 of monitoring fees, which lowers the fee the fund owes by the same amount.</p></div>
  </div>
  <p class="insight"><b>Why this module matters:</b> The management fee is the fund's biggest recurring expense, and the offset is where beginners most often double count. Both are set by the LPA, so read the fee clause first (1.2).</p>
</section>`,
`<section class="lesson-section" id="p2-management-fees-s2">
  <h2><span>2</span>The Fee: 2% of Commitments, Quarterly in Advance</h2>
  <p class="eyebrow">During the Investment Period</p>
  <p>Stanmere's LPA sets the fee at 2% a year, billed quarterly in advance. During the investment period the basis is commitments, but not all of them: the GP's own commitment is fee-free. So the basis is every commitment except the GP's.</p>
  <div class="grid two">
    <div class="card"><h3>The formula</h3><p>Once all partners have closed, the fee basis is $245.0M. The quarterly fee is $245.0M × 2% ÷ 4 = $1,225,000, the same every full quarter until the investment period ends.</p></div>
    <div class="card"><h3>Why the early fees are lower</h3><p>Before the final close, fewer partners have committed, so the basis is smaller. The rate never changes; only the basis grows as each close adds partners (1.4).</p></div>
  </div>
  <p>"In advance" means the fund pays at the start of the quarter for the quarter ahead. The case records each quarter's activity on the quarter-end date, so Stanmere posts the fee and its payment together on that date. Stanmere posts each quarter's fee on that quarter's own quarter-end, so no prepaid arises.</p>
</section>`,
`<section class="lesson-section" id="p2-management-fees-s3">
  <h2><span>3</span>After the Investment Period: Invested Cost</h2>
  <p class="eyebrow">A New Basis</p>
  <p>Stanmere's investment period ends on 30 Jun 2025. From the next quarter the 2% applies to invested cost, the cost of the investments the fund still holds, instead of commitments. The manager is no longer paid on money it may never invest.</p>
  <div class="grid two">
    <div class="card"><h3>First quarter on the new basis</h3><p>For 2025 Q3 the fee basis is $106.0M, so the fee is $106.0M × 2% ÷ 4 = $530,000. The $106.0M is the cost of the four companies it still holds (Yarrowfield after a part-sale, Module 3.3), before PIK interest, which is interest added to a loan's principal (Module 3.1). The fee schedule leaves it out of the basis, so the basis is lower than the cost on the schedule of investments in Module 6.1.</p></div>
    <div class="card"><h3>The basis steps down</h3><p>Each time the fund sells a company, its cost leaves the basis and the fee falls. Stanmere's last fee is posted in 2029 Q1; after that nothing is left to charge on. The case's schedule uses the cost held at the end of each quarter, a simplification (a fee billed in advance would use the opening cost), so a sale lowers that quarter's fee; that is why 2029 Q2 has none.</p></div>
  </div>
</section>`,
`<section class="lesson-section" id="p2-management-fees-s4">
  <h2><span>4</span>The Fee Offset</h2>
  <p class="eyebrow">Fees the Manager Earns Elsewhere</p>
  <p>The manager often charges portfolio companies monitoring or transaction fees. In Stanmere's LPA that money belongs to the manager, not the fund, so <b>the fund records no monitoring fee income</b>. Stanmere's LPA says those fees reduce the management fee 100%, so the fund doesn't pay twice for the same people's time. Many LPAs credit the offset against the next bill instead of refunding cash.</p>
  <div class="grid two">
    <div class="card"><h3>How the ledger books it</h3><p>The quarter's fee is billed and paid in full, in advance. When the monitoring fees are known, the fund reduces the fee: Dr 2100 Management fee payable / Cr 5010 Management fee offset. That leaves the manager owing the fund, and the manager refunds the cash: Dr 1000 Cash / Cr 2100.</p></div>
    <div class="card"><h3>2021 Q4 in numbers</h3><p>The fund pays $1,225,000, then the manager refunds $350,000. The fund's net cost for the quarter is $875,000. Account 5000 stays at the full fee; the offset sits in its own account, 5010.</p></div>
  </div>
</section>`,
`<section class="lesson-section" id="p2-management-fees-s5">
  <h2><span>5</span>The Entries and the One Pitfall</h2>
  <p class="eyebrow">Journal Entries · 31 Dec 2021</p>
  <table><thead><tr><th>Step</th><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>
