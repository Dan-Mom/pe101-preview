    <tr><td></td><td>5010 Management fee offset</td><td></td><td>$350,000</td></tr>
  </tbody></table>
  <p>The manager's refund then brings the cash back: Dr 1000 / Cr 2100, $350,000, which clears 2100 to zero. Over its life, from 2019 to 2029, Stanmere pays $33.5M of fees net of offsets; the offsets total $1.4M across four quarters from 2021 Q4 to 2024 Q2.</p>
  <div class="card"><h3>What goes wrong here</h3><p>Booking the monitoring fees as fund income (Cr 4030 Other income - monitoring fees) and also taking the offset. The same fees then help the fund's result twice. The fee is the manager's revenue; the fund's only benefit is the lower management fee, so 4030 stays at nil.</p></div>

 "sections": [
  "<section class=\"lesson-section\" id=\"p3-recording-investments-s1\">\n  <h2><span>1</span>Buying an Investment</h2>\n  <p class=\"eyebrow\">The Three-Step Ladder</p>\n  <div class=\"flow\">\n    <div><b>One sentence</b><p>When a fund buys a stake in a company, it records the investment at what it paid, and, while it holds the stake, that cost only moves when the fund pays in more cash or when interest is added to a loan's principal instead of being paid out.</p></div>\n    <div><b>A tiny number</b><p>A fund pays $10 for a stake in a company (illustrative). Six months later it pays $2 more into the same company. Its cost is now $12: two entries, one account, simple addition.</p></div>\n    <div><b>Stanmere</b><p>On 30 Sep 2021 Stanmere Capital Partners I, L.P. buys 78.0% of the common equity of Ostlund Freightways, Inc. for $28.0M in cash. It books the investment at $28.0M, and nothing has added to that cost since.</p></div>\n  </div>\n  <p class=\"insight\"><b>Why this matters:</b> Part 3 is where the course turns from money coming into the fund to money going to work. Every fair value mark (Module 3.2) and every gain or loss at sale (Module 3.3) starts from the cost number this module builds.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p3-recording-investments-s2\">\n  <h2><span>2</span>Cost at Acquisition: The Plain-Vanilla Entry</h2>\n  <p class=\"eyebrow\">The Simplest Case First</p>\n  <p>Recording a purchase is one of the simplest entries a fund accountant makes: cash goes out, and an asset called Investments, at cost comes in, for the same amount. Under investment-company accounting (ASC 946), the price paid is normally the best evidence of fair value on the purchase date, so cost and day-one fair value are the same number for Stanmere's plain purchases. In practice, transaction costs or other facts can make initial cost and fair value differ from day one; here, the two only part ways at the next quarterly mark.</p>\n  <table><thead><tr><th>30 Sep 2021 · Ostlund purchase</th><th>Debit</th><th>Credit</th></tr></thead><tbody>\n    <tr><td>1100 Investments, at cost</td><td>$28.0M</td><td></td></tr>\n    <tr><td>1000 Cash and cash equivalents</td><td></td><td>$28.0M</td></tr>\n  </tbody></table>\n  <p>No gain, no loss, no income line. The balance sheet trades one asset for another at equal value. Stanmere has no borrowing line, so the cash for a purchase comes from the partners through capital calls (Module 2.1).</p>\n  <figure class=\"pe-fig\">\n    <svg viewBox=\"0 0 700 180\" role=\"img\" aria-label=\"Cash of 28.0 million dollars leaves Stanmere's cash account and the same 28.0 million dollars lands in the investments-at-cost account for Ostlund Freightways on 30 September 2021, one asset traded for another at the same value, with no gain or loss.\">\n      <defs><marker id=\"ri-s2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0L8 4L0 8Z\" fill=\"#0F6E56\"/></marker></defs>\n      <rect class=\"b-fund\" x=\"30\" y=\"30\" width=\"260\" height=\"70\" rx=\"9\"/>\n      <text class=\"t-hd t-w\" x=\"46\" y=\"56\">Cash (1000)</text>\n      <text class=\"t-w\" x=\"46\" y=\"76\" font-size=\"11\">&minus;$28.0M, 30 Sep 2021</text>\n      <path class=\"ar-i\" d=\"M290 65 L408 65\" marker-end=\"url(#ri-s2)\"/>\n      <rect class=\"b-fund\" x=\"410\" y=\"30\" width=\"260\" height=\"70\" rx=\"9\"/>\n      <text class=\"t-hd t-w\" x=\"426\" y=\"56\">Investments, at cost (1100)</text>\n      <text class=\"t-w\" x=\"426\" y=\"76\" font-size=\"11\">+$28.0M, Ostlund</text>\n      <rect class=\"b-sep\" x=\"120\" y=\"120\" width=\"460\" height=\"44\" rx=\"9\"/>\n      <text x=\"136\" y=\"147\" font-size=\"11\">Same amount on both sides: no gain, no loss, no income line.</text>\n    </svg>\n    <figcaption>Ostlund's purchase: $28.0M out of cash, $28.0M into Investments, at cost.</figcaption>\n  </figure>\n</section>",
  "<section class=\"lesson-section\" id=\"p3-recording-investments-s3\">\n  <h2><span>3</span>Follow-Ons: Same Account, Bigger Balance</h2>\n  <p class=\"eyebrow\">When the Fund Writes a Second Check</p>\n  <p>A follow-on is a later check into a company the fund already owns. It uses exactly the same entry as the first check, Dr. Investments, at cost / Cr. Cash, and simply adds to the cost that is already there. Stanmere's stake in Tallow Creek Dental Group was built from a base investment plus later follow-ons, all posted to the same account, and together they make up its $35.0M cost at 31 Dec 2026.</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>What adds to cost</h3><p>The cash paid at purchase.<br>Every follow-on check.<br>PIK interest added to a loan's principal (see the sidebar in Section 4).</p></div>\n    <div class=\"card\"><h3>What does not</h3><p>Fair value marks. They post to a separate unrealized account and leave cost untouched (Module 3.2).<br>For Stanmere, a sale is the event that takes cost out (Module 3.3); in practice a repayment or a return of capital can reduce cost too.</p></div>\n  </div>\n</section>",
  "<section class=\"lesson-section\" id=\"p3-recording-investments-s4\">\n  <h2><span>4</span>Cost Is the Anchor</h2>\n  <p class=\"eyebrow\">Why the Cost Number Keeps Mattering</p>\n  <p>Once a position is on the books, its cost stays in account 1100 for as long as the fund holds it. Each quarter the fund estimates what the position is worth and records the difference from cost in a separate account, so the schedule of investments can show cost and fair value side by side for every company. When the position is finally sold, the fund compares the sale price with this cost to find the realized gain or loss. Ostlund is the simplest case: on the 31 Dec 2026 schedule of investments its cost is still the $28.0M paid in 2021, because no follow-on or PIK ever added to it.</p>\n  <p>That is why the cost entry has to be right on day one: an error here flows into every later mark and into the gain at exit. A bridge note, a short-term loan made ahead of a priced round, is the only twist: it sits in its own account (1150) until it converts; Stanmere's conversion is a plain reclassification of that cost into 1100, with no cash and no gain, though in practice a conversion's terms can also change fair value, which would be assessed separately.</p>\n  <p class=\"insight\"><b>Sidebar · PIK interest.</b> Some loans pay interest \"in kind\": instead of cash, the interest is added to the loan's principal. Stanmere's note to Verrick Power Services works this way. Each quarter the fund books Dr. Investments, at cost (1100) / Cr. Interest income &ndash; PIK (4000). No cash moves and no receivable is set up. By 31 Dec 2026 PIK had added $10.5M to Verrick's cost. Cash interest would be Dr 1000 / Cr 4010 (Interest income &ndash; other); Stanmere has none, its only interest income is PIK.</p>\n</section>",
  "<section class=\"lesson-section\" id=\"p3-recording-investments-s5\">\n  <h2><span>5</span>The Entries + What Goes Wrong</h2>\n  <p class=\"eyebrow\">Journal Entries</p>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>The entries, in one line each</h3><p>Purchase: Dr. Investments, at cost / Cr. Cash and cash equivalents. Ostlund, 30 Sep 2021: $28.0M.<br>Follow-on: the same entry, added to an existing balance.<br>PIK: Dr. Investments, at cost / Cr. Interest income &ndash; PIK. No cash.</p></div>\n    <div class=\"card\"><h3>What goes wrong here</h3><p>Mixing up cost and value. A fair value mark never changes Investments, at cost, and a purchase or follow-on never goes to the unrealized account. If a mark is posted to 1100, the cost basis is wrong, and so is every realized gain later computed from it (Module 3.3). Keep the price paid in 1100 and the estimate of value in its own account.</p></div>\n  </div>\n  <p class=\"warn\">The standard behind this module is investment-company accounting (ASC 946). Module 3.2 picks up at the first quarterly mark.</p>\n  <p class=\"eyebrow\">Disclosure</p>\n  <p><small>Stanmere Capital Partners I, L.P. and every entity named in this module are fictional and were created for instructional purposes. Any resemblance to an actual fund, firm or company is coincidental.</small></p>\n</section>"
 ]

`<section class="lesson-section" id="p3-fair-value-marks-s1">
  <h2><span>1</span>Fair Value Marks</h2>
  <p class="eyebrow">The Three-Step Ladder</p>
  <div class="flow">
    <div><b>One sentence</b><p>Every quarter a fund re-estimates what each investment is worth today and books the change from its last estimate, with no cash changing hands.</p></div>
    <div><b>A tiny number</b><p>A fund pays $10 for a stake in a company (illustrative). By the next quarter end, similar companies are valued higher, and the stake is estimated at $13. The fund books a $3 unrealized gain. If a quarter later the estimate slips to $12, it books a $1 unrealized loss: only the change. Nothing was sold and no cash moved.</p></div>
    <div><b>Stanmere</b><p>Stanmere Capital Partners I, L.P. buys Thornwick Industrial Holdings, Inc. for $42.0M on 30 Jun 2019. At 31 Dec 2019 it marks the stake to a fair value of $43.5M and books a $1.5M unrealized gain.</p></div>
  </div>
  <p class="insight"><b>Why this matters:</b> Module 3.1 put the price paid into Investments, at cost. This module adds the second number every position carries, what it is worth now, and the entry that moves it each quarter.</p>
</section>`,
`<section class="lesson-section" id="p3-fair-value-marks-s2">
  <h2><span>2</span>What Fair Value Is</h2>
  <p class="eyebrow">An Exit Price, Re-Estimated Every Quarter</p>
  <p>Fair value is the price the fund would get for selling an investment in an orderly sale on the measurement date (ASC 820). It is an exit price: what the stake would fetch today, not what the fund paid for it. On the purchase date the two are normally the same number. After that, fair value is re-estimated at every quarter end, and cost stays where it was.</p>
  <p>Private investments often need significant unobservable inputs, which is what makes the measurement Level 3 under ASC 820; those inputs must still reflect what a market participant would use, and a private company is not automatically Level 3.</p>
  <div class="grid two">
    <div class="card"><h3>Market approach</h3><p>Comparable multiples usually value the business first, then its equity: business value $100 less net debt $30 gives equity value $70 (illustrative), and a 20% stake before considering its own rights is $14. EBITDA is earnings before interest, tax, depreciation and amortization. Stanmere values Thornwick this way, on an EBITDA multiple.</p></div>
    <div class="card"><h3>Income approach</h3><p>Value comes from the company's own projected cash flows, discounted back to today (a discounted cash flow model). It suits a mature business with steady, predictable cash flows.</p></div>
  </div>
</section>`,
`<section class="lesson-section" id="p3-fair-value-marks-s3">
  <h2><span>3</span>The Unrealized Entry</h2>
  <p class="eyebrow">Two Accounts, Cost Untouched</p>
  <p>A mark never touches the cost account. Cost stays in 1100 exactly as booked in Module 3.1. The difference between fair value and cost sits in its own balance-sheet account, 1110 Unrealized appreciation/(depreciation) on investments, and the quarter's change runs through the statement of operations in 6100 Net change in unrealized appreciation/(depreciation).</p>
  <p class="insight"><b>A mark up:</b><br>Dr. Unrealized appreciation/(depreciation) on investments (1110)<br>Cr. Net change in unrealized appreciation/(depreciation) (6100)<br>The gain is real income for the period even though nothing was sold.</p>
  <p>The two accounts measure different things. 1110 is the running total since purchase and lives on the balance sheet. 6100 is only this period's move and lives in the statement of operations. So each quarter the fund books only the change from the last mark, never the whole gap to cost again. If the estimate hasn't moved, there is no entry.</p>
  <figure class="pe-fig">

      <rect class="b-fund" x="492" y="30" width="188" height="70" rx="9"/>
      <text class="t-hd t-w" x="508" y="58">Fair value</text>
      <text class="t-w" x="508" y="80" font-size="11">$43.5M</text>

    <figcaption>Cost plus unrealized appreciation equals fair value: Thornwick at 31 Dec 2019.</figcaption>

</section>`,
`<section class="lesson-section" id="p3-fair-value-marks-s4">
  <h2><span>4</span>Marks Go Down Too</h2>
  <p class="eyebrow">Same Two Accounts, Opposite Direction</p>
  <p>A mark is an estimate, so it can fall as easily as it rises. When value drops, the entry flips: Dr. 6100 / Cr. 1110. The loss shows in the statement of operations even though nothing was sold. If value falls below cost, 1110 simply carries a negative (depreciation) balance; cost in 1100 still does not move.</p>
  <p>Stanmere's marks fell too: in 2022 Q2 the fund's marks fell by a net $4.0M (Dr. 6100 / Cr. 1110). A fall like this is one reason accrued carry can reverse (Module 5.3).</p>
  <p>The technique can change too. A revenue multiple only works while a business still has revenue worth multiplying; if that stops being true, the estimate shifts toward what could be recovered in a wind-down, and a mark can fall all the way to zero.</p>
  <div class="grid two">
    <div class="card"><h3>Who sets the mark</h3><p>Choosing the multiple or the discount rate is an investment judgment, made by the people closest to each company and approved through the fund's valuation process.</p></div>
    <div class="card"><h3>What the accountant does</h3><p>The control layer: check the model's arithmetic, confirm the technique matches the one disclosed on the schedule of investments, and post the approved mark to 1110 and 6100.</p></div>
  </div>
</section>`,
`<section class="lesson-section" id="p3-fair-value-marks-s5">
  <h2><span>5</span>The Entries + What Goes Wrong</h2>
  <p class="eyebrow">Journal Entries</p>
  <table><thead><tr><th>Date</th><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>
    <tr><td>31 Dec 2019 · mark up</td><td>1110 Unrealized appreciation/(depreciation) on investments</td><td>$1.5M</td><td></td></tr>
    <tr><td></td><td>6100 Net change in unrealized appreciation/(depreciation)</td><td></td><td>$1.5M</td></tr>
    <tr><td>Any mark down</td><td>6100 Net change in unrealized appreciation/(depreciation)</td><td>the fall</td><td></td></tr>
    <tr><td></td><td>1110 Unrealized appreciation/(depreciation) on investments</td><td></td><td>the fall</td></tr>
  </tbody></table>
  <div class="card"><h3>What goes wrong here</h3><p>The most common mistake is posting a mark to the wrong income line: 6000 Net realized gain/(loss) instead of 6100. A mark is an estimate; a realized gain comes only from an actual sale. Mixing the two makes the fund look as if it sold something it still holds, and breaks the realized/unrealized split that Module 3.3 depends on.</p></div>
  <p class="warn">The standard behind this module is fair value measurement (ASC 820). Module 3.3 shows what happens to the accumulated marks when a position is sold.</p>
  <p class="eyebrow">Disclosure</p>
  <p><small>Stanmere Capital Partners I, L.P. and every entity named in this module are fictional and were created for instructional purposes. Any resemblance to an actual fund, firm or company is coincidental.</small></p>
</section>`

`<section class="lesson-section" id="p3-realized-vs-unrealized-s1">
  <h2><span>1</span>Selling: Realized vs Unrealized</h2>
  <p class="eyebrow">The Three-Step Ladder</p>
  <div class="flow">
    <div><b>One sentence</b><p>When a fund sells an investment, the paper gain from its marks reverses, a realized gain takes its place, and cash comes in.</p></div>
    <div><b>A tiny number</b><p>A fund pays $10 for a stake and later marks it to $12 (illustrative). Then it sells for $12 cash. The $2 unrealized gain reverses, a $2 realized gain appears, and $12 of cash arrives.</p></div>
    <div><b>Stanmere</b><p>On 30 Sep 2024 Stanmere Capital Partners I, L.P. sells its whole stake in Thornwick Industrial Holdings, Inc. Cash in: $118.0M. Cost removed: $50.0M ($42.0M paid in 2019 plus an $8.0M follow-on in 2021). Realized gain: $68.0M. The cash is 2.36x the cost.</p></div>
  </div>
  <p class="insight"><b>Why this matters:</b> Module 3.1 booked the price paid, and Module 3.2 booked the quarterly marks. This module is the last step for an investment: it leaves the books, and its paper gain becomes a real one.</p>
</section>`,
`<section class="lesson-section" id="p3-realized-vs-unrealized-s2">
  <h2><span>2</span>Where the Line Sits</h2>
  <p class="eyebrow">Paper Gain vs Locked-In Gain</p>
  <p>While the fund holds a position, it carries two numbers: cost in 1100 and the unrealized difference to fair value in 1110. A sale ends both. From that day the result is fixed and moves to a different line of the statement of operations.</p>
  <div class="grid two">
    <div class="card"><h3>Unrealized (1110 / 6100)</h3><p>The paper difference between cost and the latest fair value mark. It moves every quarter and exists only while the position is held.</p></div>
    <div class="card"><h3>Realized (6000)</h3><p>Locked in only when the fund disposes of the position. It equals proceeds minus the cost removed, not proceeds minus the last mark.</p></div>
  </div>
  <p>That second point is the one to remember. The realized gain is always measured against cost. The marks along the way were estimates, and at the sale they are simply taken back out.</p>
  <p>On the statement of operations the two lines sit side by side: net realized gain/(loss) (6000) and net change in unrealized appreciation/(depreciation) (6100). In a quarter with a big exit, 6100 often shows a large negative as the marks reverse, while 6000 shows the gain. Read together they tell the story. Read alone, the 6100 line looks like a loss that never happened.</p>
</section>`,
`<section class="lesson-section" id="p3-realized-vs-unrealized-s3">
  <h2><span>3</span>The Exit Entry</h2>
  <p class="eyebrow">Three Things Happen on the Sale Date</p>
  <p><b>1. The unrealized reverses.</b> Whatever appreciation the position carries in 1110 is taken back out: Dr. 6100 / Cr. 1110. The accumulated marks come off the balance sheet.</p>
  <p><b>2. Cost comes off and cash comes in.</b> The full cost leaves 1100 and the cash received goes to 1000.</p>
  <p><b>3. The realized gain appears.</b> The difference between the cash and the cost posts to 6000. For Thornwick that is one compound entry: Dr. 1000 $118.0M, Cr. 1100 $50.0M, Cr. 6000 $68.0M.</p>
  <figure class="pe-fig">
    <svg viewBox="0 0 700 120" role="img" aria-label="Thornwick exit on 30 September 2024: cash of 118.0 million dollars in, minus cost of 50.0 million dollars removed, equals a realized gain of 68.0 million dollars (proceeds are 2.36 times cost).">
      <rect class="b-fund" x="20" y="20" width="190" height="64" rx="9"/>
      <text class="t-hd t-w" x="36" y="46">Cash in (1000)</text>
      <text class="t-w" x="36" y="68" font-size="11">$118.0M</text>
      <text x="224" y="58" font-size="18">&minus;</text>
      <rect class="b-sep" x="248" y="20" width="190" height="64" rx="9"/>
      <text class="t-hd" x="264" y="46">Cost out (1100)</text>
      <text x="264" y="68" font-size="11">$50.0M</text>
      <text x="452" y="58" font-size="18">=</text>
      <rect class="b-fund" x="476" y="20" width="204" height="64" rx="9"/>
      <text class="t-hd t-w" x="492" y="46">Realized gain (6000)</text>
      <text class="t-w" x="492" y="68" font-size="11">$68.0M</text>
      <text class="t-mut" x="20" y="108">Thornwick, 30 Sep 2024</text>
    </svg>
    <figcaption>Proceeds minus cost equals the realized gain: Thornwick's exit.</figcaption>
  </figure>
  <p>The sale itself creates little new value. Any gain already recorded through the marks was in net assets before the sale; the exit moves it from the unrealized line to the realized line and turns it into cash. Only a sale price above or below the last mark changes net assets on the day.</p>
</section>`,
`<section class="lesson-section" id="p3-realized-vs-unrealized-s4">
  <h2><span>4</span>Other Ways a Position Leaves</h2>
  <p class="eyebrow">Partial Exits and Write-Offs</p>
  <p>Not every exit is a clean sale of the whole stake. The same accounts do the work; only the amounts change.</p>
  <div class="grid two">
    <div class="card"><h3>Partial realization</h3><p>The fund sells some shares and keeps the rest. Only the cost of the shares sold comes off 1100, and only that slice of the unrealized balance reverses. The shares kept stay at cost and go on being marked each quarter.</p></div>
    <div class="card"><h3>Write-off</h3><p>The company fails and there are no proceeds. The cost still comes off: Dr. 6000 / Cr. 1100, with no cash line. It is a realized loss even though nothing was collected, and any unrealized depreciation already booked is reversed too (Dr 1110 / Cr 6100).</p></div>
  </div>
  <p>Stanmere has both. On 31 Mar 2025 it wrote off Quillon Grid, Inc.: $12.0M of cost removed, no cash, a $12.0M realized loss. On 30 Jun 2025 it sold part of Yarrowfield Analytics, Inc. for $28.8M cash: $12.0M of cost removed, a $16.8M realized gain, and the rest of the stake stays in 1100 to be marked.</p>
  <p>In every case the test is the same: has the position, or part of it, left the fund? If yes, the result is realized. If the fund still holds it, any change is a mark and stays unrealized.</p>
</section>`,
`<section class="lesson-section" id="p3-realized-vs-unrealized-s5">
  <h2><span>5</span>The Entries + What Goes Wrong</h2>
  <p class="eyebrow">Journal Entries · Thornwick Exit</p>
  <table><thead><tr><th>Date</th><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>

`<section class="lesson-section" id="p4-accruals-expenses-s4">
  <h2><span>4</span>Accruals: Incurred Is Not the Same as Paid</h2>
  <p class="eyebrow">Two Entries, Sometimes Two Quarters</p>
  <p>An expense belongs to the quarter in which the fund received the service, not the quarter the cash left. So each bill takes two entries:</p>

`<section class="lesson-section" id="p5-distributions-recallable-s3">
  <h2><span>3</span>Recallable Distributions</h2>
  <p class="eyebrow">Recycling Mechanics</p>
  <p>A recallable distribution, often called <b>recycling</b>, lets the GP treat capital that already went out the door as if it were still available to call again. It is a planned mechanic, written into the LPA from day one. It is not a clawback, which is the carry recipient giving back carry it was overpaid (Module 5.3). LPAs typically limit recycling in three ways:</p>
  <div class="grid three">
    <div class="card"><h3>What can be recycled</h3><p>Usually only the return-of-capital piece. Some LPAs also allow recycling of short-term gains from very fast exits (say, inside 12-18 months), but this varies a lot by fund.</p></div>
    <div class="card"><h3>When it can be recycled</h3><p>Almost always only during the investment period for new investments. Check whether the LPA preserves recall rights afterwards for expenses, indemnities or other permitted purposes; absent that, distributed capital is gone for good once the window closes.</p></div>
    <div class="card"><h3>How much can be recycled</h3><p>A recycling cap in the LPA, stated as a percentage of total commitments. The actual number varies fund by fund; always read the specific LPA.</p></div>
  </div>
  <p>The recall right is a contractual feature tracked alongside the books, not usually a separate GAAP liability. The recallable piece goes into a recycling tracker (a schedule, not a balance sheet entry) showing the recallable amount, the recall deadline, and the capacity left under the cap. If the GP later recalls the money, it comes in like any capital call (Dr. 1000 Cash / Cr. 3000 Partners' capital - contributions), coded as a <i>recycled call</i> so the tracker can tell reused capital from new commitment usage. Stanmere never recalls a distribution, so this recall entry is a general illustration, not one of its postings.</p>
</section>`,

`<section class="lesson-section" id="p5-waterfalls-1-s1">
  <h2><span>1</span>Three-Step Ladder: Who Gets Each Dollar?</h2>
  <p class="eyebrow">The Three-Step Ladder</p>
  <div class="flow">
    <div><b>One sentence</b><p>The waterfall is the LPA's queue for distributed cash: investors get their capital back first, then a minimum return, and only then does carried interest start.</p></div>
    <div><b>A tiny number</b><p>An illustrative fund draws $100 and, one year later, sends back $150, so profit is $50. Capital first: $100 to the investors. Pref: 8% a year on $100 for one year, $8 to the investors. Catch-up: $2 to the carry side, which now holds 20% of the $10 of profit paid so far. The last $40 splits 80/20: $32 to the investors, $8 to the carry side. Carry is $2 + $8 = $10, exactly 20% of the $50 profit.</p></div>
    <div><b>Stanmere</b><p>Stanmere Capital Partners I, L.P. drew $213.3M from its partners and distributed $412.4M over its life. The same four tiers sent $39.8M of carried interest to Stanmere Carry I, LLC, the special limited partner, and the rest to the partners.</p></div>
  </div>
  <p class="insight"><b>Why this module matters:</b> Module 5.1 showed how a distribution is booked. This module answers the question every investor asks next: how much of that cash was mine, and how much was carry?</p>
</section>`,
`<section class="lesson-section" id="p5-waterfalls-1-s2">
  <h2><span>2</span>The Four Tiers, in Order</h2>
  <p class="eyebrow">Cash Climbs One Rung at a Time</p>
  <p>Each tier must be completely filled before the next one receives a dollar. Stanmere's LPA sets four:</p>
  <div class="grid two">
    <div class="card"><h3>1 · Return of capital</h3><p>100% to the partners until they have back every dollar they paid in. This is their own money coming home, not profit.</p></div>
    <div class="card"><h3>2 · Preferred return</h3><p>100% to the partners until they have received <b>8% a year on capital not yet returned</b>, accrued each quarter on that capital only; unpaid preferred return does not itself earn a return in this case, so the yield is a little under 8%. Many LPAs compound the pref, so read the clause. The pref has a time dimension: it grows for as long as capital is outstanding, and stops growing once all capital is back.</p></div>
    <div class="card"><h3>3 · Catch-up</h3><p>100% to the carry side, Stanmere Carry I, LLC, the special limited partner, until it holds 20% of all profit distributed so far. It exists because tiers 1 and 2 paid the carry side nothing.</p></div>
    <div class="card"><h3>4 · The 80/20 split</h3><p>Every remaining dollar: 80% to the partners, 20% carried interest to Stanmere Carry I, LLC. The catch-up brought the carry side to 20%; this tier keeps it there.</p></div>
  </div>
  <p>The result is the point of the whole design. With a full catch-up, the carry side ends with 20% of total profit. Once the fund earns enough to fill the catch-up, the tiers do not change how much each side receives in the end. They change <b>when</b>: the partners are paid first, and carry arrives last.</p>
</section>`,
`<section class="lesson-section" id="p5-waterfalls-1-s3">
  <h2><span>3</span>European vs American</h2>
  <p class="eyebrow">Where the Test Is Drawn</p>
  <p>Both shapes use the same four tiers. They differ in what the tiers are measured across.</p>
  <div class="grid two">
    <div class="card"><h3>European (whole-fund)</h3><p>The tiers run on the fund's cumulative cash. All capital paid in and all the pref, across every deal including the losers, come back before the first carry dollar. Carry arrives later, reducing the risk that the carry recipient is overpaid before later losses emerge. <b>Stanmere is European.</b></p></div>
    <div class="card"><h3>American (deal-by-deal)</h3><p>The tiers run on each realized deal. A profitable exit can pay carry while other deals are still held and may still lose money. Carry arrives sooner, and the risk of overpaying sits with the investors. Many deal-by-deal LPAs therefore require the fund to make good realized losses and write-downs on earlier deals before carry is paid.</p></div>
  </div>
  <p>The labels are market shorthand. What you model is the distribution clause in the LPA (Module 1.2). When an early carry payment turns out to be too much, the manager may have to hand it back; that clawback is covered in Module 5.3.</p>

  <p>Timing shows the European shape at work. The first distribution, on the day Thornwick was sold, was entirely return of capital. The catch-up was paid in full in one distribution, on 31 Dec 2028, the first one to include any carry.</p>

`<section class="lesson-section" id="p5-carry-accounting-s1">
  <h2><span>1</span>Booking Carried Interest</h2>
  <p class="eyebrow">The Three-Step Ladder</p>
  <div class="flow">
    <div><b>One sentence</b><p>Carry is not a fund expense: each quarter the fund moves an amount of capital from the other partners' accounts into the carry recipient's account, sized as if the fund were sold that day.</p></div>
    <div><b>A tiny number</b><p>An illustrative fund has $100 of profit at today's marks, so 20% carry is $20 and $20 moves between capital accounts. Next quarter the marks fall and profit is $50: carry is now $10, so $10 moves back. Net assets never change.</p></div>
    <div><b>Stanmere</b><p>Stanmere Capital Partners I, L.P. first accrues carry for Stanmere Carry I, LLC, the special limited partner, at 31 Dec 2021: $4.7M. Six months later it has fully reversed to $0. Over the fund's life Carry I is paid $39.8M.</p></div>
  </div>
  <p class="insight"><b>The key idea:</b> Module 5.2 tells you how much carry the waterfall produces. This module tells you where it sits in the books: inside partners' capital in Stanmere's aggregate ledger, never as its own ledger account; a real system may post it differently, as the choices table below explains.</p>
</section>`,
`<section class="lesson-section" id="p5-carry-accounting-s2">
  <h2><span>2</span>A Reallocation, Not an Expense</h2>
  <p class="eyebrow">Capital Account to Capital Account</p>
  <p>Carry is a share of profit between partners. In this structure, the fund owes it to no outside party, so it is not an expense of the fund and there is no carry expense or carry payable account in Stanmere's chart of accounts. Instead, each partner's capital account statement has a <b>Carried interest</b> line. The seven committed partners each show a negative amount; Stanmere Carry I, LLC shows the positive total. The line adds to zero across the fund.</p>
  <div class="grid two">
    <div class="card"><h3>What changes</h3><p>How the partners' capital is split. Each committed partner's account goes down by its share of the carry, and Carry I's account goes up by the same total.</p></div>
    <div class="card"><h3>What does not change</h3><p>The ledger, net assets, the statement of operations and the fund's total capital. Carry shows only in the partner-level views: each partner's capital account statement (4.3) has its own carried interest line, and many real statements of changes in partners' capital show it by partner class. The case's fund-level statement shows the total only.</p></div>
  </div>
  <p>Carry I made no commitment and pays no fee, so its capital account holds nothing but carry: what has been reallocated to it, less what has been paid out to it.</p>
</section>`,
`<section class="lesson-section" id="p5-carry-accounting-s3">
  <h2><span>3</span>Accrued Each Quarter, and It Can Reverse</h2>
  <p class="eyebrow">Assumed-Liquidation Basis</p>
  <p>Investment company reporting under ASC 946 shows each partner's capital as if the fund liquidated at net asset value on the reporting date. So each quarter the team asks one question: if we sold everything at today's marks and ran the waterfall, what would the carry be? The accrual is moved up or down to that answer. When marks rise, carry is reallocated to Carry I. When marks fall, it flows back.</p>
  <table><thead><tr><th>Date</th><th>Stanmere Carry I, LLC capital (accrued carry)</th></tr></thead><tbody>
    <tr><td>31 Dec 2021</td><td>$4.7M · first accrual</td></tr>

    <tr><td>31 Dec 2024</td><td>$18.7M · after rebuilding from mid-2024</td></tr>
  </tbody></table>
  <p>The quarter to 31 Dec 2024 is a strong up-quarter: $9.4M is taken from the seven committed partners' accounts, each by its share, and added to Carry I's. In 2022 the same movement ran in reverse and the balance sat at nil until 2024. Carry can be nil even when the fund shows a profit at its marks: until that profit passes the preferred return, the waterfall pays the carry side nothing. At 30 Jun 2022 the preferred return accrued had reached $24.1M, more than the profit at the marks. A falling accrual is not an error. It is the method working.</p>
</section>`,
`<section class="lesson-section" id="p5-carry-accounting-s4">
  <h2><span>4</span>Paying the Carry, and the Clawback Test</h2>
  <p class="eyebrow">Cash Out Through the Ordinary Distribution</p>
  <p>Carry leaves the fund only when the waterfall pays it. The payment is part of the ordinary distribution entry, Dr 3100 Partners' capital - distributions / Cr 1000 Cash and cash equivalents. The ledger books the whole distribution as one entry; the carry share is split out in the capital account records, where it reduces Carry I's balance.</p>
  <table><thead><tr><th>Distribution date</th><th>Carried interest paid to Stanmere Carry I, LLC</th></tr></thead><tbody>
    <tr><td>31 Dec 2028</td><td>$27.0M</td></tr>
    <tr><td>30 Jun 2029</td><td>$12.3M</td></tr>
    <tr><td>30 Jun 2030 (final)</td><td>$0.5M</td></tr>
    <tr><td><b>Total</b></td><td><b>$39.8M</b></td></tr>
  </tbody></table>
  <p><b>The clawback test</b> is run once, at liquidation, once the waterfall has fully paid the preferred return and catch-up: take the carry actually received, subtract 20% of the whole fund's cumulative profit (total distributions less total contributions), and floor the answer at zero. Anything above zero is returned by the carry recipient. At Stanmere, the carry received equals 20% of the fund's cumulative profit, both $39.8M, so the clawback is $0. A toy case (illustrative): a deal-by-deal fund pays $30 of carry after an early sale, then ends with $125 of total profit. The most the carry recipient may keep is 20% × $125 = $25, so $30 − $25 = $5 goes back. Neither a recall nor a clawback implies anyone did anything wrong; a clawback just means earlier payments ran ahead of the economics. Real LPAs add interim tests, an after-tax cap and escrows.</p>

`<section class="lesson-section" id="p7-audit-season-s1">
  <h2><span>1</span>Year-End: Audit and K-1s</h2>
  <p class="eyebrow">The Three-Step Ladder</p>
  <div class="flow">
    <div><b>One sentence</b><p>After the year closes, an independent auditor tests the fund's annual financial statements, and the fund sends every partner a Schedule K-1 showing its share of the year's taxable results.</p></div>
    <div><b>A tiny number</b><p>An illustrative fund makes a $20 realized gain in the year. The fund itself pays no income tax on it. A partner that owns 10% of the fund gets a K-1 showing a $2 gain and pays any tax on its own return.</p></div>
    <div><b>Stanmere</b><p>For FY2026, Stanmere Capital Partners I, L.P. records $192,000 of audit and tax fees: $48,000 a quarter, each quarter's amount accrued and paid in that same quarter.</p></div>
  </div>
  <p class="insight"><b>Why this module matters:</b> Every first-year fund accountant lives through an audit and a K-1 season. Both run on the same year-end books, so the cleaner the close, the shorter both seasons are.</p>
</section>`,
`<section class="lesson-section" id="p7-audit-season-s2">
  <h2><span>2</span>What the Auditor Tests</h2>
  <p class="eyebrow">Five Areas at 101 Depth</p>
  <p>An independent audit firm gives an opinion on whether the fund's financial statements (6.1) are fairly presented under US GAAP for investment companies (ASC 946). In a PE fund the work concentrates on five areas:</p>
  <p>1. <b>Existence of investments.</b> Does the fund really own each company it reports? The auditor reads the purchase documents and share records and may confirm holdings with the portfolio companies.</p>
  <p>2. <b>Valuation.</b> Are the fair value marks (3.2) reasonable? This is usually the biggest area: the auditor challenges the method, the inputs and the judgment behind each mark.</p>
  <p>3. <b>Capital activity.</b> Do the calls, distributions and each partner's capital account (4.3) agree with the notices sent and the cash that moved?</p>
  <p>4. <b>Fees and the waterfall.</b> Were the management fee, the fund's expenses and any carried interest calculated as the partnership agreement says?</p>
  <p>5. <b>Statements and ledger.</b> Does every line of the financial statements agree with the trial balance, and does the trial balance agree with the general ledger?</p>
</section>`,
`<section class="lesson-section" id="p7-audit-season-s3">
  <h2><span>3</span>What the Fund Accountant Prepares</h2>
  <p class="eyebrow">The PBC List</p>
  <p>The auditor sends a PBC ("prepared by client") list. The fund accountant's year-end is largely working through it:</p>
  <div class="grid two">
    <div class="card"><h3>Roll-forwards</h3><p>Opening balance, plus and minus the year's activity, equals the closing balance. Investments: opening fair value, purchases, sales, realized and unrealized gains, closing fair value. Capital: opening, contributions, distributions, share of results, closing.</p></div>
    <div class="card"><h3>Confirmations and support</h3><p>Lists of banks, custodians, portfolio companies and partners for the auditor to confirm directly, plus reconciliations, valuation files, call and distribution notices and invoices behind the expenses.</p></div>
  </div>
  <p>The audit is also a fund expense. Stanmere books audit and tax fees together in one account, 5200 Professional fees - audit and tax, and does not split them. Stanmere books the fee evenly each quarter and pays it in the same quarter, so nothing is owed at 31 Dec 2026. Many real funds instead accrue the year-end audit at 31 December and pay it the next year, using the accrual pattern in 4.2.</p>
  <p><b>Who else you deal with.</b> Most PE funds use an outside administrator that keeps the books and issues the notices. Ask it for the quarterly NAV package with each partner's capital account, the call and distribution notices before they go out, the valuation file showing who approved each mark, and its SOC 1 report, an independent report on how its controls work, including any exceptions. Ask the auditor early for the timeline, the PBC list and, at the end, the management letter, which lists the control weaknesses it found.</p>
</section>`,
`<section class="lesson-section" id="p7-audit-season-s4">
  <h2><span>4</span>Tax: Pass-Through and the K-1</h2>
  <p class="eyebrow">Book Income Is Not Tax Income</p>
  <p>A PE fund is a partnership, a pass-through: it pays no entity-level federal income tax (some states tax partnerships). Each year it sends every partner a Schedule K-1 with that partner's share of the fund's income, gains, deductions and credits, and each partner reports those amounts on its own return. K-1s often go out well after year-end, so funds may send partners estimates first.</p>
  <p>The K-1 follows tax rules, not the book (GAAP) rules behind the financial statements. The biggest difference in a PE fund: an unrealized gain counts in the book results (the statement of operations) but is not taxable until the investment is sold (3.3). An illustrative fund, for one year:</p>
  <table><thead><tr><th>Illustrative item</th><th>Book</th><th>Tax (K-1)</th></tr></thead><tbody>
    <tr><td>Realized gain on a sale</td><td>$20</td><td>$20</td></tr>
    <tr><td>Unrealized gain on a mark-up</td><td>$30</td><td>$0</td></tr>
    <tr><td><b>Total</b></td><td><b>$50</b></td><td><b>$20</b></td></tr>
  </tbody></table>
  <p>The $30 mark is not current taxable income in this example. On sale, taxable gain uses tax basis and the actual proceeds; it need not equal the earlier book mark, which may also reverse before then. Stanmere's capital accounts are kept on the book basis, and the case contains no tax figures, so this module shows no Stanmere K-1 amounts. Regulatory filings such as Form ADV and Form PF belong to the adviser's compliance team, not the fund's year-end books.</p>
</section>`,
`<section class="lesson-section" id="p7-audit-season-s5">
  <h2><span>5</span>The Entries and the One Pitfall</h2>
  <p class="eyebrow">The Audit and Tax Fee, One Quarter</p>
  <p>Stanmere accrues and pays all its quarterly fund expenses in one combined entry (4.2). Pulled out on its own, the audit and tax part for the quarter ended 31 Dec 2026 looks like this:</p>
  <table><thead><tr><th>Date</th><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>
    <tr><td>31 Dec 2026 · incurred</td><td>5200 Professional fees - audit and tax</td><td>$48,000</td><td></td></tr>
    <tr><td></td><td>2000 Accounts payable and accrued expenses</td><td></td><td>$48,000</td></tr>
    <tr><td>31 Dec 2026 · paid</td><td>2000 Accounts payable and accrued expenses</td><td>$48,000</td><td></td></tr>
    <tr><td></td><td>1000 Cash and cash equivalents</td><td></td><td>$48,000</td></tr>
  </tbody></table>
  <p>Four quarters of this make the $192,000 for the year. The K-1s need no journal entry: they report the year's results; they don't change them.</p>
  <div class="card"><h3>What goes wrong here</h3><p>Copying book figures onto the K-1. A partner's book capital account includes unrealized gains, so it is not its tax capital, and an unrealized gain reported as taxable income makes partners pay tax on profit the fund has not realized. The K-1 starts from the books but applies the tax rules.</p></div>
  <p class="eyebrow">Disclosure</p>
  <p><small>Stanmere Capital Partners I, L.P. and every entity named in this module are fictional and were created for instructional purposes. Any resemblance to an actual fund, firm or company is coincidental.</small></p>
</section>`
  ]
};

  "<section class=\"lesson-section\" id=\"p10-resources-s1\">\n  <h2><span>1</span>The Stanmere Workbook</h2>\n  <p class=\"eyebrow\">One free file behind every number in the course</p>\n  <p>Every dollar figure in the lessons comes from one Excel file: the master case workbook for Stanmere Capital Partners I, L.P. It holds the full ledger, the partner allocations, the financial statements and the waterfall for the fund’s whole life, from 2019 to 2030. The lessons show a few rounded figures. The workbook holds the exact values. The fund and every name in it are fictional, built for teaching.</p>\n  <p><a href=\"Stanmere_Capital_Partners_I_Master_Case.xlsx\" download><b>Download the Stanmere workbook (.xlsx)</b></a></p>\n  <div class=\"insight\"><b>Check any number in three steps.</b> (1) Find the figure in the tie-out map (sections 9 to 11) and read its tab and cell. (2) Open the workbook, click the tab, and type the cell reference in the Name Box at the top left of Excel, for example G5. (3) Compare. The lesson shows the exact value rounded once, to $0.1M for most dollar figures; Excel may show fewer decimals than the cell holds, so widen the column or look in the formula bar.</div>\n  <div class=\"grid two\">\n    <div class=\"card\"><h3>How the workbook is built</h3><p>The two big layers typed in by hand are the <b>Journal Entries</b> ledger and the <b>Allocations</b> split. A few smaller schedules are typed too (Fund Terms, Partners, and the quarterly contribution and distribution columns on Management Fee, Waterfall and Performance), and the <b>Tie-Out Checks</b> tab proves they agree with the ledger. The ledger, allocations, terms, commitments, each holding's cost and fair-value inputs, the fee bases and offsets, and the cash-flow schedule all contain typed inputs; the rest is formulas that build the reports and the tie-out checks. Change a journal entry and the trial balance and statements follow, but a passing check does not by itself prove every holding or partner allocation is correct: review the typed inputs too.</p></div>\n    <div class=\"card\"><h3>Two things to know</h3><p>The Journal Entries column headed <b>Curriculum module</b> uses an older numbering of this course. Do not use it to find which lesson a line belongs to; use the tie-out map instead. And Excel row numbers are what this appendix cites, so the first ledger line is row 5.</p></div>\n  </div>\n  <table>\n    <tr><th>Group</th><th>Tab</th><th>What it holds</th></tr>\n    <tr><td>Setup</td><td><b>Fund Terms</b></td><td>Every economic term in one place: commitments, fee rate, preferred return, carry, closes.</td></tr>\n    <tr><td>Setup</td><td><b>Partners</b></td><td>The seven committed partners and when each was admitted.</td></tr>\n    <tr><td>Setup</td><td><b>Chart of Accounts</b></td><td>Every account number and name, and the accounts Stanmere never uses.</td></tr>\n    <tr><td>Ledger</td><td><b>Journal Entries</b></td><td>The general ledger, one line per debit or credit. Excel row 5 is the first entry.</td></tr>\n    <tr><td>Ledger</td><td><b>Allocations</b></td><td>How each amount is split among the partners.</td></tr>\n    <tr><td>Ledger</td><td><b>Trial Balance</b></td><td>Every account by year, built from the ledger.</td></tr>\n    <tr><td>Statements</td><td><b>Balance Sheet</b></td><td>The statement of assets and liabilities.</td></tr>\n    <tr><td>Statements</td><td><b>Income Statement</b></td><td>The statement of operations.</td></tr>\n    <tr><td>Statements</td><td><b>Changes in Partners Capital</b></td><td>Opening capital, contributions, allocations, distributions, closing capital.</td></tr>\n    <tr><td>Statements</td><td><b>Cash Flow Statement</b></td><td>The cash flow statement, indirect method.</td></tr>\n    <tr><td>Statements</td><td><b>Financial Highlights</b></td><td>Ratios and IRR for the limited partner class.</td></tr>\n    <tr><td>Statements</td><td><b>Schedule of Investments</b></td><td>Each holding at 31 Dec 2026: cost and   "<section class=\"lesson-section\" id=\"p10-resources-s2\">\n  <h2><span>2</span>Stanmere’s FY2026 Statements</h2>\n  <p class=\"eyebrow\">A compact set of the fund’s statements, read straight from the workbook</p>\n  <p>Module 6.1 names the statements; here they are, for Stanmere at 31 December 2026. Amounts are in whole US dollars (the workbook holds cents), so a total can differ from the sum of its lines by a dollar. Each line shows its workbook tab and cell.</p>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\">A. Statement of Assets and Liabilities at 31 Dec 2026</h3>\n  <p>The fund’s balance sheet. Investments at fair value is account 1100 plus 1110 (cost plus the unrealized difference). Stanmere owes nothing at this date, so net assets equal total assets, and net assets are also the sum of the eight partners’ capital accounts.</p>\n  <table>\n    <tr><th>Line</th><th>US dollars</th><th>Where in the workbook</th></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">ASSETS</td></tr>\n    <tr><td>Investments, at fair value</td><td style=\"text-align:right\">194,549,085</td><td><small>Balance Sheet, cell I6</small></td></tr>\n    <tr><td>Cash and cash equivalents</td><td style=\"text-align:right\">304,000</td><td><small>Balance Sheet, cell I7</small></td></tr>\n    <tr><td>Interest and PIK receivable</td><td style=\"text-align:right\">–</td><td><small>Balance Sheet, cell I8</small></td></tr>\n    <tr><td>Subscriptions receivable</td><td style=\"text-align:right\">–</td><td><small>Balance Sheet, cell I9</small></td></tr>\n    <tr><td>Prepaid management fee</td><td style=\"text-align:right\">–</td><td><small>Balance Sheet, cell I10</small></td></tr>\n    <tr><td>Deferred offering costs</td><td style=\"text-align:right\">–</td><td><small>Balance Sheet, cell I11</small></td></tr>\n    <tr><td><b>Total assets</b></td><td style=\"text-align:right\"><b>194,853,085</b></td><td><small>Balance Sheet, cell I12</small></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">LIABILITIES</td></tr>\n    <tr><td>Accounts payable and accrued expenses</td><td style=\"text-align:right\">–</td><td><small>Balance Sheet, cell I15</small></td></tr>\n    <tr><td>Management fee payable</td><td style=\"text-align:right\">–</td><td><small>Balance Sheet, cell I16</small></td></tr>\n    <tr><td>Distributions payable</td><td style=\"text-align:right\">–</td><td><small>Balance Sheet, cell I17</small></td></tr>\n    <tr><td>Subscription line payable</td><td style=\"text-align:right\">–</td><td><small>Balance Sheet, cell I18</small></td></tr>\n    <tr><td><b>Total liabilities</b></td><td style=\"text-align:right\"><b>–</b></td><td><small>Balance Sheet, cell I19</small></td></tr>\n    <tr><td><b>NET ASSETS</b></td><td style=\"text-align:right\"><b>194,853,085</b></td><td><small>Balance Sheet, cell I21</small></td></tr>\n  </table>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\">B. Schedule of Investments at 31 Dec 2026</h3>\n  <p>Four companies are still held. Verrick’s cost includes the PIK interest added to its note. The fair value total agrees to the investments line on the statement above, and every position is Level 3.</p>\n  <table>\n    <tr><th>Company</th><th>Cost</th><th>Fair value</th><th>Unrealized</th><th>% of net assets</th></tr>\n    <tr><td>Yarrowfield Analytics, Inc.<br><small>Schedule of Investments, row 5</small></td><td>18,000,000</td><td>46,000,000</td><td>28,000,000</td><td>23.6%</td></tr>\n    <tr><td>Tallow Creek Dental Group, LLC<br><small>Schedule of Investments, row 6</small></td><td>35,000,000</td><td>64,000,000</td><td>29,000,000</td><td>32.8%</td></tr>\n    <tr><td>Ostlund Freightways, Inc.<br><small>Schedule of Investments, row 7</small></td><td>28,000,000</td><td>33,000,000</td><td>5,000,000</td><td>16.9%</td></tr>\n    <tr><td>Verrick Power Services, LLC<br><small>Schedule of Investments, row 8</small></td><td>35,549,085</td><td>51,549,085</td><td>16,000,000</td><td>26.5%</td></tr>\n    <tr><td><b>Total investments</b><br><small>Schedule of Investments, row 9</small></td><td>116,549,085</td><td>194,549,085</td><td>78,000,000</td><td>99.8%</td></tr>\n  </table>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\">C. Statement of Operations, year ended 31 Dec 2026</h3>\n  <p>Read it top to bottom: investment income, less expenses, gives net investment income; then realized and unrealized gains. Almost all of the year’s increase is an unrealized mark-up, not cash.</p>\n  <table>\n    <tr><th>Line</th><th>US dollars</th><th>Where in the workbook</th></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">INVESTMENT INCOME</td></tr>\n    <tr><td>Interest income - PIK</td><td style=\"text-align:right\">2,737,541</td><td><small>Income Statement, cell I6</small></td></tr>\n    <tr><td>Interest income - other</td><td style=\"text-align:right\">–</td><td><small>Income Statement, cell I7</small></td></tr>\n    <tr><td>Other income - monitoring fees</td><td style=\"text-align:right\">–</td><td><small>Income Statement, cell I8</small></td></tr>\n    <tr><td><b>Total investment income</b></td><td style=\"text-align:right\"><b>2,737,541</b></td><td><small>Income Statement, cell I9</small></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">EXPENSES</td></tr>\n    <tr><td>Management fee</td><td style=\"text-align:right\">2,120,000</td><td><small>Income Statement, cell I12</small></td></tr>\n    <tr><td>Less: management fee offset</td><td style=\"text-align:right\">–</td><td><small>Income Statement, cell I13</small></td></tr>\n    <tr><td>Organizational costs</td><td style=\"text-align:right\">–</td><td><small>Income Statement, cell I14</small></td></tr>\n    <tr><td>Amortization of deferred offering costs</td><td style=\"text-align:right\">–</td><td><small>Income Statement, cell I15</small></td></tr>\n    <tr><td>Professional fees - audit and tax</td><td style=\"text-align:right\">192,000</td><td><small>Income Statement, cell I16</small></td></tr>\n    <tr><td>Professional fees - legal</td><td style=\"text-align:right\">60,000</td><td><small>Income Statement, cell I17</small></td></tr>\n    <tr><td>Fund administration fees</td><td style=\"text-align:right\">220,000</td><td><small>Income Statement, cell I18</small></td></tr>\n    <tr><td>Custody and bank fees</td><td style=\"text-align:right\">30,000</td><td><small>Income Statement, cell I19</small></td></tr>\n    <tr><td>Interest expense - subscription line</td><td style=\"text-align:right\">–</td><td><small>Income Statement, cell I20</small></td></tr>\n    <tr><td>Other fund expenses</td><td style=\"text-align:right\">32,000</td><td><small>Income Statement, cell I21</small></td></tr>\n    <tr><td><b>Total expenses</b></td><td style=\"text-align:right\"><b>2,654,000</b></td><td><small>Income Statement, cell I22</small></td></tr>\n    <tr><td><b>NET INVESTMENT INCOME / (LOSS)</b></td><td style=\"text-align:right\"><b>83,541</b></td><td><small>Income Statement, cell I23</small></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">REALIZED AND UNREALIZED</td></tr>\n    <tr><td>Net realized gain / (loss) on investments</td><td style=\"text-align:right\">–</td><td><small>Income Statement, cell I26</small></td></tr>\n    <tr><td>Net change in unrealized appreciation / (depreciation)</td><td style=\"text-align:right\">15,500,000</td><td><small>Income Statement, cell I27</small></td></tr>\n    <tr><td><b>NET INCREASE / (DECREASE) IN NET ASSETS FROM OPERATIONS</b></td><td style=\"text-align:right\"><b>15,583,541</b></td><td><small>Income Statement, cell I28</small></td></tr>\n  </table>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\">D. Statement of Changes in Partners’ Capital, year ended 31 Dec 2026</h3>\n  <p>The bridge from opening to closing net assets: opening capital, plus contributions, less distributions and offering costs charged to capital, plus the result from operations. The closing figure equals net assets above.</p>\n  <table>\n    <tr><th>Line</th><th>US dollars</th><th>Where in the workbook</th></tr>\n    <tr><td>Partners' capital, beginning of year</td><td style=\"text-align:right\">178,069,544</td><td><small>Changes in Partners Capital, cell I5</small></td></tr>\n    <tr><td>Capital contributions</td><td style=\"text-align:right\">1,200,000</td><td><small>Changes in Partners Capital, cell I6</small></td></tr>\n    <tr><td>Offering costs charged against capital</td><td style=\"text-align:right\">–</td><td><small>Changes in Partners Capital, cell I7</small></td></tr>\n    <tr><td>Capital distributions</td><td style=\"text-align:right\">–</td><td><small>Changes in Partners Capital, cell I8</small></td></tr>\n    <tr><td>Net increase / (decrease) from operations</td><td style=\"text-align:right\">15,583,541</td><td><small>Changes in Partners Capital, cell I9</small></td></tr>\n    <tr><td><b>Partners' capital, end of year</b></td><td style=\"text-align:right\"><b>194,853,085</b></td><td><small>Changes in Partners Capital, cell I10</small></td></tr>\n  </table>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\">E. Statement of Cash Flows, year ended 31 Dec 2026</h3>\n  <p>Indirect method. Under ASC 946 the fund’s purchases and sales of investments are operating activities (there were none this year). Cash fell even though net assets rose: the gain was an unrealized mark and the PIK interest was not paid in cash, so the year’s cash movement was $2.65M of expenses paid less $1.2M called.</p>\n  <table>\n    <tr><th>Line</th><th>US dollars</th><th>Where in the workbook</th></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">CASH FLOWS FROM OPERATING ACTIVITIES</td></tr>\n    <tr><td>Net increase / (decrease) in net assets from operations</td><td style=\"text-align:right\">15,583,541</td><td><small>Cash Flow Statement, cell I6</small></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">Adjustments to reconcile to net cash provided by / (used in) operating activities:</td></tr>\n    <tr><td>Net realized (gain) / loss on investments</td><td style=\"text-align:right\">–</td><td><small>Cash Flow Statement, cell I8</small></td></tr>\n    <tr><td>Net change in unrealized (appreciation) / depreciation</td><td style=\"text-align:right\">(15,500,000)</td><td><small>Cash Flow Statement, cell I9</small></td></tr>\n    <tr><td>PIK interest income capitalised into the note principal (non-cash)</td><td style=\"text-align:right\">(2,737,541)</td><td><small>Cash Flow Statement, cell I10</small></td></tr>\n    <tr><td>Purchases of investments, at cost</td><td style=\"text-align:right\">–</td><td><small>Cash Flow Statement, cell I11</small></td></tr>\n    <tr><td>Proceeds from disposition of investments</td><td style=\"text-align:right\">–</td><td><small>Cash Flow Statement, cell I12</small></td></tr>\n    <tr><td>(Increase) / decrease in interest receivable</td><td style=\"text-align:right\">–</td><td><small>Cash Flow Statement, cell I13</small></td></tr>\n    <tr><td>(Increase) / decrease in subscriptions receivable and prepaid expenses</td><td style=\"text-align:right\">–</td><td><small>Cash Flow Statement, cell I14</small></td></tr>\n    <tr><td>(Increase) / decrease in deferred offering costs</td><td style=\"text-align:right\">–</td><td><small>Cash Flow Statement, cell I15</small></td></tr>\n    <tr><td>Increase / (decrease) in payables and accrued liabilities</td><td style=\"text-align:right\">–</td><td><small>Cash Flow Statement, cell I16</small></td></tr>\n    <tr><td><b>Net cash provided by / (used in) operating activities</b></td><td style=\"text-align:right\"><b>(2,654,000)</b></td><td><small>Cash Flow Statement, cell I17</small></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">CASH FLOWS FROM FINANCING ACTIVITIES</td></tr>\n    <tr><td>Capital contributions</td><td style=\"text-align:right\">1,200,000</td><td><small>Cash Flow Statement, cell I20</small></td></tr>\n    <tr><td>Offering costs paid from capital</td><td style=\"text-align:right\">–</td><td><small>Cash Flow Statement, cell I21</small></td></tr>\n    <tr><td>Capital distributions</td><td style=\"text-align:right\">–</td><td><small>Cash Flow Statement, cell I22</small></td></tr>\n    <tr><td><b>Net cash provided by / (used in) financing activities</b></td><td style=\"text-align:right\"><b>1,200,000</b></td><td><small>Cash Flow Statement, cell I23</small></td></tr>\n    <tr><td><b>Net increase / (decrease) in cash</b></td><td style=\"text-align:right\"><b>(1,454,000)</b></td><td><small>Cash Flow Statement, cell I25</small></td></tr>\n    <tr><td>Cash, beginning of year</td><td style=\"text-align:right\">1,758,000</td><td><small>Cash Flow Statement, cell I26</small></td></tr>\n    <tr><td><b>Cash, end of year</b></td><td style=\"text-align:right\"><b>304,000</b></td><td><small>Cash Flow Statement, cell I27</small></td></tr>\n  </table>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\">F. One partner’s capital account: Kelbrook State Retirement System, inception to 31 Dec 2026</h3>\n  <p>The same building blocks as the fund statements, but for one partner: what it put in, its share of every result, the carry taken out of its account, and what it received. Kelbrook committed 30% of the fund but holds about 26% of net assets; Module 4.3 explains why the two differ.</p>\n  <table>\n    <tr><th>Line</th><th>US dollars</th><th>Where in the workbook</th></tr>\n    <tr><td>Capital contributions</td><td style=\"text-align:right\">63,660,000</td><td><small>Allocations, Kelbrook State Retirement System, component Capital contributions, quarters 2019Q1 to 2026Q4</small></td></tr>\n    <tr><td>Offering costs charged to capital</td><td style=\"text-align:right\">(562,500)</td><td><small>Allocations, Kelbrook State Retirement System, component Offering costs charged to capital, quarters 2019Q1 to 2026Q4</small></td></tr>\n    <tr><td>Share of investment income (PIK interest)</td><td style=\"text-align:right\">3,164,725</td><td><small>Allocations, Kelbrook State Retirement System, component Investment income, quarters 2019Q1 to 2026Q4</small></td></tr>\n    <tr><td>Share of management fee</td><td style=\"text-align:right\">(10,294,898)</td><td><small>Allocations, Kelbrook State Retirement System, component Management fee, quarters 2019Q1 to 2026Q4</small></td></tr>\n    <tr><td>Share of fund expenses (accounts 5100 to 5600)</td><td style=\"text-align:right\">(2,230,008)</td><td><small>Allocations, Kelbrook State Retirement System, component Other fund expenses, quarters 2019Q1 to 2026Q4</small></td></tr>\n    <tr><td>Share of realized gain</td><td style=\"text-align:right\">21,840,000</td><td><small>Allocations, Kelbrook State Retirement System, component Realized gain/(loss), quarters 2019Q1 to 2026Q4</small></td></tr>\n    <tr><td>Share of change in unrealized appreciation</td><td style=\"text-align:right\">23,575,000</td><td><small>Allocations, Kelbrook State Retirement System, component Change in unrealized, quarters 2019Q1 to 2026Q4</small></td></tr>\n    <tr><td>Carried interest reallocated to Stanmere Carry I, LLC</td><td style=\"text-align:right\">(7,158,942)</td><td><small>Allocations, Kelbrook State Retirement System, component Carried interest, quarters 2019Q1 to 2026Q4</small></td></tr>\n    <tr><td>Distributions received</td><td style=\"text-align:right\">(41,557,119)</td><td><small>Allocations, Kelbrook State Retirement System, component Distributions, quarters 2019Q1 to 2026Q4</small></td></tr>\n    <tr><td><b>Capital account, ending balance</b></td><td style=\"text-align:right\"><b>50,436,258</b></td><td><small>Sum of the lines above</small></td></tr>\n  </table>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\">G. Financial Highlights (limited partner class), year ended 31 Dec 2026</h3>\n  <p>Required supplementary information under ASC 946-205-50. Every ratio below is to average LP net assets, and excludes the GP (fee-free) and Stanmere Carry I, LLC: including either would distort the ratios, since neither pays a fee or bears expenses the way an LP does. “Total return” is the period’s change in NAV per dollar invested, before or after carried interest; it is not the since-inception IRR on the last line, which uses dated cash flows (Module 6.2).</p>\n  <table>\n    <tr><td>Average LP net assets (the denominator for every ratio below)</td><td style=\"text-align:right\">$159.8M</td><td><small>Financial Highlights, I7</small></td></tr>\n  </table>\n  <table>\n    <tr><th>Ratio (to average LP net assets)</th><th>FY2026</th><th>Where in the workbook</th></tr>\n    <tr><td>Total expenses, excluding carried interest</td><td style=\"text-align:right\">1.7%</td><td><small>Financial Highlights, I10</small></td></tr>\n    <tr><td>Carried interest (assumed-liquidation accrual)</td><td style=\"text-align:right\">1.9%</td><td><small>Financial Highlights, I11</small></td></tr>\n    <tr><td><b>Total expenses, including carried interest</b></td><td style=\"text-align:right\"><b>3.6%</b></td><td><small>Financial Highlights, I12</small></td></tr>\n    <tr><td>Net investment income, barely positive this year</td><td style=\"text-align:right\">0.02%</td><td><small>Financial Highlights, I13</small></td></tr>\n    <tr><td>Total return before carried interest</td><td style=\"text-align:right\">9.5%</td><td><small>Financial Highlights, I16</small></td></tr>\n    <tr><td><b>Total return after carried interest</b></td><td style=\"text-align:right\"><b>7.6%</b></td><td><small>Financial Highlights, I17</small></td></tr>\n    <tr><td><b>IRR since inception, annualized (LP, net of all fees and carried interest)</b></td><td style=\"text-align:right\"><b>8.1%</b></td><td><small>Financial Highlights, I20</small></td></tr>\n  </table>\n</section>",
  "<section class=\"lesson-section\" id=\"p10-resources-s3\">\n  <h2><span>3</span>Practice: Parts 0 to 3</h2>\n  <p class=\"eyebrow\">Three questions per module: one to think through, one to try with numbers, one to check in the workbook. Try each before you open the answer.</p>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p0-what-is-a-pe-fund\" title=\"What a PE Fund Is\">0.1</a> · What a PE Fund Is</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> Which of these appear in Stanmere's own ledger: (a) Kelbrook wires cash for a capital call; (b) Kelbrook's accountant records its Stanmere investment in Kelbrook's own books; (c) Thornwick pays its suppliers?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Only (a): cash in, partners' capital up.</b> The fund is a separate entity with its own books. Kelbrook's own records (b) and Thornwick's own records (c) sit on their own books, not the fund's.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> A fund has $400M of commitments (illustrative). The GP commits 2.0% of it, and one LP commits $140M. How much do all the LPs commit together, and what percentage of the fund is that one LP?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>$392M in total; the $140M LP is 35% of the fund.</b> The GP's 2.0% is $8M, so the LPs commit $400M less $8M. $140M ÷ $400M is 35%.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open the Partners tab. Add the seven commitments in C5 to C11 and compare with the fund's total in C12. Is Stanmere Carry I, LLC listed? What does that tell you about its role?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>They add to $250M, the total. The carry vehicle is not listed: it has no commitment.</b> As the special limited partner it commits nothing; its only economic right is the carried interest, so all $250M of commitments sit with the GP and six LPs.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p0-why-fund-accounting-differs\" title=\"Why Fund Accounting Is Different\">0.2</a> · Why Fund Accounting Is Different</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> A new colleague builds the fund's equity section as \"Share capital\" plus \"Retained earnings\" and adds earnings per share. What does an investment-company fund show instead, and where does each period's income go?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Partners' capital, one account per investor; income is allocated to those accounts.</b> A fund's equity is partners' capital, which adds up to its NAV. It has no retained earnings line and no EPS; the LPA sets how each period's income is allocated.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> A fund pays $8.0M cash for a company (illustrative). At quarter-end it estimates the stake is worth $9.6M. Give both entries, with account numbers and amounts.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Buy: Dr 1100 Investments, at cost $8.0M; Cr 1000 Cash $8.0M. Mark: Dr 1110 Unrealized appreciation/(depreciation) $1.6M; Cr 6100 Net change in unrealized appreciation/(depreciation) $1.6M.</b> Cost goes on at the price paid. The mark books only the $1.6M rise, through the statement of operations, although nothing was sold.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open the Balance Sheet tab, cell I6 (Investments, at fair value, FY2026), and the Trial Balance tab, cell K7 (1100 Investments, at cost, FY2026). Which figure does the balance sheet report, and how far above cost is it?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Fair value, $194.5M: $78.0M above the $116.5M of cost.</b> The fund reports investments at fair value, not cost. The $78.0M gap is the balance of 1110, the unrealized appreciation.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p0-follow-one-dollar\" title=\"Follow One Dollar\">0.3</a> · Follow One Dollar</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> Name the stop (1 to 6) for each event: (a) an LP signs a $20M subscription agreement (illustrative); (b) the fund sells a company for cash; (c) a company is re-estimated at quarter-end; (d) an LP receives its annual tax form. Which stops create no journal entry?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>(a) Stop 1; (b) Stop 4; (c) Stop 3; (d) Stop 6. Stops 1 and 6 create no entry.</b> A commitment stays off the books until it is called, and a K-1 is a tax report. Cash calls, investments, marks and exits are the stops that post entries.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> An investor commits $200 (illustrative). $50 is called and invested; that slice later sells for $80. How much of the $200 is on the ledger after the call? Give the sale entry (accounts with numbers).</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>$50 (in 3000). Sale: Dr 1000 Cash $80; Cr 1100 Investments, at cost $50; Cr 6000 Net realized gain $30.</b> The uncalled $150 is unfunded commitment, tracked off the ledger. The gain is proceeds less cost, and the waterfall then splits it.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open the Fund Terms tab. Cell B15 (catch-up) is 100% and B16 (carried interest) is 20%. One colleague says the carry side takes 20% of every dollar once the preferred return is paid. Another says it takes 100% until it holds 20% of profit so far. Which does the tab support?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>The second: a 100% catch-up, then 20%.</b> The note in C15 reads \"100% until the carry side holds 20% of profits\". Only after that catch-up does profit split 80/20 (Module 5.2).</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p1-fund-structures\" title=\"Who's Who: Fund Structures\">1.1</a> · Who's Who: Fund Structures</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> Which entity's books does each item belong on: (a) the deal team's salaries; (b) the fund's audit fee; (c) the revenue from the management fee; (d) the GP's $5M capital account?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>(a) the management company; (b) the fund; (c) the management company; (d) the fund.</b> Salaries, office costs and fee revenue sit at the management company. Audit and administration sit at the fund, and the GP is a partner in the fund, so its capital account is on the fund's books.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> An illustrative fund has $180M of commitments, including a fee-free GP commitment of $6M. The fee is 1.5% a year, billed quarterly. What is one quarter's fee, and which two accounts (with numbers) does the fund's entry use?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>$652,500. Debit 5000 Management fee; credit 2100 Management fee payable.</b> ($180M − $6M) × 1.5% ÷ 4. The manager books the matching revenue on its own ledger, not the fund's.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> On the Partners tab, add the commitments of the three partners marked Close 1 in column E (C5 to C7). Then open the Management Fee tab and read the 2019Q1 fee base (C5). What is the difference, and whose commitment is it?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>$5M, the GP's commitment.</b> Close 1 commitments total $120M but the fee base is $115M, because the GP's commitment is fee-free.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p1-how-to-read-an-lpa\" title=\"Reading the LPA\">1.2</a> · Reading the LPA</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> An illustrative fund has received $100M of contributions and has already returned $40M of that capital to partners. A colleague works out the year's 8% preferred return on the $100M. What is wrong, and what should the year's preferred return be?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>The pref accrues only on unreturned capital: $60M, so $4.8M, not $8.0M.</b> The waterfall's preferred return runs on capital not yet returned. Read what a rate applies to, not just the rate.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> Illustrative clause (paraphrased): \"Quarterly in advance, the Fund pays the Manager 1.5% a year of Commitments other than the General Partner's, less 100% of monitoring fees the Manager receives.\" Commitments are $320M, including the GP's $8M. The Manager receives no monitoring fees this quarter. Give the fee entry.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Dr 5000 Management fee $1,170,000; Cr 2100 Management fee payable $1,170,000.</b> ($320M − $8M) × 1.5% ÷ 4. The clause leaves the GP's commitment out of the base, and no offset applies this quarter.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Fund Terms B10 says Stanmere's investment period ends on 30 Jun 2025. On the Management Fee tab, read the basis (column B) and fee base (column C) for 2025Q2 and 2025Q3. What changes, and what does it do to the fee base?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>The basis moves from Commitments to Invested cost, and the fee base falls from $245.0M to $106.0M.</b> This is the clause \"afterwards, on the cost of investments\" at work: the quarterly fee falls from $1,225,000 to $530,000.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p1-org-vs-offering-costs\" title=\"Startup Costs: Org vs Offering\">1.3</a> · Startup Costs: Org vs Offering</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> A law firm sends a $50,000 invoice (illustrative) for reviewing Stanmere's offering memorandum before it goes to investors. A colleague books it to 5100 Organizational costs because \"it is legal work\". Do you agree?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>No. It is an offering cost, charged against partners' capital (3050), not expensed.</b> Classify each invoice by its purpose, not its vendor. The review exists only because the fund is selling interests, so it is treated as a cost of raising the capital.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> An illustrative fund pays $300,000 of legal fees to form itself and $200,000 to print and distribute its offering memorandum. At its first close only two partners exist, committing $60M and $40M. Give the two entries (accounts with numbers) and each partner's share of the offering costs.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Dr 5100 $300,000 / Cr 1000; Dr 3050 $200,000 / Cr 1000. Shares: $120,000 and $80,000.</b> Only the $300,000 reduces reported results. Offering costs fall on the partners in the fund at first close, in proportion to commitments (60% and 40%).</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open the Allocations tab. The 2019Q1 offering costs charged to capital appear for the GP (E6) and for Kelbrook (E9). Divide E9 by E6, and compare with the ratio of their commitments (Partners tab, C6 and C5). What do you find?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Both ratios are 15: the $0.9M was shared exactly in proportion to commitments.</b> Kelbrook's $562,500 is 15 times the GP's $37,500, just as its $75M commitment is 15 times the GP's $5M.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p1-closes-equalization\" title=\"Later Closes &amp; Equalization\">1.4</a> · Later Closes &amp; Equalization</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> The Close 2 partners pay their true-up contribution and equalization interest. A colleague adds: \"They should also reimburse the earlier partners for their share of the $0.9M of offering costs, so everyone ends level.\" Under Stanmere's policy, is that right?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>No. At Stanmere, equalization levels capital contributions only.</b> The offering costs stay with the three partners in the fund when they were incurred (1.3). Many real LPAs make later closers share them, so read each LPA.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> In an illustrative fund, $30M has been called from the first-close partners. A second close admits
