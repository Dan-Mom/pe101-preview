color:#0F6E56\">P</td></tr>\n    <tr><td><b>Paid-In Capital</b></td><td>The total a partner (or the whole fund) has actually contributed through capital calls.</td><td><a href=\"#p2-capital-calls\" title=\"Capital Calls\">2.1</a></td></tr>\n    <tr><td><b>Partial Realization</b></td><td>A sale of part of a position. Only the cost of the shares actually sold comes off the books; the rest stays in 1100 and keeps being marked.</td><td><a href=\"#p3-realized-vs-unrealized\" title=\"Selling: Realized vs Unrealized\">3.3</a></td></tr>\n    <tr><td><b>Partners’ Capital</b></td><td>The fund's net assets, tracked as one capital account per investor; the fund's equivalent of equity, with no retained earnings or EPS. Stanmere charges its offering costs directly against it (account 3050), so they never reach the statement of operations.</td><td><a href=\"#p0-why-fund-accounting-differs\" title=\"Why Fund Accounting Is Different\">0.2</a>, <a href=\"#p1-org-vs-offering-costs\" title=\"Startup Costs: Org vs Offering\">1.3</a></td></tr>\n    <tr><td><b>Pass-Through Entity</b></td><td>An entity, such as a partnership, that pays no income tax itself. Its income, gains, deductions and credits flow to its partners, who report them on their own returns.</td><td><a href=\"#p7-audit-season\" title=\"Year-End: Audit and K-1s\">7.1</a></td></tr>\n    <tr><td><b>PBC List</b></td><td>\"Prepared by client\": the auditor's list of schedules and documents the fund's accountants must supply, such as roll-forwards, reconciliations and support for the valuations.</td><td><a href=\"#p7-audit-season\" title=\"Year-End: Audit and K-1s\">7.1</a></td></tr>\n    <tr><td><b>PIK (Payment-in-Kind) Interest</b></td><td>Interest a borrower pays by growing the principal it owes instead of sending cash. The fund adds it to the investment's cost and records the same amount as interest income. No cash moves and no receivable is created.</td><td><a href=\"#p3-recording-investments\" title=\"Buying an Investment\">3.1</a></td></tr>\n    <tr><td><b>Preferred Return</b></td><td>Also called the pref or the hurdle. A minimum return the investors receive before any carried interest is paid. Stanmere's is 8% a year on capital not yet returned, accrued each quarter on that capital only; unpaid pref does not itself earn a return, so the yield is a little under 8%.</td><td><a href=\"#p1-how-to-read-an-lpa\" title=\"Reading the LPA\">1.2</a>, <a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">R</td></tr>\n    <tr><td><b>Recallable Distribution</b></td><td>A distribution the LPA lets the GP call back later and redeploy, as if the LP's commitment were never reduced.</td><td><a href=\"#p5-distributions-recallable\" title=\"Distributions\">5.1</a></td></tr>\n    <tr><td><b>Reconciling Item</b></td><td>A difference between two records that has a known cause, such as a payment the fund has booked but the bank has not yet cleared. An unexplained difference is an error to investigate, not a reconciling item.</td><td><a href=\"#p4-nav-close-cycle\" title=\"The Quarterly Close Cycle\">4.1</a></td></tr>\n    <tr><td><b>Recycling Cap</b></td><td>The LPA's limit on how much total capital can be called, distributed, and recalled over the fund's life.</td><td><a href=\"#p5-distributions-recallable\" title=\"Distributions\">5.1</a></td></tr>\n    <tr><td><b>Return of Capital</b></td><td>The part of a distribution that simply gives an LP back money it already put in, with no profit attached.</td><td><a href=\"#p5-distributions-recallable\" title=\"Distributions\">5.1</a></td></tr>\n    <tr><td><b>RVPI (Residual Value to Paid-In)</b></td><td>Net asset value still held by the fund divided by paid-in capital. It measures value not yet turned into cash.</td><td><a href=\"#p6-performance-metrics\" title=\"Performance &amp; Investor Reports\">6.2</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">S</td></tr>\n    <tr><td><b>Schedule K-1</b></td><td>The tax form a partnership sends each partner every year, showing that partner's share of the partnership's income, gains, deductions and credits.</td><td><a href=\"#p0-follow-one-dollar\" title=\"Follow One Dollar\">0.3</a>, <a href=\"#p7-audit-season\" title=\"Year-End: Audit and K-1s\">7.1</a></td></tr>\n    <tr><td><b>Schedule of Investments</b></td><td>A list of every holding at the reporting date, showing its cost and its fair value. Its fair value total must equal the investments line on the statement of assets and liabilities.</td><td><a href=\"#p6-four-statements\" title=\"The Fund's Financial Statements\">6.1</a></td></tr>\n    <tr><td><b>Side Letter</b></td><td>A private agreement between the general partner and one specific LP, layered on top of the main LPA without amending it for any other partner.</td><td><a href=\"#p1-how-to-read-an-lpa\" title=\"Reading the LPA\">1.2</a></td></tr>\n    <tr><td><b>Special Limited Partner</b></td><td>A partner with no commitment whose only economic right is carried interest. Stanmere's is Stanmere Carry I, LLC.</td><td><a href=\"#p4-pcap\" title=\"Partners' Capital Accounts\">4.3</a>, <a href=\"#p5-carry-accounting\" title=\"Booking Carried Interest\">5.3</a></td></tr>\n    <tr><td><b>Statement of Assets and Liabilities</b></td><td>An investment company's balance sheet. It lists what the fund owns and owes at one date, and ends at net assets, the partners' total capital.</td><td><a href=\"#p6-four-statements\" title=\"The Fund's Financial Statements\">6.1</a></td></tr>\n    <tr><td><b>Statement of Changes in Partners' Capital</b></td><td>The bridge from opening to closing net assets: plus contributions, less distributions, less any offering costs charged to capital, plus the result from operations.</td><td><a href=\"#p6-four-statements\" title=\"The Fund's Financial Statements\">6.1</a></td></tr>\n    <tr><td><b>Statement of Operations</b></td><td>An investment company's income statement. It runs from investment income, less expenses, to realized and unrealized gains, and ends at the net increase (or decrease) in net assets from operations.</td><td><a href=\"#p6-four-statements\" title=\"The Fund's Financial Statements\">6.1</a></td></tr>\n    <tr><td><b>Structure Chart</b></td><td>The diagram in the offering memorandum that maps the legal entities around a fund and how they connect. It tells you whose books a line belongs on.</td><td><a href=\"#p1-fund-structures\" title=\"Who's Who: Fund Structures\">1.1</a></td></tr>\n    <tr><td><b>Subscription Credit Line</b></td><td>A bank loan to the fund, secured by the partners' unfunded commitments, that lets the fund pay now and call capital later to repay the bank.</td><td><a href=\"#p2-capital-calls\" title=\"Capital Calls\">2.1</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">T</td></tr>\n    <tr><td><b>Trial Balance</b></td><td>A list of every ledger account with its debit or credit balance at one date. Total debits must equal total credits before anyone relies on the numbers.</td><td><a href=\"#p4-nav-close-cycle\" title=\"The Quarterly Close Cycle\">4.1</a></td></tr>\n    <tr><td><b>True-Up Contribution</b></td><td>The cash a newly admitted partner pays in at a later close to cover its share of capital already called. The fund pays the same amount back to the partners who funded those earlier calls, so every partner ends up having funded the same share.</td><td><a href=\"#p1-closes-equalization\" title=\"Later Closes &amp; Equalization\">1.4</a></td></tr>\n    <tr><td><b>TVPI (Total Value to Paid-In)</b></td><td>DPI plus RVPI: cash already returned plus value still held, per dollar paid in. Also called the multiple. Once a fund is fully wound up nothing remains, so TVPI equals distributions divided by paid-in.</td><td><a href=\"#p5-fund-liquidation\" title=\"Winding Up the Fund\">5.4</a>, <a href=\"#p6-performance-metrics\" title=\"Performance &amp; Investor Reports\">6.2</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">U</td></tr>\n    <tr><td><b>Unfunded Commitment</b></td><td>The part of a partner's commitment not yet called: commitment less contributions paid in to date.</td><td><a href=\"#p2-capital-calls\" title=\"Capital Calls\">2.1</a></td></tr>\n    <tr><td><b>Unrealized Appreciation/(Depreciation) (1110)</b></td><td>The balance-sheet account that holds the running difference between fair value and cost. Cost in 1100 plus this balance equals fair value.</td><td><a href=\"#p3-fair-value-marks\" title=\"Fair Value Marks\">3.2</a>, <a href=\"#p3-realized-vs-unrealized\" title=\"Selling: Realized vs Unrealized\">3.3</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">W</td></tr>\n    <tr><td><b>Waterfall</b></td><td>The contractual order that decides who gets exit cash first: LP capital back, then a preferred return, then a catch-up to the carry side, then a residual split.</td><td><a href=\"#p0-follow-one-dollar\" title=\"Follow One Dollar\">0.3</a></td></tr>\n    <tr><td><b>Wind-Up</b></td><td>The last stage of a fund's life: selling the remaining investments, settling the last bills, making the final distribution and filing the final reports.</td><td><a href=\"#p5-fund-liquidation\" title=\"Winding Up the Fund\">5.4</a></td></tr>\n    <tr><td><b>Write-Off</b></td><td>A disposal with no proceeds because the position is worthless. The cost comes off the books as a realized loss even though no cash comes in.</td><td><a href=\"#p3-realized-vs-unrealized\" title=\"Selling: Realized vs Unrealized\">3.3</a></td></tr>\n  </table>\n</section>",

le life of the fund</td><td>Fund Terms, B15</td></tr>\n    <tr><td><b>20%</b></td><td>Carried interest share of profits</td><td>20.0000%</td><td>Whole life of the fund</td><td>Fund Terms, B16</td></tr>\n    <tr><td><b>80%</b></td><td>Partners' share of profit after the catch-up (100% less carry)</td><td>80.0000%</td><td>Whole life of the fund</td><td>Fund Terms, B16 (100% less 20%)</td></tr>\n    <tr><td><b>8%</b></td><td>Equalization interest rate (simple)</td><td>8.0000%</td><td>Applied at the second and third closes</td><td>Fund Terms, B17</td></tr>\n  </table>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p1-org-vs-offering-costs\" title=\"Startup Costs: Org vs Offering\">1.3</a> · Startup Costs: Org vs Offering</h3>\n  <table>\n    <tr><th>Shown</th><th>What it is</th><th>Exact value</th><th>Period</th><th>Where in the workbook</th></tr>\n    <tr><td><b>$1.2M</b></td><td>Organizational costs, expensed</td><td>$1,200,000.00</td><td>Quarter ended 31 Mar 2019</td><td>Fund Terms, B18 (booked in Journal Entries, row 7)</td></tr>\n    <tr><td><b>$0.9M</b></td><td>Offering costs, charged against partners' capital</td><td>$900,000.00</td><td>At the first close (booked in the quarter ended 31 Mar 2019)</td><td>Fund Terms, B19 (booked in Journal Entries, row 9)</td></tr>\n    <tr><td><b>$2.1M</b></td><td>Cash paid for both bills together</td><td>$2,100,000.00</td><td>Quarter ended 31 Mar 2019</td><td>Fund Terms, B18 plus B19</td></tr>\n    <tr><td><b>$120M</b></td><td>Commitments of the three partners at first close</td><td>$120,000,000.00</td><td>At first close, 2 Jan 2019</td><td>Partners, C5 to C7</td></tr>\n    <tr><td><b>31 Mar 2019</b></td><td>Quarter-end date both costs were booked</td><td>2019-03-31</td><td>Quarter ended 31 Mar 2019</td><td>Journal Entries, row 7</td></tr>\n  </table>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p1-closes-equalization\" title=\"Later Closes &amp; Equalization\">1.4</a> · Later Closes &amp; Equalization</h3>\n  <p>The interest is settled between partners and sits outside the partners' capital accounts; only the true-up itself is contributed capital.</p>\n  <table>\n    <tr><th>Shown</th><th>What it is</th><th>Exact value</th><th>Period</th><th>Where in the workbook</th></tr>\n    <tr><td><b>$120M</b></td><td>Commitments of the three first-close partners</td><td>$120,000,000.00</td><td>At first close, 2 Jan 2019</td><td>Partners, C5 to C7</td></tr>\n    <tr><td><b>$60M</b></td><td>Commitments of the two second-close LPs</td><td>$60,000,000.00</td><td>At second close, 1 Oct 2019</td><td>Partners, C8 and C9</td></tr>\n    <tr><td><b>$180M</b></td><td>Total commitments after the second close</td><td>$180,000,000.00</td><td>After second close, 1 Oct 2019</td><td>Partners, C5 to C9</td></tr>\n    <tr><td><b>$46.5M</b></td><td>Capital called before the second close</td><td>$46,500,000.00</td><td>Calls dated 31 Mar, 30 Jun and 30 Sep 2019</td><td>Journal Entries, rows 5, 23 and 39</td></tr>\n    <tr><td><b>$15.5M</b></td><td>True-up contribution paid by the two new partners</td><td>$15,500,000.00</td><td>Interest counted to 31 Dec 2019; second close 1 Oct 2019 (booked quarter ended 31 Dec 2019)</td><td>Capital called (Journal Entries, rows 5, 23, 39) x new commitments / total commitments (Partners, C8:C9 / C5:C9)</td></tr>\n    <tr><td><b>$0.6M</b></td><td>Equalization interest paid at the second close</td><td>$641,000.91</td><td>Interest counted to 31 Dec 2019; second close 1 Oct 2019 (booked quarter ended 31 Dec 2019)</td><td>Journal Entries, row 53 less the true-up contribution</td></tr>\n    <tr><td><b>$16.1M</b></td><td>True-up plus interest paid in and straight back out</td><td>$16,141,000.91</td><td>Quarter ended 31 Dec 2019</td><td>Journal Entries, rows 53 to 56</td></tr>\n    <tr><td><b>8%</b></td><td>Equalization interest rate (simple, per year)</td><td>8.0000%</td><td>Applied at the second and third closes<   "<section class=\"lesson-section\" id=\"p10-resources-s11\">\n  <h2><span>11</span>Tie-Out Map: Parts 5 to 7</h2>\n  <p class=\"eyebrow\">Same layout. Multiples and IRRs are shown as the workbook computes them.</p>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p5-distributions-recallable\" title=\"Distributions\">5.1</a> · Distributions</h3>\n  <p>All seven distributions were booked the day they were paid, so distributions payable (2400) is never used.</p>\n  <table>\n    <tr><th>Shown</th><th>What it is</th><th>Exact value</th><th>Period</th><th>Where in the workbook</th></tr>\n    <tr><td><b>30 Sep 2024</b></td><td>Date of the first distribution</td><td>2024-09-30</td><td>Quarter ended 30 Sep 2024</td><td>Journal Entries, rows 422 and 423</td></tr>\n    <tr><td><b>$115.2M</b></td><td>First distribution, paid the day Thornwick sold</td><td>$115,200,000.00</td><td>30 Sep 2024 (Q3 2024)</td><td>Journal Entries, rows 422 and 423</td></tr>\n    <tr><td><b>seven</b></td><td>Number of distributions paid</td><td>7</td><td>30 Sep 2024 to 30 Jun 2030</td><td>Journal Entries, account 3100 (Partners' capital - distributions): 7 lines</td></tr>\n    <tr><td><b>$412.4M</b></td><td>Total of all seven distributions</td><td>$412,367,277.70</td><td>30 Sep 2024 to 30 Jun 2030</td><td>Trial Balance, cell O19; Performance, cell G6</td></tr>\n    <tr><td><b>$2.8M</b></td><td>Sale proceeds kept in the fund on 30 Sep 2024 ($118.0M received less $115.2M distributed)</td><td>$2,800,000.00</td><td>30 Sep 2024</td><td>Journal Entries, G417 less G422</td></tr>\n  </table>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a> · The Waterfall</h3>\n  <p>Profit here is cash-basis (distributions less paid-in capital); the statement of operations differs because offering costs are charged straight to capital.</p>\n  <table>\n    <tr><th>Shown</th><th>What it is</th><th>Exac let activeSectionId = (location.hash && DATA.some(s=>s.id===location.hash.slice(1))) ? location.hash.slice(1) : "p0-what-is-a-pe-fund";
let activeSubIndex = 0;
function statusMeta(s){if(s===2)return{label:"Live",cls:"b-done"};if(s===1)return{label:"Legacy readable",cls:"b-progress"};return{label:"Planned",cls:"b-draft"}}
function renderSidebar(){const el=document.getElementById("sidebar");let html='<div class="brand"><div class="brand-mark">PE<span>101</span> · Follow the Money</div><div class="brand-sub">Data Savvy CPA</div><div class="brand-meta"><span class="brand-pill">'+new Set(DATA.filter(s=>/^Part /.test(s.part)).map(s=>s.part)).size+' Parts</span><span class="brand-pill">'+(DATA.length-1)+' modules</span></div><a href="course-map.html" class="brand-pill" style="display:inline-block;margin-top:10px;text-decoration:none;background:rgba(201,162,75,.22);color:#E7CE97;border-color:rgba(201,162,75,.5)">&#8599; Course map &mdash; see the whole flow</a></div>';let last="";DATA.forEach(sec=>{if(sec.part!==last){html+='<div class="part-group"><div class="part-label">'+sec.part+'</div>';last=sec.part}const active=sec.id===activeSectionId?'active':'';html+='<div id="'+sec.id+'" class="nav-item '+active+'" onclick="selectSection(\''+sec.id+'\')"><span class="nav-num">'+sec.num+'</span><span class="nav-title">'+sec.title+'</span><span class="nav-count">'+sec.subs.length+'</span></div>'});html+='<div class="sidebar-footer">Original PE101 curriculum by Dan Bu<br>English one-page reader</div>';el.innerHTML=html}
function renderTopbar(sec){document.getElementById("breadcrumb").innerHTML='PE101 · Follow the Money <b>/</b> '+sec.part.split(" · ")[0]+(/^\d/.test(sec.num)?' <b>/</b> Module '+sec.num:'');document.getElementById("pageTitle").textContent=sec.title;document.getElementById("pageTitleEn").textContent=sec.part;const m=statusMeta(sec.status);const chipStyle=sec.status===2?'background:#E1F5EE;color:#0F6E56':sec.status===1?'background:#FDF0DA;color:#96650F':'background:#F1EFE7;color:#5F5B4C';const tagChips=(sec.tags||[]).map(t=>'<span class="status-chip" style="background:#F1EFE7;color:#5C6B54">'+t+'</span>').join('');document.getElementById("pageStatus").innerHTML='<span class="status-chip" style="'+chipStyle+'">'+m.label+'</span>'+tagChips;document.getElementById("subtabs").innerHTML=sec.subs.map((s,i)=>'<div class="subtab '+(i===activeSubIndex?'active':'')+'" onclick="selectSub('+i+')">'+s.title+'</div>').join('')}
function renderCenter(sec){const el=document.getElementById("centerCol");const module=MODULE_CONTENT[sec.id];if(module){el.innerHTML='<div class="section-lead">'+sec.lead+'</div>'+module.sections[activeSubIndex];return}let html='<div class="section-lead">'+sec.lead+'</div>';sec.subs.forEach((s,i)=>{const m=statusMeta(s.status);html+='<div class="topic-card '+(i===activeSubIndex?'selected':'')+'" onclick="selectSub('+i+')"><div class="topic-card-top"><div class="topic-name">'+String(i+1).padStart(2,"0")+' · '+s.title+'</div><span class="topic-badge '+m.cls+'">'+m.label+'</span></div><ul class="topic-points">'+s.points.map(p=>'<li>'+p+'</li>').join('')+'</ul></div>'});el.innerHTML=html}
function renderRight(sec){const el=document.getElementById("rightCol");const done=sec.subs.filter(s=>s.status===2).length;const prog=sec.subs.filter(s=>s.status===1).length;const total=sec.subs.length;const pct=Math.round(((done+prog*.4)/total)*100);const sub=sec.subs[activeSubIndex];const module=MODULE_CONTENT[sec.id];let html='<div class="rail-block"><div class="rail-label">Module progress</div><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><div class="progress-label"><span>'+pct+'% complete</span><span>'+done+'/'+total+' live</span></div><div class="kpi-row"><div class="kpi-box"><div class="kpi-num">'+done+'</div><div class="kpi-cap">Live</div></div><div class="kpi-box"><div class="kpi-num">'+prog+'</div><div class="kpi-cap">Legacy</div></div><div class="kpi-box"><div class="kpi-num">'+(total-done-prog)+'</div><div class="kpi-cap">Planned</div></div></div></div><div class="rail-block"><div class="rail-label">Selected topic</div><div class="rail-title">'+sub.title+'</div><div class="rail-text">'+sub.points[0]+'</div>'+sub.points.map((p,i)=>'<span class="rail-tag">Point '+(i+1)+'</span>').join('')+'</div>';if(module){html+='<div class="rail-block"><div class="rail-label">Tools</div>'+(module.calculator?'<a href="'+module.calculator.href+'" target="_blank" class="rail-link primary"><span>XLSX</span><span>'+module.calculator.label+'</span><span style="margin-left:auto">→</span></a>':'')+'</div>'+(module.glossary.length?'<div class="rail-block"><div class="rail-label">Core terms</div>'+module.glossary.map(g=>'<div class="glossary-item"><div class="g-term">'+g.term+'</div><div class="g-def">'+g.def+'</div></div>').join('')+'</div>':'')+'<div class="rail-block"><div class="rail-label">Related modules</div>'+module.related.map(r=>'<a href="'+r.href+'" class="rail-link"><span>'+r.label+'</span></a>').join('')+'</div>'}else{html+='<div class="rail-block"><div class="rail-label">Reader status</div><div class="rail-text">This module card is ready for a future English build inside the course reader.</div></div>'}el.innerHTML=html}
function renderAll(){const sec=DATA.find(s=>s.id===activeSectionId)||DATA[0];renderSidebar();renderTopbar(sec);renderCenter(sec);renderRight(sec)}
function selectSection(id){activeSectionId=id;activeSubIndex=0;if(location.hash!=="#"+id)history.replaceState(null,"","#"+id);renderAll();document.getElementById("centerCol").scrollTop=0}
function selectSub(i){activeSubIndex=i;const sec=DATA.find(s=>s.id===activeSectionId)||DATA[0];renderTopbar(sec);renderCenter(sec);renderRight(sec);document.getElementById("centerCol").scrollTop=0}
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(DATA.some(s=>s.id===id)){activeSectionId=id;activeSubIndex=0;renderAll()}});
renderAll();
</script>
