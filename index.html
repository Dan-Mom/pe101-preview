 a partner committing $40M, taking total commitments to $120M. The partner pays its true-up contribution plus 8% simple interest on it for 73 days (365-day year). How much is each?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>True-up contribution $10.0M; interest $160,000.</b> $30M × ($40M ÷ $120M) = $10M. Interest is $10M × 8% × 73 ÷ 365 = $160,000. Only the $10M counts as contributed capital.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open Investor Allocations, row 22 (equalization interest; positive means paid, negative means received). Add the four positive cells (E22 to H22) and the three negative cells (B22 to D22). What do you find, and what does it show?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>About $1.47M each way, so the total in J22 is $0.</b> Later-closing partners net pay and earlier ones net receive: a transfer between partners, neither a cost nor income of the fund, and outside the capital accounts.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p2-capital-calls\" title=\"Capital Calls\">2.1</a> · Capital Calls</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> An analyst looks on the fund's trial balance for the $40M of commitments that partners have not yet been asked to fund (illustrative) and cannot find it. Has something been left out?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>No. Unfunded commitment is not booked in the ledger.</b> It is a promise, tracked in the partners' capital account records and on call notices. It reaches the ledger as cash and capital only as each call is paid.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> Three partners commit $50M, $30M and $20M (illustrative). The fund calls $4.0M, and later $2.5M. What entry does it book for the first call (accounts with numbers), and what are the $30M partner's paid-in and unfunded commitment after both calls?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Dr 1000 Cash $4.0M; Cr 3000 Partners' capital - contributions $4.0M. The $30M partner has paid in $1.95M; $28.05M is unfunded.</b> Each call is shared by commitment: 30% × ($4.0M + $2.5M) = $1.95M. Unfunded is the commitment less paid-in.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open Investor Allocations. Divide contributions (row 9) by commitment (row 6) for the GP (column B) and for Kelbrook (column C). What do you notice, and what does it say about how the 28 calls were shared?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Both are about 85.3%: every partner has paid in the same share of its commitment.</b> Calls are shared by commitment, with true-ups for later closers, so all partners end at the same percentage. About 14.7% of each commitment was never called.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p2-management-fees\" title=\"Management Fees &amp; the Fee Offset\">2.2</a> · Management Fees &amp; the Fee Offset</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> In 2026 Q1 a colleague computes Stanmere's quarterly fee as $245M × 2% ÷ 4 = $1,225,000, \"the same as every full quarter\". What did they overlook, and what basis applies?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>The investment period ended on 30 Jun 2025, so the fee is now on invested cost.</b> From the next quarter the 2% applies to the cost of investments still held, not to commitments. The fee is lower, and it steps down as companies are sold.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> A quarter's management fee is $900,000, billed and paid in full (illustrative). The manager earns $180,000 of monitoring fees that quarter, and the LPA offsets 100%. Give the offset entry and the manager's refund entry (accounts with numbers), and the fund's net fee cost.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Offset: Dr 2100 $180,000; Cr 5010 $180,000. Refund: Dr 1000 $180,000; Cr 2100 $180,000. Net cost $720,000.</b> Account 5000 stays at the full $900,000; the offset sits in 5010. The fund records no monitoring fee income (4030 stays nil).</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> On the Management Fee tab, total the offsets in column F (F5 to F50). Compare with the gross fee total (E51) and the net total (G51). With a 100% offset, what does the total tell you?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Offsets total $1.4M, taking $34.9M of gross fees down to $33.5M net. The manager earned $1.4M of monitoring and transaction fees.</b> A 100% offset cuts the fee dollar for dollar, so the offsets equal those fees. The fund booked none of them as income.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p3-recording-investments\" title=\"Buying an Investment\">3.1</a> · Buying an Investment</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> A loan the fund made to a portfolio company pays $500,000 of interest \"in kind\" this quarter (illustrative): the amount is added to the loan's principal. A colleague books Dr 1000 Cash, Cr 4010 Interest income - other. What is wrong, and what is the right entry?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>No cash moved. Dr 1100 Investments, at cost $500,000; Cr 4000 Interest income - PIK $500,000.</b> PIK interest raises the cost of the position without any cash, and it is income of the fund. Account 4010 is for interest paid in cash.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> A fund pays $15M for a stake (illustrative) and later a $4M follow-on. At the next quarter-end it estimates the stake is worth $24M. What is the cost in 1100, and what balance does the separate unrealized account (1110) show?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Cost $19M; 1110 shows $5M.</b> Cost is only what was paid: $15M + $4M. The mark posts to 1110 for the gap to fair value ($24M − $19M) and never touches 1100.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Verrick's cost is on the Schedule of Investments (E8, FY2026). Stanmere's only interest income is PIK: Trial Balance K21 (account 4000, credits shown negative). How much of Verrick's cost is PIK interest, and what was its cost before that?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>$10.5M is PIK; before it, the cost was $25.0M.</b> PIK is interest added to principal, so Verrick's cost grew by $10.5M with no cash moving. Cash interest (4010) has no balance at all.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p3-fair-value-marks\" title=\"Fair Value Marks\">3.2</a> · Fair Value Marks</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> A fund pays $20M for a stake (illustrative). At the first quarter-end it estimates $23M and books $3M. At the second it estimates $24M, and a colleague books $4M, the whole gap to cost. What is wrong, and what should be booked?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Book only the change from the last mark: $1M (Dr 1110 / Cr 6100).</b> The $3M is already booked. Booking the whole $4M gap again would count it twice and show $7M of gain on a stake worth $4M above cost.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> A fund pays $24M for a stake (illustrative). It estimates $27M at the first quarter-end and $22M at the second. What does it book at the second quarter-end (direction and amount), and what balance does 1110 then show?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>A $5M unrealized loss: Dr 6100, Cr 1110. 1110 then shows negative $2M (depreciation).</b> Only the change from the last mark: $22M − $27M. Fair value is now $2M below the $24M cost, and cost in 1100 does not move.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> On the Trial Balance tab, read row 8 (1110) for FY2021 (F8) and FY2022 (G8). Did the balance rise or fall, by how much, and is fair value still above cost?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>It fell by $4.0M, from $39.0M to $35.0M. It is still positive, so fair value is above cost.</b> 1110 is the running gap between fair value and cost. The fall matches the net $4.0M drop in the marks in 2022 Q2, and cost in 1100 is untouched.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p3-realized-vs-unrealized\" title=\"Selling: Realized vs Unrealized\">3.3</a> · Selling: Realized vs Unrealized</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> A stake cost $40M and was last marked at $70M (illustrative). The fund sells it for $60M cash. A colleague says there is a $10M realized loss because the sale is below the last mark. Is that right?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>No. The realized gain is $20M.</b> A realized result is proceeds less cost ($60M − $40M), not less the last mark. The $30M of unrealized appreciation is reversed (Dr 6100 / Cr 1110), so net assets fall $10M on the day.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> A fund's position cost $45M (illustrative). It sells one-third of it for $21M cash. What is the realized gain, how much cost stays in 1100, and what is the sale entry (accounts with numbers)?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Gain $6M; $30M stays. Dr 1000 Cash $21M; Cr 1100 Investments, at cost $15M; Cr 6000 Net realized gain $6M.</b> Only the cost of the part sold comes off ($45M ÷ 3 = $15M). The rest stays in 1100 and keeps being marked.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> On the Trial Balance tab, row 34 (6000, credits shown negative), compare FY2024 (I34) and FY2025 (J34). By how much did realized gains grow in 2025? Does that equal the $16.8M gain on the Yarrowfield part-sale? If not, why?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>It grew by $4.8M, not $16.8M: the $12.0M Quillon Grid write-off, a realized loss, is netted in the same account.</b> $16.8M gain less $12.0M loss is $4.8M. Account 6000 holds all realized results, gains and losses together.</p></details></div>\n</section>",
  "<section class=\"lesson-section\" id=\"p10-resources-s4\">\n  <h2><span>4</span>Practice: Parts 4 to 7</h2>\n  <p class=\"eyebrow\">Same layout. The workbook questions name the tab and cell to open.</p>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p4-nav-close-cycle\" title=\"The Quarterly Close Cycle\">4.1</a> · The Quarterly Close Cycle</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> An illustrative fund's bank reconciliation shows two differences: a $4,000 payment booked on the last day that the bank has not yet cleared, and a $700 gap nobody can explain. Which one can stay open while you close the quarter, and which one stops the close?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>The uncleared $4,000 payment is a timing difference with a known cause, so it can stay open. The unexplained $700 stops the close until someone finds the cause.</b> A reconciling item has a known cause. An unexplained difference is an error, however small.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> An illustrative fund at quarter end has cash $2.0M, investments at fair value $95.0M, accounts payable and accrued expenses (2000) $0.5M and management fee payable (2100) $1.5M, and nothing else. What are its net assets (NAV)?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>$95.0M: total assets of $97.0M (2.0 + 95.0) less liabilities of $2.0M (0.5 + 1.5).</b> NAV is total assets less total liabilities. Stanmere has no liabilities, but here both payables must be subtracted.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open the Trial Balance tab and read the FY2026 column (K). Look at the Total row 36 and at account 2000 in row 13. What do the two cells tell you? Does a zero in the Total row prove every balance is right?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Both are 0: debits equal credits, and no bills are unpaid at 31 Dec 2026. A zero total shows only that the ledger balances; it does not prove each balance is right.</b> Cash and investments must still be agreed to the bank and the investment records before NAV is struck.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p4-accruals-expenses\" title=\"Fund Expenses &amp; Accruals\">4.2</a> · Fund Expenses &amp; Accruals</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> Three invoices reach an illustrative fund: (a) rent for the manager's own office, (b) the fund administrator's quarterly fee, (c) travel to a portfolio company's board meeting. Who bears each one, and which should you not book until you have checked something?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>(a) The manager, out of its management fee. (b) The fund, in 5300 Fund administration fees. (c) A gray area: check the LPA clause and ask before booking it to the fund.</b> If a cost is not on the LPA's list the fund does not pay it. Booking it to the wrong side moves money between investors and the manager.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> An illustrative fund accrues $12,000 for legal work at 31 March, from the law firm's quote. The invoice arrives in May for $12,500 and the fund pays it. Give the March entry and the May entry, naming each account with its number. What is booked as the difference?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>31 Mar: Dr 5210 Professional fees - legal $12,000 / Cr 2000 Accounts payable and accrued expenses $12,000. May: Dr 2000 $12,000 and Dr 5210 $500 / Cr 1000 Cash and cash equivalents $12,500. The $500 is booked in the May quarter.</b> The estimate is corrected when the real bill arrives, in the later quarter.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open the Journal Entries tab, rows 569 and 570, both dated 31 Dec 2026 and both in account 2000. Compare the credit in H569 with the debit in G570. What does each show about the quarter's expenses, and what is left in 2000?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Both are $133,500: the credit records the bills incurred, the debit records paying them the same day. Account 2000 is left at nil.</b> Stanmere books and pays each quarter's expenses together, so nothing is owed at quarter end. An accrual over a quarter end would leave a balance.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p4-pcap\" title=\"Partners' Capital Accounts\">4.3</a> · Partners' Capital Accounts</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> In an illustrative fund, a limited partner joins at the second close, in 2020. When allocating the fund's 2019 expenses, a colleague includes the newcomer, by commitment share. Is that right? Say why.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>No. Fund expenses are shared by commitment among the partners admitted at that time. The newcomer bears none of 2019's, so the earlier partners' shares are slightly larger.</b> The rule sets who is in the pool, which is why anything allocated before the final close was shared by fewer partners.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> An illustrative fund has three partners: A commits $60M, B $30M and the GP $10M. The GP's commitment is fee-free. For one quarter the management fee is $0.9M and fund expenses are $1.0M. Using the rules in this module, how much does each partner bear in total?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Fee $0.9M goes to A and B only, split 60:30: A $0.6M, B $0.3M. Expenses $1.0M by commitment: A $0.6M, B $0.3M, GP $0.1M. Totals: A $1.2M, B $0.6M, GP $0.1M.</b> The fee follows the fee-payers only; fund expenses follow commitment among everyone admitted.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open the Investor Allocations tab (life of the fund, to 30 Jun 2030). Row 13 is the management fee. What does the GP bear in cell B13? Then divide Kelbrook's fee (C13) by the total (J13) and compare it with Kelbrook's 30% commitment share.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>The GP bears $0. Kelbrook's share of the fee is 33.0%, above its 30% commitment share.</b> The GP pays no fee, and Kelbrook joined at Close 1, so it paid fees from the first quarter while later partners paid only from the quarter they joined. Both push its share of the total above its 30% commitment share.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p5-distributions-recallable\" title=\"Distributions\">5.1</a> · Distributions</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> An illustrative LPA lets the GP recycle distributions only during the investment period, which ended in year 5. In year 7 the fund sells a company and returns $30 of investors' original contributions. The GP asks you to log the $30 as recallable in the recycling tracker. Do you?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>No. The window has closed, so the $30 is gone for good. Book the ordinary distribution and leave it out of the tracker's recallable amount.</b> Recycling is a time-limited right. The tracker should show only capital the LPA still lets the GP recall.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> An illustrative fund pays a $48.0M distribution on 30 June, on the day it is made. The GP later recalls $10.0M of it under a recycling right. Give both entries, naming each account with its number. What is the net capital paid out after the recall?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Distribution: Dr 3100 Partners' capital - distributions $48.0M / Cr 1000 Cash and cash equivalents $48.0M. Recall: Dr 1000 $10.0M / Cr 3000 Partners' capital - contributions $10.0M. Net paid out: $38.0M.</b> A recall is booked like an ordinary capital call, coded as recycled so the tracker can tell it from new commitment usage.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open the Trial Balance tab. Row 19 is account 3100, distributions, shown cumulatively. Compare column I (FY2024) with column O (FY2030). What is the FY2030 balance, to $0.1M? Then count the account 3100 lines on the Journal Entries tab: how many distributions make it up?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>$412.4M in total, made up of seven distributions paid between 2024 and 2030. The FY2024 column shows only the first, $115.2M.</b> Each column is a running total, so the last column holds every distribution the fund ever paid; the Journal Entries tab lists them one by one.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a> · The Waterfall</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> An illustrative fund's LPA uses the European (whole-fund) waterfall. Investors have paid in $100: $50 into Deal A and $50 into Deal B, still held. Deal A sells for $80, a $30 gain. A colleague pays carry of 20% x $30 = $6 at once. What is wrong?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Under a whole-fund waterfall the $80 first goes to return of capital: only $80 of the $100 paid in is back, so all $80 goes to the investors. No pref or carry is due yet.</b> Whole-fund tiers count all capital, Deal B's included. Only a deal-by-deal (American) shape could pay carry on Deal A alone.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> An illustrative fund paid in $100 and now distributes $160. The preferred return owed to the investors is $12 (given in dollars). Push the $160 through the four tiers: how much does each tier pay, how does tier 4 split 80/20, and what is total carry?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Tier 1: $100 to investors. Tier 2: $12 to investors. Tier 3 catch-up: $3 to the carry side (20% of the $15 profit paid so far). Tier 4: $45 left, $36 to investors and $9 to the carry side. Total carry: $12.</b> Total carry $12 is exactly 20% of the $60 profit ($160 - $100), the quick test.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open the Waterfall tab, Total row 51. Divide the catch-up in cell K51 (tier 3) by the preferred return paid in cell H51 (tier 2). What ratio do you get, and why is it that number?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>0.25: the catch-up is a quarter of the preferred return ($18.9M against $75.5M).</b> For the carry side to hold 20% of profit paid so far, it needs one dollar for every four dollars of pref, since 20% is a quarter of 80%.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p5-carry-accounting\" title=\"Booking Carried Interest\">5.3</a> · Booking Carried Interest</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> At a quarter end an illustrative fund's holdings show a profit of $30 at today's marks, but the preferred return accrued to date is $35. A colleague accrues carry of 20% x $30 = $6. What is wrong, and what should the accrual be?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>If everything were sold at today's marks, the waterfall would pay all $30 to the investors as preferred return and nothing to the carry side. The accrual should be nil.</b> Carry can be nil even when the fund shows a profit: until profit passes the preferred return, the carry side gets nothing.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> Assume the fund's final waterfall has fully paid the preferred return and catch-up. The clawback test then takes the carry received, subtracts 20% of cumulative profit (total distributions less total contributions) and floors the answer at zero. An illustrative fund paid its carry recipient $28 early. Distributions end at $290 and contributions at $200. What is the clawback?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>$10. Profit is $90, so the recipient may keep 20% x $90 = $18 and returns $28 - $18 = $10.</b> Earlier payments ran ahead of the economics. This 20% shortcut only works once the pref and catch-up are fully paid; before that, rerun the waterfall instead. A clawback does not mean anyone did anything wrong.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open the Investor Allocations tab, row 17, Carried interest. The seven committed partners are in columns B to H and the carry vehicle, Stanmere Carry I, LLC, is in column I. What does column I show, and what does the total in J17 show?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Column I shows +$39.8M; the seven committed partners show negatives adding to the same amount. J17 is 0.</b> Carry is a reallocation between capital accounts, so the line adds to zero and net assets are unchanged.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p5-fund-liquidation\" title=\"Winding Up the Fund\">5.4</a> · Winding Up the Fund</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> An illustrative fund has $50 of cash after its last sale. The final audit and the last tax returns, about $2, will be billed after the wind-up date. A partner asks for all $50 to be distributed now. What should the accountant do, and why?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Hold back a reserve of about $2 for the final audit and tax returns, and distribute only the remaining $48.</b> Sending out every dollar would leave the fund unable to pay costs still to come, and partners might be asked to send cash back.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> An illustrative fund is winding up with $60.0M of cash. Its last costs, $1.5M, are already accrued in account 2000 but unpaid. Give the entry that pays them and then the final distribution entry, naming each account with its number. How much is distributed?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Pay: Dr 2000 Accounts payable and accrued expenses $1.5M / Cr 1000 Cash and cash equivalents $1.5M. Final distribution: Dr 3100 Partners' capital - distributions $58.5M / Cr 1000 Cash and cash equivalents $58.5M. Cash ends at nil.</b> Pay the costs first; the final distribution is whatever cash remains.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open the Performance tab. Cell G7 is ending net assets, G8 is DPI (distributions to paid-in) and G10 is TVPI (total value to paid-in). What do the three cells show, and why are DPI and TVPI now the same figure?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>G7 is 0. DPI and TVPI are both 1.93x. This is the fund-level multiple, which counts the carry paid to Stanmere Carry I as cash returned; the six limited partners' own multiple after carry is about 1.74x.</b> With nothing left in the fund, no unrealized value remains, so total value is just the cash already distributed.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p6-four-statements\" title=\"The Fund's Financial Statements\">6.1</a> · The Fund's Financial Statements</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> Preparing an illustrative fund's statements, you find the Schedule of Investments' fair value total is $48.0M but the statement of assets and liabilities shows investments of $47.5M. Which of the four ties has failed, and should the statements go to the auditor as they are?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>The first tie: the schedule's fair value total must equal investments on the statement of assets and liabilities. No. Find and fix the $0.5M difference first.</b> The ties are the preparer's checks before the auditor sees the statements. An unexplained gap means one record is wrong.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> An illustrative fund's statement of changes in partners' capital has opening partners' capital $200M, contributions $30M, distributions $50M, offering costs charged to capital $4M and net increase from operations $25M. What is closing partners' capital, and what must net assets be?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>$201M (200 + 30 - 50 - 4 + 25). Net assets on the statement of assets and liabilities must also be $201M.</b> Offering costs go straight to partners' capital, so they reduce the closing figure without passing through operations. Closing capital always equals net assets.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open the Cash Flow Statement tab and read the FY2026 column (column I). What is the net increase or decrease in cash in row 25, to $0.1M? Is that consistent with the $15.6M gain on the statement of operations?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Cash fell by $1.5M (cell I25). Yes: the $15.6M gain is mostly unrealized marks and non-cash PIK interest, so it brought in no cash; the $2.65M of expenses paid was only partly covered by the $1.2M called.</b> Closing cash in I27 ties to cash of $0.30M on the Balance Sheet.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p6-performance-metrics\" title=\"Performance &amp; Investor Reports\">6.2</a> · Performance &amp; Investor Reports</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> Two illustrative funds each report TVPI of 2.0x. Fund A took 3 years to get there and Fund B took 10. An LP says they performed equally. What is missing from that comparison, and which fund likely shows the higher IRR?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Time: a multiple ignores when the cash moved. With otherwise comparable cash-flow patterns, Fund A would usually show the higher IRR, but TVPI and age alone cannot prove it.</b> IRR rewards getting cash back sooner. Stanmere annualizes a quarterly rate; TVPI and age alone cannot fix the timing, so with otherwise similar cash flows Fund A would usually show the higher IRR.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> An illustrative investor has a $400 commitment and has been called for $250. It has received $100 back in cash, and its share of the fund's NAV is $300. Calculate DPI, RVPI and TVPI.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>DPI 0.4x (100 / 250), RVPI 1.2x (300 / 250), TVPI 1.6x.</b> The denominator is the $250 paid in, not the $400 committed. Only DPI is pure cash; RVPI rests on the fair value marks.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open the Performance tab, cell G12, the fund IRR for the whole life. Then open Financial Highlights, cell M20, the limited partners' net IRR. Read both. Which is lower, and what mainly explains the gap?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>The fund IRR is 11.6% and the LP net IRR is 10.1%, so the net IRR is lower. The gap is mainly carried interest.</b> The LP net IRR counts only the limited partners' own cash, after carry.</p></details></div>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\"><a href=\"#p7-audit-season\" title=\"Year-End: Audit and K-1s\">7.1</a> · Year-End: Audit and K-1s</h3>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Think.</b> In November you start as the fund accountant. Sort four requests into 'ask the administrator' and 'ask the auditor': the SOC 1 report; the PBC list; the valuation file showing who approved each mark; the management letter.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Administrator: the SOC 1 report and the valuation file. Auditor: the PBC list and the management letter.</b> The administrator keeps the books, so it holds its own controls report and the mark approvals. The auditor sends the request list and reports the control weaknesses it found.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Try the numbers.</b> An illustrative fund had a $16 realized gain and a $40 unrealized gain this year. A partner owns 25%. What total do the fund's book results show, what total is taxable on the K-1 basis, and what gain is on this partner's K-1?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Book results: $56. Taxable: $16, because the unrealized gain is taxed only when sold. This partner's K-1 shows 25% x $16 = $4.</b> The K-1 starts from the books but applies tax rules. The fund itself pays no income tax.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Open the workbook.</b> Open the Income Statement tab, FY2026 column (I): audit and tax fees are in row 16. Then open the Balance Sheet, column I, row 15, accounts payable and accrued expenses. What do the two cells show, and what does that say about how Stanmere books its audit fee?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>$192,000 of audit and tax fees was expensed in FY2026, yet accrued expenses at 31 Dec 2026 are nil. Stanmere pays each quarter's fee in that quarter, so nothing is owed at year end.</b> Many funds instead accrue the December audit and pay it the next year. A nil payable beside a full-year expense means the bills were paid, not skipped.</p></details></div>\n</section>",
  "<section class=\"lesson-section\" id=\"p10-resources-s5\">\n  <h2><span>5</span>Practice: Putting It Together</h2>\n  <p class=\"eyebrow\">Eight scenarios that use several modules at once. Work each on paper first.</p>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>1. Scenario.</b> An illustrative fund starts a quarter with nothing. It calls $5,000,000 from its partners; pays the quarter's management fee (2% a year on $40,000,000 of fee-paying commitments); buys a company for $4,000,000 cash; marks it up $600,000; and pays a $50,000 audit bill (5200). Every bill is paid the day it arises. Find ending cash, net assets, and the trial balance total of debits.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Cash $750,000. Net assets $5,350,000. Trial balance: $5,600,000 of debits, $5,600,000 of credits.</b> Fee: $40,000,000 x 2% / 4 = $200,000. Cash: 5,000,000 - 200,000 - 4,000,000 - 50,000 = 750,000. Net assets = cash + investments at fair value ($4,600,000). Debits: 1000 $750,000; 1100 $4,000,000; 1110 $600,000; 5000 $200,000; 5200 $50,000. Credits: 3000 $5,000,000; 6100 $600,000. Both total $5,600,000.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>2. Scenario.</b> An illustrative fund has $100,000,000 of commitments and has called $30,000,000. At a second close a new partner commits $25,000,000. It pays a true-up contribution plus equalization interest at 8% a year, simple, on the true-up for 73 days (365-day year). Find the true-up, the interest, the total wired, and how much counts as the new partner's contributed capital.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>True-up $6,000,000; interest $96,000; total wired $6,096,000; contributed capital $6,000,000.</b> The new partner is 25/125 of the enlarged fund, so it owes 25/125 of the $30,000,000 called. Interest is $6,000,000 x 8% x 73/365 = $96,000. The fund pays the whole $6,096,000 back to the earlier partners, so its cash and total capital do not change. Interest pays for time and is not contributed capital.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>3. Scenario.</b> In an illustrative fund, Partner P committed $30,000,000 and Partner Q $10,000,000. Opening capital: P $16,500,000, Q $11,500,000. Income of $2,000,000 is allocated by commitment share. Then a $4,000,000 distribution is split by each partner's capital balance just before it (this is the case's rule; some LPAs differ). Find each partner's ending capital, and check the total.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>P $15,600,000; Q $10,400,000; total $26,000,000.</b> Income: P 75% = $1,500,000, Q 25% = $500,000. Balances before the distribution: P $18,000,000, Q $12,000,000, so the split is 60/40: P $2,400,000, Q $1,600,000. Total: 28,000,000 + 2,000,000 - 4,000,000 = 26,000,000. By commitment share P would have received $3,000,000: the two rules differ.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>4. Scenario.</b> An illustrative fund runs a whole-fund waterfall: (1) return of capital; (2) preferred return; (3) 100% catch-up to the carry side until it holds 20% of the amounts paid in tiers 2 and 3; (4) 80/20. Partners paid in $10,000,000; the preferred return owed is $2,000,000 (given in dollars). The fund distributes $16,000,000. Split it across the four tiers, and give total carry.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Tier 1 $10,000,000 partners; tier 2 $2,000,000 partners; tier 3 $500,000 carry side; tier 4 $3,500,000 split $2,800,000 partners and $700,000 carry side. Total carry $1,200,000.</b> Catch-up c satisfies c = 20% x (2,000,000 + c), so c = $500,000. Fill each tier before the next. Carry = 500,000 + 700,000 = 1,200,000, exactly 20% of the $6,000,000 profit (16,000,000 - 10,000,000). Partners receive $14,800,000.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>5. Scenario.</b> An illustrative fund has had $80,000,000 paid in (its commitments were $100,000,000), has distributed $48,000,000 in cash, and reports net asset value of $72,000,000. Compute DPI, RVPI and TVPI. Which of the three is made only of cash, and which is the total that includes unrealized value?</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>DPI 0.60x; RVPI 0.90x; TVPI 1.50x. DPI is only cash; TVPI is the total that includes unrealized value.</b> All three divide by paid-in capital, not by commitments. DPI = 48 / 80; RVPI = 72 / 80, which rests on the fair value marks; TVPI = DPI + RVPI = 1.50x. Quote DPI beside TVPI: investors have received only 0.60x of their money back in cash.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>6. Scenario.</b> Whose books does each item belong on: the fund (F), the manager (M), the general partner (G) or a portfolio company (P)? (a) The fund's annual audit fee. (b) The deal team's salaries. (c) A monitoring fee a portfolio company pays the manager. (d) The law firm's bill for forming the fund. (e) Repairs to a portfolio company's factory. (f) The cash receipt for the GP's share of a capital call.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>(a) F. (b) M. (c) M. (d) F. (e) P. (f) F.</b> (a) A fund expense, account 5200. (b) Paid by the manager from its fee. (c) The manager's revenue; the fund books no income, only the fee offset (5010). (d) Stanmere's LPA puts it on the fund: an organizational cost, expensed (5100). (e) The fund never books a portfolio company's costs. (f) Dr 1000 / Cr 3000, in the GP's capital account; the GP entity's own ledger is separate.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>7. Scenario.</b> The appendix's Financial Highlights panel (limited partner class, FY2026) shows total return before carried interest of 9.5% and after carried interest of 7.6%. Kelbrook's capital account (Module 4.3) shows $45.8M of income, gains and other costs, net, in 2026, then $7.2M of carried interest reallocated out. First confirm 9.5% less the 1.9% carried-interest ratio gives 7.6% (to one decimal). Then explain why 7.6% is the more honest one-year figure for what an LP like Kelbrook actually kept.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>9.5% - 1.9% = 7.6%. The 7.6% figure is the honest one because it is stated net of the $7.2M reallocated to Stanmere Carry I, LLC, matching what Kelbrook's own capital account shows it keeping that year.</b> The financial highlights are ratios to average LP net assets, excluding the GP (fee-free) and Carry I (bears no expenses); the 'before carry' figure describes the class's gross experience, and the 'after' figure is the one a partner statement actually delivers.</p></details></div>\n  <div class=\"card\" style=\"margin:10px 0\"><p><b>8. Scenario.</b> An illustrative fund receives a $9,000 legal invoice on the last day of the quarter; it is not paid until early next quarter. Give the quarter-end entry (accounts with numbers) and its effect on net assets. Then give next quarter's payment entry, and explain why paying it books no second expense.</p><details><summary style=\"cursor:pointer;color:#0F6E56;font-weight:700\">Show the answer</summary><p><b>Quarter-end: Dr 5210 Professional fees - legal $9,000 / Cr 2000 Accounts payable and accrued expenses $9,000; net assets fall $9,000 that quarter. Next quarter: Dr 2000 $9,000 / Cr 1000 Cash and cash equivalents $9,000.</b> The expense is recognized when incurred, not when paid (Module 4.2). Paying an already-booked payable only moves cash and clears a liability; it does not touch the statement of operations a second time.</p></details></div>\n</section>",
  "<section class=\"lesson-section\" id=\"p10-resources-s6\">\n  <h2><span>6</span>Cheat Sheet: Entries and Formulas</h2>\n  <p class=\"eyebrow\">One page to keep beside you while you work through the modules</p>\n  <p>Account numbers and names are the ones on the workbook’s Chart of Accounts tab. Each row shows the module that explains it. Amounts are left out on purpose: the modules give the Stanmere figures.</p>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\">The journal entries</h3>\n  <table>\n    <tr><th>Event</th><th>Debit</th><th>Credit</th><th>Module</th></tr>\n    <tr><td><b>Capital call received</b></td><td>1000 Cash and cash equivalents</td><td>3000 Partners’ capital - contributions</td><td><a href=\"#p2-capital-calls\" title=\"Capital Calls\">2.1</a></td></tr>\n    <tr><td><b>Management fee incurred</b></td><td>5000 Management fee</td><td>2100 Management fee payable</td><td><a href=\"#p2-management-fees\" title=\"Management Fees &amp; the Fee Offset\">2.2</a></td></tr>\n    <tr><td><b>Management fee paid</b></td><td>2100 Management fee payable</td><td>1000 Cash and cash equivalents</td><td><a href=\"#p2-management-fees\" title=\"Management Fees &amp; the Fee Offset\">2.2</a></td></tr>\n    <tr><td><b>Fee offset (monitoring and transaction fees earned by the manager)</b></td><td>2100 Management fee payable</td><td>5010 Management fee offset. Stanmere’s manager then refunds the cash: Dr 1000 / Cr 2100.</td><td><a href=\"#p2-management-fees\" title=\"Management Fees &amp; the Fee Offset\">2.2</a></td></tr>\n    <tr><td><b>Organizational costs</b></td><td>5100 Organizational costs</td><td>1000 Cash and cash equivalents</td><td><a href=\"#p1-org-vs-offering-costs\" title=\"Startup Costs: Org vs Offering\">1.3</a></td></tr>\n    <tr><td><b>Offering costs</b></td><td>3050 Partners’ capital - offering costs charged against capital</td><td>1000 Cash and cash equivalents</td><td><a href=\"#p1-org-vs-offering-costs\" title=\"Startup Costs: Org vs Offering\">1.3</a></td></tr>\n    <tr><td><b>True-up and equalization interest from a later partner</b></td><td>1000 Cash and cash equivalents</td><td>3000 Partners’ capital - contributions. Stanmere’s ledger then passes the same amount back out to the earlier partners: Dr 3000 / Cr 1000.</td><td><a href=\"#p1-closes-equalization\" title=\"Later Closes &amp; Equalization\">1.4</a></td></tr>\n    <tr><td><b>Purchase or follow-on investment</b></td><td>1100 Investments, at cost</td><td>1000 Cash and cash equivalents</td><td><a href=\"#p3-recording-investments\" title=\"Buying an Investment\">3.1</a></td></tr>\n    <tr><td><b>PIK interest (no cash)</b></td><td>1100 Investments, at cost</td><td>4000 Interest income - PIK</td><td><a href=\"#p3-recording-investments\" title=\"Buying an Investment\">3.1</a></td></tr>\n    <tr><td><b>Mark up</b></td><td>1110 Unrealized appreciation/(depreciation) on investments</td><td>6100 Net change in unrealized appreciation/(depreciation)</td><td><a href=\"#p3-fair-value-marks\" title=\"Fair Value Marks\">3.2</a></td></tr>\n    <tr><td><b>Mark down</b></td><td>6100 Net change in unrealized appreciation/(depreciation)</td><td>1110 Unrealized appreciation/(depreciation) on investments</td><td><a href=\"#p3-fair-value-marks\" title=\"Fair Value Marks\">3.2</a></td></tr>\n    <tr><td><b>Sale of an investment</b></td><td>1000 Cash and cash equivalents (the proceeds)</td><td>1100 Investments, at cost (the cost sold) and 6000 Net realized gain/(loss) on investments (the gain; a loss is a debit to 6000). Also reverse the unrealized balance on the part sold: Dr 6100 / Cr 1110 for appreciation, or the opposite entry for depreciation.</td><td><a href=\"#p3-realized-vs-unrealized\" title=\"Selling: Realized vs Unrealized\">3.3</a></td></tr>\n    <tr><td><b>Write-off (no cash)</b></td><td>6000 Net realized gain/(loss) on investments</td><td>1100 Investments, at cost. Also reverse any unrealized depreciation already booked: Dr 1110 / Cr 6100.</td><td><a href=\"#p3-realized-vs-unrealized\" title=\"Selling: Realized vs Unrealized\">3.3</a></td></tr>\n    <tr><td><b>Fund expense incurred</b></td><td>5200 to 5600 (the expense account)</td><td>2000 Accounts payable and accrued expenses</td><td><a href=\"#p4-accruals-expenses\" title=\"Fund Expenses &amp; Accruals\">4.2</a></td></tr>\n    <tr><td><b>Fund expense paid</b></td><td>2000 Accounts payable and accrued expenses</td><td>1000 Cash and cash equivalents</td><td><a href=\"#p4-accruals-expenses\" title=\"Fund Expenses &amp; Accruals\">4.2</a></td></tr>\n    <tr><td><b>Distribution to partners</b></td><td>3100 Partners’ capital - distributions</td><td>1000 Cash and cash equivalents</td><td><a href=\"#p5-distributions-recallable\" title=\"Distributions\">5.1</a>, <a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a></td></tr>\n    <tr><td><b>Carried interest</b></td><td>No ledger entry. The carry moves between partners’ capital accounts (accrued as if the fund were liquidated at fair value) and is paid out as a distribution.</td><td></td><td><a href=\"#p5-carry-accounting\" title=\"Booking Carried Interest\">5.3</a></td></tr>\n  </table>\n  <h3 style=\"font-family:Georgia,serif;font-size:18px;margin:22px 0 4px\">The formulas</h3>\n  <table>\n    <tr><th>What</th><th>How it is worked out</th><th>Module</th></tr>\n    <tr><td><b>A partner’s share of a capital call</b></td><td>Call × the partner’s commitment ÷ total commitments</td><td><a href=\"#p2-capital-calls\" title=\"Capital Calls\">2.1</a></td></tr>\n    <tr><td><b>Unfunded commitment</b></td><td>Commitment − contributions to date</td><td><a href=\"#p2-capital-calls\" title=\"Capital Calls\">2.1</a></td></tr>\n    <tr><td><b>Management fee for a quarter</b></td><td>Fee-paying commitments (or, after the investment period, invested cost) × 2% ÷ 4, less any offset</td><td><a href=\"#p2-management-fees\" title=\"Management Fees &amp; the Fee Offset\">2.2</a></td></tr>\n    <tr><td><b>True-up contribution</b></td><td>Capital called to date × new commitments ÷ total commitments after the close</td><td><a href=\"#p1-closes-equalization\" title=\"Later Closes &amp; Equalization\">1.4</a></td></tr>\n    <tr><td><b>Equalization interest (Stanmere)</b></td><td>True-up × 8% × days ÷ 365, simple interest</td><td><a href=\"#p1-closes-equalization\" title=\"Later Closes &amp; Equalization\">1.4</a></td></tr>\n    <tr><td><b>Fair value of an investment</b></td><td>Cost (1100) + unrealized appreciation/(depreciation) (1110)</td><td><a href=\"#p3-fair-value-marks\" title=\"Fair Value Marks\">3.2</a></td></tr>\n    <tr><td><b>Realized gain or loss</b></td><td>Sale proceeds − cost of what was sold</td><td><a href=\"#p3-realized-vs-unrealized\" title=\"Selling: Realized vs Unrealized\">3.3</a></td></tr>\n    <tr><td><b>A partner’s capital account</b></td><td>Opening balance + contributions − fees and expenses ± its share of income and gains ± the carry reallocation − distributions = closing balance</td><td><a href=\"#p4-pcap\" title=\"Partners' Capital Accounts\">4.3</a></td></tr>\n    <tr><td><b>Net assets (NAV)</b></td><td>Total assets − total liabilities = the sum of the partners’ capital accounts</td><td><a href=\"#p4-pcap\" title=\"Partners' Capital Accounts\">4.3</a>, <a href=\"#p6-four-statements\" title=\"The Fund's Financial Statements\">6.1</a></td></tr>\n    <tr><td><b>Waterfall tiers, in order</b></td><td>1 return of capital, 2 preferred return, 3 catch-up to the carry side, 4 the 80/20 split</td><td><a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a></td></tr>\n    <tr><td><b>Catch-up (100% catch-up)</b></td><td>Preferred return × carry % ÷ (1 − carry %). At 20% carry that is one quarter of the preferred return.</td><td><a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a></td></tr>\n    <tr><td><b>Carried interest, once fully caught up</b></td><td>Carry % × total profit</td><td><a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a></td></tr>\n    <tr><td><b>Clawback</b></td><td>Once the pref and catch-up are fully paid: carry received − carry % × cumulative profit, if the result is positive</td><td><a href=\"#p5-carry-accounting\" title=\"Booking Carried Interest\">5.3</a></td></tr>\n    <tr><td><b>DPI, RVPI, TVPI</b></td><td>DPI = distributions ÷ paid-in capital. RVPI = net assets ÷ paid-in capital. TVPI = DPI + RVPI.</td><td><a href=\"#p6-performance-metrics\" title=\"Performance &amp; Investor Reports\">6.2</a></td></tr>\n    <tr><td><b>IRR</b></td><td>A rate that makes the dated cash flows net to zero. Stanmere annualizes a quarterly rate; real reports often use XIRR on actual dates, which can differ slightly</td><td><a href=\"#p6-performance-metrics\" title=\"Performance &amp; Investor Reports\">6.2</a></td></tr>\n  </table>\n</section>",
  "<section class=\"lesson-section\" id=\"p10-resources-s7\">\n  <h2><span>7</span>Stanmere’s Choices vs Real Practice</h2>\n  <p class=\"eyebrow\">Where the case makes a choice and the real world may differ</p>\n  <p>Stanmere is one fund with one set of documents. Everything it does is allowed and internally consistent, but much of it is a choice, not a rule. This table lists the main choices, so that a real fund’s LPA and accounting policies do not surprise you. Always read the fund’s own documents first.</p>\n  <table>\n    <tr><th>Topic</th><th>What Stanmere does</th><th>What you may also see</th><th>Module</th></tr>\n    <tr><td><b>Preferred return</b></td><td>8% a year on capital not yet returned, accrued each quarter on that capital only. Unpaid preferred return does not itself earn a return.</td><td>Many LPAs compound the preferred return, and some have a different hurdle or no catch-up. Read the clause.</td><td><a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a></td></tr>\n    <tr><td><b>Waterfall type</b></td><td>European (whole-fund): carry starts only after all capital and the preferred return are back.</td><td>American (deal-by-deal) waterfalls can pay carry on each profitable exit, before the whole fund has returned capital.</td><td><a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a></td></tr>\n    <tr><td><b>Waterfall calculation</b></td><td>Run once for all partners together.</td><td>Administrators usually run it partner by partner, because partners differ in size and in when they joined.</td><td><a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a></td></tr>\n    <tr><td><b>Carry in the books</b></td><td>A reallocation between partners’ capital accounts, accrued as if the fund were liquidated at fair value. No carry expense or payable.</td><td>Presentation depends on the legal rights, the arrangement and the accounting framework, not a free choice: some funds show accrued carry as an incentive allocation or a liability, or by class of partner.</td><td><a href=\"#p5-carry-accounting\" title=\"Booking Carried Interest\">5.3</a></td></tr>\n    <tr><td><b>Splitting a distribution</b></td><td>By each partner’s capital balance just before the distribution.</td><td>Many LPAs use each partner’s share of the investment instead.</td><td><a href=\"#p4-pcap\" title=\"Partners' Capital Accounts\">4.3</a></td></tr>\n    <tr><td><b>Offering costs</b></td><td>Charged against partners’ capital at the first close and borne by the partners then in the fund. Not amortized.</td><td>Some funds with staggered closes defer offering costs and amortize them over up to 12 months, and many LPAs re-spread them to later closers.</td><td><a href=\"#p1-org-vs-offering-costs\" title=\"Startup Costs: Org vs Offering\">1.3</a></td></tr>\n    <tr><td><b>Equalization interest</b></td><td>8% simple, counted to the quarter-end in which the close is booked. Passed temporarily through ledger account 3000 and back out; the interest itself is excluded from individual partners’ capital and shown only as a memo amount.</td><td>It is usually settled between the partners, or through a due-to/from-partners account, and its timing follows the LPA.</td><td><a href=\"#p1-closes-equalization\" title=\"Later Closes &amp; Equalization\">1.4</a></td></tr>\n    <tr><td><b>Management fee timing</b></td><td>Billed quarterly in advance, booked at quarter-end on the cost held at that date, with no prepaid asset.</td><td>A fee paid in advance can leave a prepaid asset at quarter-end (the next quarter’s fee), and it uses the opening basis.</td><td><a href=\"#p2-management-fees\" title=\"Management Fees &amp; the Fee Offset\">2.2</a></td></tr>\n    <tr><td><b>Fee offset</b></td><td>The manager refunds the cash to the fund.</td><td>Many LPAs credit the offset against the next fee bill.</td><td><a href=\"#p2-management-fees\" title=\"Management Fees &amp; the Fee Offset\">2.2</a></td></tr>\n    <tr><td><b>Balance sheet</b></td><td>No liabilities, receivables or prepaid items: everything is paid the day it is booked.</td><td>Real balance sheets carry payables and accrued expenses, a prepaid fee, due to/from partners, distributions payable and sometimes a subscription line.</td><td><a href=\"#p4-accruals-expenses\" title=\"Fund Expenses &amp; Accruals\">4.2</a>, <a href=\"#p6-four-statements\" title=\"The Fund's Financial Statements\">6.1</a></td></tr>\n    <tr><td><b>Distributions</b></td><td>Booked the same day they are paid, with no payable.</td><td>A distribution can be declared first and paid a few days later.</td><td><a href=\"#p5-distributions-recallable\" title=\"Distributions\">5.1</a></td></tr>\n    <tr><td><b>Accounting framework</b></td><td>US GAAP for investment companies (ASC 946), US-style fund with K-1s. Most private equity funds meet the investment-company test, which is assessed when the fund is formed.</td><td>IFRS and other jurisdictions differ in statement names, in how carry is presented and in tax.</td><td><a href=\"#p0-why-fund-accounting-differs\" title=\"Why Fund Accounting Is Different\">0.2</a>, <a href=\"#p7-audit-season\" title=\"Year-End: Audit and K-1s\">7.1</a></td></tr>\n    <tr><td><b>Cash flow statement</b></td><td>Presented.</td><td>Some funds are exempt from presenting one.</td><td><a href=\"#p6-four-statements\" title=\"The Fund's Financial Statements\">6.1</a></td></tr>\n  </table>\n</section>",
  "<section class=\"lesson-section\" id=\"p10-resources-s8\">\n  <h2><span>8</span>Glossary</h2>\n  <p class=\"eyebrow\">90 terms from the 22 modules, A to Z. The right-hand column links to the modules that use each term.</p>\n  <table>\n    <tr><th>Term</th><th>Meaning</th><th>Module</th></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">A</td></tr>\n    <tr><td><b>Accounts Payable and Accrued Expenses (2000)</b></td><td>The liability account that holds fund expenses incurred but not yet paid. It is cleared when the fund pays the bill.</td><td><a href=\"#p4-accruals-expenses\" title=\"Fund Expenses &amp; Accruals\">4.2</a></td></tr>\n    <tr><td><b>Accrual</b></td><td>An entry that records an expense in the period the service was received, even if the bill has not arrived or has not been paid yet.</td><td><a href=\"#p4-accruals-expenses\" title=\"Fund Expenses &amp; Accruals\">4.2</a></td></tr>\n    <tr><td><b>Allocation</b></td><td>Splitting a fund-level amount (income, an expense, a gain, a distribution) among the partners' capital accounts under the rules in the LPA.</td><td><a href=\"#p4-pcap\" title=\"Partners' Capital Accounts\">4.3</a></td></tr>\n    <tr><td><b>American (Deal-by-Deal) Waterfall</b></td><td>The tiers are tested one realized deal at a time, so carry can be paid on a profitable exit while other deals are still held.</td><td><a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a></td></tr>\n    <tr><td><b>Assumed-Liquidation Basis</b></td><td>Measuring carry as if the fund sold everything at today's fair values and ran the waterfall today. Because marks move, the accrued carry can rise or fall.</td><td><a href=\"#p5-carry-accounting\" title=\"Booking Carried Interest\">5.3</a></td></tr>\n    <tr><td><b>Audit Opinion</b></td><td>The independent auditor's written conclusion on whether the fund's annual financial statements are fairly presented under the accounting framework the fund uses.</td><td><a href=\"#p7-audit-season\" title=\"Year-End: Audit and K-1s\">7.1</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">B</td></tr>\n    <tr><td><b>Bank Reconciliation</b></td><td>A comparison of the cash balance on the bank statement with the cash balance in the books, explaining every difference until the two agree.</td><td><a href=\"#p4-nav-close-cycle\" title=\"The Quarterly Close Cycle\">4.1</a></td></tr>\n    <tr><td><b>Bridge Note</b></td><td>A short-term note a fund advances to a portfolio company ahead of a priced equity round. It is tracked in its own account (1150) until it converts; conversion moves the same cost into 1100, with no gain or loss.</td><td><a href=\"#p3-recording-investments\" title=\"Buying an Investment\">3.1</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">C</td></tr>\n    <tr><td><b>Capital Account</b></td><td>A running balance kept for each partner: what it has put in, plus its share of the fund's results, less what it has taken out. All partners' accounts added together equal the fund's net assets.</td><td><a href=\"#p4-pcap\" title=\"Partners' Capital Accounts\">4.3</a></td></tr>\n    <tr><td><b>Capital Account Statement</b></td><td>A quarterly statement for each investor showing opening capital, contributions, distributions, allocated income, expenses and gains, and closing capital.</td><td><a href=\"#p6-performance-metrics\" title=\"Performance &amp; Investor Reports\">6.2</a></td></tr>\n    <tr><td><b>Capital Call (Drawdown)</b></td><td>A notice from the GP asking every partner for its share of a stated amount by a due date. Also called a drawdown.</td><td><a href=\"#p0-follow-one-dollar\" title=\"Follow One Dollar\">0.3</a>, <a href=\"#p2-capital-calls\" title=\"Capital Calls\">2.1</a></td></tr>\n    <tr><td><b>Carried Interest</b></td><td>The 20% share of the fund's profit that goes to the carry recipient once the partners have their capital and preferred return back. At Stanmere the recipient is Stanmere Carry I, LLC, the special limited partner.</td><td><a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a>, <a href=\"#p5-carry-accounting\" title=\"Booking Carried Interest\">5.3</a></td></tr>\n    <tr><td><b>Carried Interest Reallocation</b></td><td>Moving the carry out of the other partners' capital accounts and into the special limited partner's account. The fund total is zero, so net assets do not change.</td><td><a href=\"#p4-pcap\" title=\"Partners' Capital Accounts\">4.3</a></td></tr>\n    <tr><td><b>Carry Reversal</b></td><td>A fall in accrued carry when values drop. The amount moves back from the carry recipient's capital account to the other partners' accounts.</td><td><a href=\"#p5-carry-accounting\" title=\"Booking Carried Interest\">5.3</a></td></tr>\n    <tr><td><b>Carry Vehicle</b></td><td>The vehicle that receives carried interest, the share of fund profits set by the LPA, and passes it to the individuals who earned it. Stanmere's is Stanmere Carry I, LLC, the special limited partner, also called the carry side.</td><td><a href=\"#p1-fund-structures\" title=\"Who's Who: Fund Structures\">1.1</a></td></tr>\n    <tr><td><b>Catch-Up</b></td><td>The tier after the pref that sends 100% of the next dollars to the carry side until it holds its agreed share (20%) of all profit so far. It is carried interest, paid at 100% so the carry side catches up quickly.</td><td><a href=\"#p1-how-to-read-an-lpa\" title=\"Reading the LPA\">1.2</a>, <a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a></td></tr>\n    <tr><td><b>Clawback (Clawback Test)</b></td><td>At liquidation, once the waterfall has fully paid the preferred return and catch-up, the return of any carry received above 20% of the whole fund's cumulative profit. Floored at zero. Stanmere's is $0.</td><td><a href=\"#p5-carry-accounting\" title=\"Booking Carried Interest\">5.3</a>, <a href=\"#p5-fund-liquidation\" title=\"Winding Up the Fund\">5.4</a></td></tr>\n    <tr><td><b>Close Cycle</b></td><td>The fixed sequence of work a fund accountant repeats at every quarter end: post the quarter's activity, mark the portfolio, reconcile, run the trial balance, compute NAV, allocate to partners, and report.</td><td><a href=\"#p4-nav-close-cycle\" title=\"The Quarterly Close Cycle\">4.1</a></td></tr>\n    <tr><td><b>Commitment (Capital Commitment)</b></td><td>The total amount a partner promises to contribute over the fund's life. It is a promise, not cash, so it is not booked as capital when the partner is admitted.</td><td><a href=\"#p0-follow-one-dollar\" title=\"Follow One Dollar\">0.3</a>, <a href=\"#p2-capital-calls\" title=\"Capital Calls\">2.1</a></td></tr>\n    <tr><td><b>Commitment Share</b></td><td>A partner's commitment divided by total commitments. Stanmere uses it for most income, expenses and gains. Kelbrook's is 30%.</td><td><a href=\"#p4-pcap\" title=\"Partners' Capital Accounts\">4.3</a></td></tr>\n    <tr><td><b>Confirmation</b></td><td>Evidence the auditor gets directly from a third party, such as a bank, a custodian, a portfolio company or a partner, to test a balance or a transaction.</td><td><a href=\"#p7-audit-season\" title=\"Year-End: Audit and K-1s\">7.1</a></td></tr>\n    <tr><td><b>Consolidation</b></td><td>Combining a controlled company's assets, liabilities, revenue, and expenses into the parent's statements. It is what an operating parent does, but an investment company generally does not do it to its portfolio companies.</td><td><a href=\"#p0-why-fund-accounting-differs\" title=\"Why Fund Accounting Is Different\">0.2</a></td></tr>\n    <tr><td><b>Continuous Offering</b></td><td>A fund that keeps offering its interests on an ongoing basis rather than only at a set of closes inside a window that then shuts. Such a fund defers its offering costs and amortizes them over twelve months. Stanmere is not one.</td><td><a href=\"#p1-org-vs-offering-costs\" title=\"Startup Costs: Org vs Offering\">1.3</a></td></tr>\n    <tr><td><b>Cost Basis</b></td><td>What a fund records for an investment on the day it buys it, usually the cash actually paid. The fund still remeasures the position to fair value every reporting period, but while the fund holds the position, the cost basis itself only moves when new cash goes in (a follow-on) or PIK interest is added to it; a sale takes cost out (Module 3.3).</td><td><a href=\"#p0-follow-one-dollar\" title=\"Follow One Dollar\">0.3</a>, <a href=\"#p3-recording-investments\" title=\"Buying an Investment\">3.1</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">D</td></tr>\n    <tr><td><b>Distribution</b></td><td>Cash or assets a fund pays out to LPs (and sometimes the GP) from realized proceeds, income, or unused capital.</td><td><a href=\"#p5-distributions-recallable\" title=\"Distributions\">5.1</a></td></tr>\n    <tr><td><b>Distribution Waterfall</b></td><td>The order, set in the LPA, in which every distributed dollar is shared: capital back first, then the preferred return, then the catch-up, then the profit split.</td><td><a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a></td></tr>\n    <tr><td><b>DPI (Distributions to Paid-In)</b></td><td>Cash distributed to investors divided by the capital they have paid in. It measures what has actually come back in cash.</td><td><a href=\"#p6-performance-metrics\" title=\"Performance &amp; Investor Reports\">6.2</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">E</td></tr>\n    <tr><td><b>Equalization</b></td><td>The mechanism that treats a partner admitted at a later close as if it had funded its share of capital already called from earlier partners. At Stanmere it levels up capital contributions only; it does not re-spread costs the fund paid before the partner joined.</td><td><a href=\"#p1-closes-equalization\" title=\"Later Closes &amp; Equalization\">1.4</a></td></tr>\n    <tr><td><b>Equalization Interest</b></td><td>Interest a later-closing partner pays the earlier partners for the time its true-up dollars sat outside the fund. Stanmere's rate is 8% a year, simple. It is settled between partners and is not part of contributed capital.</td><td><a href=\"#p1-closes-equalization\" title=\"Later Closes &amp; Equalization\">1.4</a></td></tr>\n    <tr><td><b>European (Whole-Fund) Waterfall</b></td><td>The tiers are tested on the whole fund's cumulative cash, so all capital and all the pref come back before any carry is paid. Stanmere uses this.</td><td><a href=\"#p5-waterfalls-1\" title=\"The Waterfall\">5.2</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">F</td></tr>\n    <tr><td><b>Fair Value</b></td><td>The price the fund would receive to sell an investment in an orderly transaction on the measurement date. It is an exit price, re-estimated every reporting period.</td><td><a href=\"#p0-why-fund-accounting-differs\" title=\"Why Fund Accounting Is Different\">0.2</a>, <a href=\"#p3-fair-value-marks\" title=\"Fair Value Marks\">3.2</a></td></tr>\n    <tr><td><b>Fair Value Mark</b></td><td>The quarterly re-estimate of what a position is worth, posted between the unrealized appreciation/(depreciation) account (1110) and the net change in unrealized appreciation/(depreciation) line (6100). No cash moves and nothing is sold.</td><td><a href=\"#p3-fair-value-marks\" title=\"Fair Value Marks\">3.2</a></td></tr>\n    <tr><td><b>Fee Basis</b></td><td>The amount the fee rate is applied to: commitments during the investment period, then invested cost of the investments still held.</td><td><a href=\"#p2-management-fees\" title=\"Management Fees &amp; the Fee Offset\">2.2</a></td></tr>\n    <tr><td><b>Feeder Fund</b></td><td>A vehicle that gathers one group of investors and invests through the main fund. Larger funds use feeders to give different investor groups a suitable entry point.</td><td><a href=\"#p1-fund-structures\" title=\"Who's Who: Fund Structures\">1.1</a></td></tr>\n    <tr><td><b>Fee Offset</b></td><td>An LPA term that reduces the management fee by fees the manager earns from portfolio companies. Stanmere's offset is 100% of monitoring and transaction fees.</td><td><a href=\"#p2-management-fees\" title=\"Management Fees &amp; the Fee Offset\">2.2</a></td></tr>\n    <tr><td><b>Final Close</b></td><td>The last date on which new investors may be admitted to the fund. For Stanmere it is 30 Jun 2020; after it, no further equalization of this kind occurs.</td><td><a href=\"#p1-closes-equalization\" title=\"Later Closes &amp; Equalization\">1.4</a></td></tr>\n    <tr><td><b>Final Distribution</b></td><td>The last payment to partners, of whatever cash is left once every expense is paid. It brings every capital account to zero.</td><td><a href=\"#p5-fund-liquidation\" title=\"Winding Up the Fund\">5.4</a></td></tr>\n    <tr><td><b>Financial Highlights</b></td><td>A short set of measures an investment company must present: expenses and net investment income as a percentage of average net assets, and a return. Closed-end PE funds usually present an IRR since inception as that return.</td><td><a href=\"#p6-four-statements\" title=\"The Fund's Financial Statements\">6.1</a></td></tr>\n    <tr><td><b>Follow-On Investment</b></td><td>A later funding into a company the fund already holds. It uses the same account and the same entry as the first check (Dr Investments, at cost / Cr Cash); it just adds to a cost basis that already exists.</td><td><a href=\"#p3-recording-investments\" title=\"Buying an Investment\">3.1</a></td></tr>\n    <tr><td><b>Full Exit</b></td><td>A sale of the fund's entire remaining stake in one transaction. All of the cost comes off the books at once.</td><td><a href=\"#p3-realized-vs-unrealized\" title=\"Selling: Realized vs Unrealized\">3.3</a></td></tr>\n    <tr><td><b>Fund Administrator</b></td><td>A third party that keeps the fund's books, strikes net asset value (NAV), and produces investor statements independently of the GP's deal team.</td><td><a href=\"#p0-what-is-a-pe-fund\" title=\"What a PE Fund Is\">0.1</a></td></tr>\n    <tr><td><b>Fund Expenses</b></td><td>The running costs the partnership agreement says the fund itself pays, such as audit and tax, legal, fund administration and custody. They reduce the fund's results and so every partner's capital.</td><td><a href=\"#p4-accruals-expenses\" title=\"Fund Expenses &amp; Accruals\">4.2</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">G</td></tr>\n    <tr><td><b>General Partner (GP)</b></td><td>The entity that controls the fund and signs for it. It calls capital, makes the buy and sell decisions and runs the fund day to day. It also commits some of its own capital, so it is a partner with a capital account on the fund’s books. Its affiliated manager earns the management fee, and carried interest goes to Stanmere Carry I, LLC, the special limited partner.</td><td><a href=\"#p0-what-is-a-pe-fund\" title=\"What a PE Fund Is\">0.1</a>, <a href=\"#p1-fund-structures\" title=\"Who's Who: Fund Structures\">1.1</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">I</td></tr>\n    <tr><td><b>Investment Company (ASC 946)</b></td><td>An entity, like a PE fund, whose business is investing for returns and that follows specialized GAAP — chiefly, measuring investments at fair value and not consolidating its portfolio companies.</td><td><a href=\"#p0-why-fund-accounting-differs\" title=\"Why Fund Accounting Is Different\">0.2</a></td></tr>\n    <tr><td><b>Investment Period</b></td><td>The window, set by the LPA, in which the fund may make new investments and call capital for them. Stanmere’s runs five years from final close and ends on 30 Jun 2025, after which the fee basis changes. Most recycling rights expire when it ends.</td><td><a href=\"#p1-how-to-read-an-lpa\" title=\"Reading the LPA\">1.2</a>, <a href=\"#p2-management-fees\" title=\"Management Fees &amp; the Fee Offset\">2.2</a>, <a href=\"#p5-distributions-recallable\" title=\"Distributions\">5.1</a></td></tr>\n    <tr><td><b>Investments, at Cost (1100)</b></td><td>The balance-sheet account that holds what the fund paid for its investments. Fair value marks never post here; they go to a separate unrealized appreciation/(depreciation) account.</td><td><a href=\"#p3-recording-investments\" title=\"Buying an Investment\">3.1</a></td></tr>\n    <tr><td><b>IRR (Internal Rate of Return)</b></td><td>The annual rate that makes the present value of all cash in and out equal zero. Unlike a multiple, it rewards getting cash back sooner.</td><td><a href=\"#p6-performance-metrics\" title=\"Performance &amp; Investor Reports\">6.2</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">L</td></tr>\n    <tr><td><b>Limited Partner (LP)</b></td><td>An outside investor that commits capital and shares in returns but stays passive, with liability limited to the amount it commits.</td><td><a href=\"#p0-what-is-a-pe-fund\" title=\"What a PE Fund Is\">0.1</a></td></tr>\n    <tr><td><b>Limited Partnership Agreement (LPA)</b></td><td>The fund's governing contract. It fixes commitments, closes, the management fee, the waterfall, and the governance provisions every other module assumes you can already find.</td><td><a href=\"#p0-what-is-a-pe-fund\" title=\"What a PE Fund Is\">0.1</a>, <a href=\"#p1-how-to-read-an-lpa\" title=\"Reading the LPA\">1.2</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">M</td></tr>\n    <tr><td><b>Management Company</b></td><td>The firm that employs the deal team and receives the management fee. Its own profit and loss is kept separately from the fund's.</td><td><a href=\"#p1-fund-structures\" title=\"Who's Who: Fund Structures\">1.1</a></td></tr>\n    <tr><td><b>Management Fee</b></td><td>The annual fee the fund pays its manager for running it, set in the LPA as a rate on a stated basis. Stanmere's is 2% a year, billed quarterly in advance.</td><td><a href=\"#p2-management-fees\" title=\"Management Fees &amp; the Fee Offset\">2.2</a></td></tr>\n    <tr><td><b>Manager Overhead</b></td><td>The management company's own costs of running its business: salaries, office rent, its own systems and travel. The manager pays these out of the management fee, not out of the fund.</td><td><a href=\"#p4-accruals-expenses\" title=\"Fund Expenses &amp; Accruals\">4.2</a></td></tr>\n    <tr><td><b>Market Approach vs. Income Approach</b></td><td>The two broad ways to estimate a private company's value. The market approach uses what comparable companies or deals are worth (for example, a multiple of EBITDA). The income approach discounts the company's own projected cash flows back to today.</td><td><a href=\"#p3-fair-value-marks\" title=\"Fair Value Marks\">3.2</a></td></tr>\n    <tr><td><b>Monitoring Fee</b></td><td>A fee a portfolio company pays the manager for ongoing advice and oversight. It is the manager's revenue, not the fund's.</td><td><a href=\"#p2-management-fees\" title=\"Management Fees &amp; the Fee Offset\">2.2</a></td></tr>\n    <tr><td><b>Most-Favored-Nation (MFN) Election</b></td><td>A process that lets eligible LPs elect into favorable terms another LP received in its own side letter, changing only the electing LP's own terms.</td><td><a href=\"#p1-how-to-read-an-lpa\" title=\"Reading the LPA\">1.2</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">N</td></tr>\n    <tr><td><b>Net Asset Value (NAV)</b></td><td>Total assets less total liabilities. For a fund it equals total partners' capital, the figure that is then split among the partners.</td><td><a href=\"#p0-what-is-a-pe-fund\" title=\"What a PE Fund Is\">0.1</a>, <a href=\"#p4-nav-close-cycle\" title=\"The Quarterly Close Cycle\">4.1</a></td></tr>\n    <tr><td><b>Net Change in Unrealized Appreciation/(Depreciation) (6100)</b></td><td>The statement-of-operations line that shows this period's movement in unrealized appreciation: a gain when a mark goes up, a loss when it goes down.</td><td><a href=\"#p0-why-fund-accounting-differs\" title=\"Why Fund Accounting Is Different\">0.2</a>, <a href=\"#p3-fair-value-marks\" title=\"Fair Value Marks\">3.2</a></td></tr>\n    <tr><td><b>Net IRR</b></td><td>The IRR on an investor's own cash flows, after management fees, fund expenses and carried interest. It is the return the investor actually earns.</td><td><a href=\"#p6-performance-metrics\" title=\"Performance &amp; Investor Reports\">6.2</a></td></tr>\n    <tr><td><b>Net Realized Gain/(Loss) on Investments (6000)</b></td><td>The gain or loss a fund locks in only when it disposes of a position, by sale or by write-off. It equals the proceeds received (which can be zero) minus the cost removed from the books. A quarterly mark never moves it.</td><td><a href=\"#p3-realized-vs-unrealized\" title=\"Selling: Realized vs Unrealized\">3.3</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;color:#0F6E56\">O</td></tr>\n    <tr><td><b>Offering Costs</b></td><td>Costs to market a fund and sell interests to investors, such as placement agent fees, offering memorandum costs and roadshow travel. Stanmere charges them directly against partners' capital at the first close.</td><td><a href=\"#p1-org-vs-offering-costs\" title=\"Startup Costs: Org vs Offering\">1.3</a></td></tr>\n    <tr><td><b>Organizational Costs</b></td><td>Legal and administrative costs to form a fund and its general partner as legal entities. Under US GAAP they are expensed as incurred; a fund cannot capitalize them.</td><td><a href=\"#p1-org-vs-offering-costs\" title=\"Startup Costs: Org vs Offering\">1.3</a></td></tr>\n    <tr><td colspan=\"3\" style=\"background:#F5F5F3;font-weight:800;
